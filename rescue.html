<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061819"><title>PCS Manager Rescue</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>:root{--bg:#061819;--card:#0b3032;--line:#1b4d50;--text:#f4ffff;--muted:#a8c4c6;--accent:#e8fbf9;--accentText:#006c69;--danger:#ffb4a8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea{font:inherit}.top{height:72px;background:#1f272a;display:flex;align-items:center;padding:0 18px;position:sticky;top:0;z-index:10}.top b{font-size:28px}.wrap{padding:22px 18px 112px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-weight:800;color:#dff8f6;font-size:13px}.title{font-size:42px;line-height:1;margin:14px 0}.sub{font-size:21px;line-height:1.35;color:#bfe6ff;margin:0 0 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.tile{height:118px;background:var(--card);border:1px solid var(--line);border-radius:24px;color:var(--text);font-size:25px;text-align:left;padding:20px}.row{width:100%;text-align:left;background:#09292b;border:1px solid var(--line);color:var(--text);border-radius:18px;padding:15px;margin:10px 0}.row b{display:block}.row small{display:block;color:var(--muted);margin-top:6px;line-height:1.35}.muted{color:var(--muted)}.err{color:var(--danger);white-space:pre-wrap}.btn{border:0;border-radius:16px;background:var(--accent);color:var(--accentText);font-weight:800;padding:13px 15px}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--accent)}.btn.danger{background:#3a1717;color:var(--danger);border:1px solid #78322c}.field{display:grid;gap:8px;margin:12px 0}.field input,.field textarea{border-radius:16px;border:1px solid var(--line);background:#052122;color:var(--text);padding:15px;font-size:16px}.pill{display:inline-block;background:var(--accent);color:var(--accentText);border-radius:999px;padding:4px 9px;font-size:12px;font-weight:800;margin:8px 6px 0 0}.bottom{position:fixed;left:8px;right:8px;bottom:10px;background:#082326;border:1px solid var(--line);border-radius:28px;padding:9px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;z-index:20}.bottom button{border:0;background:transparent;color:var(--muted);border-radius:20px;padding:10px 4px;font-weight:800;font-size:12px}.bottom button.on{background:var(--accent);color:var(--accentText)}.bottom i{display:block;font-size:22px;font-style:normal;margin-bottom:3px}pre{white-space:pre-wrap;overflow:auto}</style></head><body><div id="app"></div><script>(function(){var API='https://nnlzgertmmxuteozoeel.supabase.co/functions/v1/pcs-ui-api';var OPS='https://nnlzgertmmxuteozoeel.supabase.co/functions/v1/pcs-ops-api';var FIN='https://nnlzgertmmxuteozoeel.supabase.co/functions/v1/pcs-ui-api-v9';var token=localStorage.pcsToken||'';var page='dashboard';function q(s){return document.querySelector(s)}function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}function cut(s,n){s=String(s||'').replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n-1)+'…':s}function call(base,path,opt,ms){opt=opt||{};ms=ms||9000;var c=new AbortController();var t=setTimeout(function(){c.abort()},ms);var h={'content-type':'application/json'};if(token)h.authorization='Bearer '+token;return fetch(base+path,{method:opt.method||'GET',headers:h,body:opt.body,signal:c.signal,cache:'no-store'}).then(function(r){return r.text().then(function(tx){var d={};try{d=tx?JSON.parse(tx):{}}catch(e){}if(r.status===401){localStorage.removeItem('pcsToken');token='';throw new Error('Сессия истекла. Войдите заново.')}if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d})}).catch(function(e){if(e.name==='AbortError')throw new Error('Таймаут загрузки. Нажмите повторить.');throw e}).finally(function(){clearTimeout(t)})}function api(p,o,m){return call(API,p,o,m)}function ops(p,o,m){return call(OPS,p,o,m)}function fin(p,o,m){return call(FIN,p,o,m)}function shell(){var items=[['dashboard','▦','Главная'],['inbox','▣','Входящие'],['bookings','▣','Брони'],['catalog','▦','Каталог'],['more','•••','Ещё']];return '<div class="top"><b>pcs_manager</b></div><main class="wrap" id="main"></main><nav class="bottom">'+items.map(function(x){var on=page===x[0]||(x[0]==='more'&&['finance','calendar','telegram','approvals','status'].indexOf(page)>=0);return '<button class="'+(on?'on':'')+'" data-go="'+x[0]+'"><i>'+x[1]+'</i>'+x[2]+'</button>'}).join('')+'</nav>'}function bindNav(){document.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){draw(b.getAttribute('data-go'))}})}function set(x){q('#main').innerHTML=x}function h(k,t,s){return '<div class="eyebrow">'+esc(k)+'</div><h1 class="title">'+esc(t)+'</h1><p class="sub">'+esc(s)+'</p>'}function login(msg){document.getElementById('app').innerHTML='<div class="top"><b>pcs_manager</b></div><main class="wrap"><div class="card"><h1 class="title">Вход</h1><p class="sub">Rescue-режим PCS</p><div class="field"><label>Пароль администратора</label><input id="pw" type="password" autocomplete="current-password"></div><button class="btn" id="loginBtn">Войти</button><p class="err">'+esc(msg||'')+'</p></div></main>';q('#loginBtn').onclick=function(){api('/login',{method:'POST',body:JSON.stringify({password:q('#pw').value})},9000).then(function(d){token=d.token;localStorage.pcsToken=token;boot()}).catch(function(e){login(e.message)})}}function boot(){try{if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand()}}catch(e){}if(!token)return login();api('/session',{},7000).then(function(){draw('dashboard')}).catch(function(){localStorage.removeItem('pcsToken');token='';login('Сессия истекла. Войдите заново.')})}function draw(p){if(p==='more'){page='more'}else{page=p}document.getElementById('app').innerHTML=shell();bindNav();({dashboard:dashboard,inbox:inbox,bookings:bookings,catalog:catalog,more:more,finance:finance,calendar:calendar,telegram:telegram,approvals:approvals,status:status}[page]||dashboard)()}function showErr(el,e,p){el.innerHTML='<div class="err">'+esc(e.message||e)+'</div><p><button class="btn ghost" data-retry="'+p+'">Повторить</button> <button class="btn danger" id="logoutBtn">Выйти</button></p>';var r=el.querySelector('[data-retry]');if(r)r.onclick=function(){draw(p)};var l=el.querySelector('#logoutBtn');if(l)l.onclick=function(){localStorage.removeItem('pcsToken');location.reload()}}function clientRow(c){return '<button class="row" data-client="'+esc(c.id)+'"><b>'+esc(c.name||c.username||c.telegram_chat_id||'Клиент')+'</b><small>'+esc(cut(c.need||c.summary||c.last_message||'',160))+'</small><span class="pill">'+esc(c.status||'NEW')+'</span>'+(c.priority==='HOT'?'<span class="pill">HOT</span>':'')+'</button>'}function bindClients(){document.querySelectorAll('[data-client]').forEach(function(b){b.onclick=function(){openClient(b.getAttribute('data-client'))}})}function itemRow(x){return '<div class="row"><b>'+esc(x.title||'Позиция')+'</b><small>'+esc((x.category||'')+' · '+(x.status||''))+'</small><span class="pill">'+esc(x.customer_visible===false?'скрыто':'видно')+'</span></div>'}function dashboard(){set(h('Telegram для бизнеса','Главная','Аварийный рабочий режим без старого зависшего bundle.')+'<div class="grid"><button class="tile" data-go="inbox">Входящие</button><button class="tile" data-go="bookings">Брони</button><button class="tile" data-go="catalog">Каталог</button><button class="tile" data-go="calendar">Календарь</button><button class="tile" data-go="finance">Финансы</button><button class="tile" data-go="telegram">Telegram</button></div><div class="card"><b>Последние обращения</b><div id="clients" class="muted">Загрузка…</div></div><div class="card"><b>Ближайшие брони</b><div id="books" class="muted">Загрузка…</div></div>');bindNav();api('/crm',{},9000).then(function(d){var rows=Array.isArray(d)?d:[];q('#clients').innerHTML=rows.slice(0,5).map(clientRow).join('')||'Обращений нет';bindClients()}).catch(function(e){showErr(q('#clients'),e,'dashboard')});ops('/reservations',{},9000).then(function(d){var rows=Array.isArray(d)?d:[];q('#books').innerHTML=rows.slice(0,5).map(function(x){return '<div class="row"><b>'+esc(x.pcs_catalog_items&&x.pcs_catalog_items.title||'Бронь')+'</b><small>'+esc((x.start_date||'')+' → '+(x.end_date||'')+' · '+(x.status||''))+'</small></div>'}).join('')||'Броней нет'}).catch(function(e){showErr(q('#books'),e,'bookings')})}function inbox(){set(h('Telegram для бизнеса','Входящие','Реальные обращения клиентов.')+'<div id="list" class="muted">Загрузка…</div>');api('/crm',{},9000).then(function(d){var rows=Array.isArray(d)?d:[];q('#list').innerHTML=rows.map(clientRow).join('')||'Пока нет обращений';bindClients()}).catch(function(e){showErr(q('#list'),e,'inbox')})}function openClient(id){page='inbox';document.getElementById('app').innerHTML=shell();bindNav();set(h('Клиент','Карточка','Диалог и ручной ответ.')+'<div id="client" class="muted">Загрузка…</div>');api('/crm/'+id,{},9000).then(function(d){var c=d.contact||d;var msgs=d.messages||[];q('#client').innerHTML='<div class="card"><h2>'+esc(c.name||c.username||'Клиент')+'</h2><p class="muted">'+esc(c.summary||c.need||'')+'</p><div class="field"><label>Ответ клиенту</label><textarea id="reply" rows="4"></textarea></div><button class="btn" id="sendBtn">Отправить</button></div><div class="card"><b>Диалог</b>'+((msgs||[]).map(function(m){return '<div class="row"><small>'+esc(m.direction)+':</small><b>'+esc(m.text||'[медиа]')+'</b></div>'}).join('')||'<p class="muted">История пуста</p>')+'</div>';q('#sendBtn').onclick=function(){var text=q('#reply').value.trim();if(!text)return;api('/crm/'+id+'/send',{method:'POST',body:JSON.stringify({text:text})},9000).then(function(){openClient(id)}).catch(function(e){alert(e.message)})}}).catch(function(e){showErr(q('#client'),e,'inbox')})}function bookings(){set(h('Операции','Брони','Заявки и статусы.')+'<div id="bookList" class="muted">Загрузка…</div>');ops('/reservations',{},9000).then(function(d){var rows=Array.isArray(d)?d:[];q('#bookList').innerHTML=rows.map(function(x){return '<div class="row"><b>'+esc(x.pcs_catalog_items&&x.pcs_catalog_items.title||'Бронь')+'</b><small>'+esc((x.start_date||'')+' → '+(x.end_date||'')+' · '+(x.status||''))+'</small></div>'}).join('')||'Броней нет'}).catch(function(e){showErr(q('#bookList'),e,'bookings')})}function catalog(){set(h('Каталог','Каталог','Админский список.')+'<div id="catList" class="muted">Загрузка…</div>');api('/catalog',{},10000).then(function(d){var rows=Array.isArray(d)?d:[];q('#catList').innerHTML=rows.filter(function(x){return !x.deleted_at}).slice(0,150).map(itemRow).join('')||'Каталог пуст'}).catch(function(e){showErr(q('#catList'),e,'catalog')})}function finance(){set(h('Финансы','Финансы','Платежи и чеки.')+'<div id="fin" class="muted">Загрузка…</div>');fin('/finance',{},9000).then(function(d){var rows=Array.isArray(d)?d:[];q('#fin').innerHTML=rows.slice(0,100).map(function(x){return '<div class="row"><b>'+esc((x.amount||0)+' '+(x.currency||''))+'</b><small>'+esc((x.entry_type||'')+' · '+(x.status||'')+' · '+(x.counterparty||''))+'</small></div>'}).join('')||'Финансовых записей нет'}).catch(function(e){showErr(q('#fin'),e,'finance')})}function calendar(){set(h('Календарь','Календарь','Брони по датам.')+'<div id="cal" class="muted">Загрузка…</div>');var now=new Date();var from=now.toISOString().slice(0,10);var to=new Date(now.getTime()+90*86400000).toISOString().slice(0,10);ops('/calendar?from='+from+'&to='+to,{},9000).then(function(d){var rows=Array.isArray(d)?d:(d.reservations||[]);q('#cal').innerHTML=rows.map(function(x){return '<div class="row"><b>'+esc(x.pcs_catalog_items&&x.pcs_catalog_items.title||'Бронь')+'</b><small>'+esc((x.start_date||'')+' → '+(x.end_date||'')+' · '+(x.status||''))+'</small></div>'}).join('')||'В календаре нет броней'}).catch(function(e){showErr(q('#cal'),e,'calendar')})}function telegram(){set(h('Telegram','Telegram','Состояние подключения.')+'<div id="tg" class="muted">Загрузка…</div>');api('/status',{},8000).then(function(d){q('#tg').innerHTML='<pre>'+esc(JSON.stringify(d.connections||d,null,2))+'</pre>'}).catch(function(e){showErr(q('#tg'),e,'telegram')})}function approvals(){set(h('AI','Требуют ответа','Черновики на согласование.')+'<div id="ap" class="muted">Загрузка…</div>');api('/approvals',{},9000).then(function(d){var rows=Array.isArray(d)?d:[];q('#ap').innerHTML=rows.map(function(x){return '<div class="row"><b>'+esc(x.intent||'Клиент')+'</b><small>'+esc(cut(x.answer||x.source_text||'',260))+'</small></div>'}).join('')||'Нет черновиков'}).catch(function(e){showErr(q('#ap'),e,'approvals')})}function status(){set(h('Система','Состояние','Диагностика.')+'<div id="st" class="card">Загрузка…</div>');api('/status',{},9000).then(function(d){q('#st').innerHTML='<pre>'+esc(JSON.stringify(d,null,2))+'</pre>'}).catch(function(e){showErr(q('#st'),e,'status')})}function more(){set(h('Меню','Ещё','Дополнительные разделы.')+'<div class="grid"><button class="tile" data-go="approvals">AI</button><button class="tile" data-go="status">Состояние</button></div><div class="card"><button class="btn danger" id="logout">Выйти</button></div>');bindNav();q('#logout').onclick=function(){localStorage.removeItem('pcsToken');location.reload()}}boot();})();</script></body></html>
