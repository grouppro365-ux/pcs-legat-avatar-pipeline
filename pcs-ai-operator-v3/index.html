<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f2ec"><title>PCS AI Operator</title><style>:root{--bg:#f6f2ec;--panel:#fffdf9;--ink:#252830;--muted:#7f8189;--line:#e6ded5;--lav:#e9e1f6;--sage:#e3ebdd;--blue:#dfeaf5;--peach:#f2ded3;--warn:#f5eabc;--bad:#f2d8d8;--ok:#4f7f61;--shadow:0 14px 40px rgba(37,40,48,.09)}[data-theme=dark]{--bg:#17191e;--panel:#22262d;--ink:#f5f1ea;--muted:#a8acb4;--line:#353a44;--lav:#40374f;--sage:#344139;--blue:#303c49;--peach:#4a3832;--warn:#514a2d;--bad:#4a3030;--ok:#8bc49a;--shadow:0 16px 45px rgba(0,0,0,.28)}*{box-sizing:border-box}html,body{margin:0;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit;min-width:0}button{cursor:pointer}.top{height:66px;position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:10px 16px;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.logo{width:44px;height:44px;border-radius:15px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:900;letter-spacing:-.03em}.brand{font-size:18px;font-weight:850}.spacer{flex:1}.iconbtn{width:44px;height:44px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:14px}.layout{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100dvh - 66px)}.side{padding:18px 14px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--panel) 48%,transparent)}.nav{display:grid;gap:8px}.nav button{min-height:46px;border:0;background:transparent;color:var(--muted);text-align:left;padding:12px 14px;border-radius:15px;font-weight:750}.nav button.on{background:var(--lav);color:var(--ink)}main{width:min(100%,1320px);margin:0 auto;padding:30px clamp(20px,3vw,42px) 50px;min-width:0}.eyebrow{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:#9b85b7;font-weight:850}.title{font-size:clamp(34px,4vw,48px);line-height:1.02;letter-spacing:-.045em;margin:8px 0 10px}.sub{color:var(--muted);margin:0 0 18px;max-width:760px;overflow-wrap:anywhere}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.metric{min-height:118px;border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between}.metric:nth-child(1){background:linear-gradient(145deg,var(--panel),var(--lav))}.metric:nth-child(2){background:linear-gradient(145deg,var(--panel),var(--blue))}.metric:nth-child(3){background:linear-gradient(145deg,var(--panel),var(--sage))}.metric:nth-child(4){background:linear-gradient(145deg,var(--panel),var(--peach))}.metric small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.metric b{font-size:35px;line-height:1}.card,.item{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}.card{border-radius:24px;padding:18px;margin-top:16px}.item{border-radius:19px;padding:16px;min-width:0}.item h3,.card h2{margin:0 0 8px}.item p{color:var(--muted);overflow-wrap:anywhere}.list{display:grid;gap:12px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.btn{min-height:44px;border:0;border-radius:14px;padding:10px 14px;background:var(--ink);color:var(--bg);font-weight:800}.btn.soft{background:var(--lav);color:var(--ink)}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;background:var(--sage);font-size:12px}.pill.warn{background:var(--warn)}.pill.bad{background:var(--bad)}.pills{display:flex;gap:7px;flex-wrap:wrap}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:750}.field input,.field textarea,.field select{width:100%;padding:12px 13px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);outline:none}.field textarea{min-height:110px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#9e87bb;box-shadow:0 0 0 3px color-mix(in srgb,var(--lav) 72%,transparent)}.status-list{display:grid;gap:10px}.status-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.status-name{font-weight:800}.status-badge{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 10px;background:var(--sage);font-size:12px;font-weight:750}.status-badge.warn{background:var(--warn)}.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}.sheet{display:none;position:fixed;inset:0;z-index:80;background:rgba(12,14,18,.42);align-items:flex-end}.sheet.on{display:flex}.sheetbox{width:min(760px,100%);max-height:92dvh;overflow:auto;margin:0 auto;background:var(--panel);border-radius:28px 28px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -16px 54px rgba(0,0,0,.18)}.sheethead{position:sticky;top:-18px;display:flex;align-items:center;gap:10px;padding:18px 0 12px;background:var(--panel);z-index:2}.sheethead h2{margin:0}.bottom{display:none}.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));z-index:100;transform:translate(-50%,12px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:14px;transition:.2s;max-width:calc(100vw - 28px)}.toast.on{opacity:1;transform:translate(-50%,0)}.login{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 80% 10%,var(--lav),transparent 38%),var(--bg)}.loginbox{width:min(470px,100%);background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:28px;box-shadow:var(--shadow)}.loginbox h1{font-size:clamp(34px,8vw,42px);line-height:1.04;margin:12px 0}.error{color:#b55b5b;margin-top:10px}.empty{padding:26px 12px;text-align:center;color:var(--muted)}@media(max-width:1024px){.layout{grid-template-columns:210px minmax(0,1fr)}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}@media(max-width:768px){.top{height:60px;padding:8px 14px}.logo{width:40px;height:40px;border-radius:13px}.brand{font-size:16px}.layout{display:block}.side{display:none}main{width:100%;padding:18px 16px calc(96px + env(safe-area-inset-bottom))}.title{font-size:34px}.sub{font-size:14px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{min-height:98px;padding:14px;border-radius:19px}.metric small{font-size:9.5px}.metric b{font-size:29px}.card{padding:14px;border-radius:20px;margin-top:12px}.item{padding:14px;border-radius:18px}.grid2{grid-template-columns:1fr;gap:12px}.toolbar .btn{flex:1 1 130px}.bottom{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:55;padding:5px;border:1px solid var(--line);border-radius:19px;background:color-mix(in srgb,var(--panel) 96%,transparent);backdrop-filter:blur(18px);box-shadow:0 15px 44px rgba(37,40,48,.14)}.bottom button{min-height:50px;min-width:0;border:0;background:transparent;color:var(--muted);border-radius:14px;padding:6px 2px;font-size:10px;font-weight:750}.bottom button.on{background:var(--lav);color:var(--ink)}.sheet{align-items:stretch;padding-top:max(24px,env(safe-area-inset-top))}.sheetbox{height:100%;max-height:100%;border-radius:24px 24px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}.sheethead{top:-16px;padding:16px 0 12px}}@media(max-width:430px){main{padding-left:14px;padding-right:14px}.brand{font-size:15px}.title{font-size:31px}.metric{min-height:92px;padding:13px}.metric b{font-size:27px}.item p{font-size:14px}.status-row{gap:8px;padding:13px 14px}.status-name{font-size:14px}.status-badge{font-size:10.5px;padding:6px 8px}}@media(max-width:360px){main{padding-left:12px;padding-right:12px}.top{padding-left:12px;padding-right:12px}.metrics{gap:8px}.toolbar .btn{flex:1 1 100%}.bottom{left:6px;right:6px}.bottom button{font-size:9px}.status-badge{max-width:130px;white-space:normal;text-align:right}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}</style></head><body><div id="root"></div><div id="toast" class="toast"></div><script>const API='https://nnlzgertmmxuteozoeel.supabase.co/functions/v1/pcs-ui-api';let token=localStorage.pcsToken||'';let state={page:'inbox',kb:[],editing:null};const $=s=>document.querySelector(s);const pages={inbox:'Входящие',approvals:'Ответы',kb:'База знаний',connect:'Подключения',status:'Состояние'};const esc=(s='')=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}async function call(path,opt={}){const h={'content-type':'application/json',...(opt.headers||{})};if(token)h.authorization='Bearer '+token;const r=await fetch(API+path,{...opt,headers:h});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'HTTP '+r.status);return d}function shell(){const nav=[['inbox','Входящие'],['approvals','Требуют ответа'],['kb','База знаний'],['connect','Подключения'],['status','Состояние']];const bot=[['inbox','Входящие'],['approvals','Ответы'],['kb','База'],['connect','Связи'],['status','Статус']];return `<div class="top"><div class="logo">PCS</div><div class="brand">PCS AI Operator</div><div class="spacer"></div><button class="iconbtn" aria-label="Сменить тему" onclick="theme()">◐</button></div><div class="layout"><aside class="side"><div class="nav">${nav.map(x=>`<button class="${state.page===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</div></aside><main id="main"></main></div><div class="bottom">${bot.map(x=>`<button class="${state.page===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</div>`}function theme(){const n=(document.body.dataset.theme||'light')==='dark'?'light':'dark';document.body.dataset.theme=n;localStorage.pcsTheme=n}async function login(){document.body.dataset.theme=localStorage.pcsTheme||'light';$('#root').innerHTML=`<div class="login"><div class="loginbox"><div class="eyebrow">Premium Concierge Service Thailand</div><h1>PCS AI Operator</h1><p class="sub">Защищённая рабочая панель Telegram Business</p><div class="field"><label>Пароль администратора</label><input id="pw" type="password" autocomplete="current-password"></div><button class="btn" style="width:100%;margin-top:14px" onclick="doLogin()">Войти</button><div id="le" class="error"></div></div></div>`}async function doLogin(){try{const d=await call('/login',{method:'POST',body:JSON.stringify({password:$('#pw').value})});token=d.token;localStorage.pcsToken=token;await render()}catch(e){$('#le').textContent=e.message}}async function render(){document.body.dataset.theme=localStorage.pcsTheme||'light';if(!token)return login();try{await call('/session')}catch{token='';localStorage.removeItem('pcsToken');return login()}$('#root').innerHTML=shell();await renderPage()}async function go(p){state.page=p;await render()}async function renderPage(){const m=$('#main');try{if(state.page==='inbox')return inbox(m);if(state.page==='approvals')return approvals(m);if(state.page==='kb')return kb(m);if(state.page==='connect')return connect(m);return statusPage(m)}catch(e){m.innerHTML=`<div class="card"><b>Ошибка</b><p>${esc(e.message)}</p></div>`}}async function inbox(m){const [s,items]=await Promise.all([call('/status'),call('/inbox')]);m.innerHTML=`<div class="eyebrow">Telegram Business</div><h1 class="title">Входящие</h1><p class="sub">Реальные диалоги, AI-черновики, CRM и следующий шаг.</p><div class="metrics"><div class="metric"><small>Новые</small><b>${s.new_count||0}</b></div><div class="metric"><small>Требуют ответа</small><b>${s.approval_count||0}</b></div><div class="metric"><small>Горячие</small><b>${s.hot_count||0}</b></div><div class="metric"><small>Сегодня</small><b>${s.today_count||0}</b></div></div><div class="card"><h2>Диалоги</h2><div class="list">${items.length?items.map(x=>`<div class="item"><h3>${esc(x.name||x.username||'Клиент')}</h3><div class="pills"><span class="pill">${esc(x.intent||'новый')}</span><span class="pill">${esc(x.status||'NEW')}</span></div><p>${esc(x.last_message||'Нет сообщений')}</p></div>`).join(''):'<div class="empty">Пока нет сообщений.</div>'}</div></div>`}async function approvals(m){const a=await call('/approvals');m.innerHTML=`<div class="eyebrow">Контроль AI</div><h1 class="title">Требуют ответа</h1><p class="sub">Ответы, которые требуют подтверждения оператора.</p><div class="list">${a.length?a.map(x=>`<div class="item"><h3>${esc(x.contact_name||'Клиент')}</h3><p><b>Клиент:</b> ${esc(x.source_text||'')}</p><p><b>AI:</b> ${esc(x.answer||'')}</p><div class="pills"><span class="pill warn">${esc(x.policy_reason||'Согласование')}</span></div><div class="toolbar" style="margin-top:12px"><button class="btn" onclick="approve('${x.id}')">Отправить</button><button class="btn ghost" onclick="rejectA('${x.id}')">Отклонить</button></div></div>`).join(''):'<div class="card"><div class="empty">Очередь пуста.</div></div>'}</div>`}async function approve(id){try{await call('/approvals/'+id+'/send',{method:'POST'});toast('Отправлено');await renderPage()}catch(e){toast(e.message)}}async function rejectA(id){try{await call('/approvals/'+id+'/reject',{method:'POST'});toast('Отклонено');await renderPage()}catch(e){toast(e.message)}}async function kb(m){state.kb=await call('/knowledge');m.innerHTML=`<div class="eyebrow">Актуальная информация PCS</div><h1 class="title">База знаний</h1><p class="sub">AI использует только активные записи, разрешённые для клиента.</p><div class="toolbar"><button class="btn" onclick="openKb()">+ Добавить запись</button></div><div class="list" style="margin-top:16px">${state.kb.map(x=>`<div class="item"><h3>${esc(x.title)}</h3><div class="pills"><span class="pill ${x.visibility==='approval_only'?'warn':x.visibility==='internal_only'?'bad':''}">${x.visibility==='customer_safe'?'Можно клиенту':x.visibility==='approval_only'?'С согласованием':'Внутреннее'}</span><span class="pill">rev ${x.revision||1}</span></div><p>${esc(x.description)}</p><button class="btn soft" onclick="openKb('${x.id}')">Редактировать</button></div>`).join('')}</div><div id="sheet" class="sheet" onclick="if(event.target===this)closeKb()"><div class="sheetbox"><div class="sheethead"><h2 id="shTitle">Запись</h2><div class="spacer"></div><button class="iconbtn" onclick="closeKb()">×</button></div><div class="grid2"><div class="field"><label>Название</label><input id="kTitle"></div><div class="field"><label>Категория</label><input id="kCat"></div></div><div class="field" style="margin-top:12px"><label>Описание</label><textarea id="kDesc"></textarea></div><div class="grid2" style="margin-top:12px"><div class="field"><label>Доступ</label><select id="kVis"><option value="customer_safe">Можно клиенту</option><option value="approval_only">С согласованием</option><option value="internal_only">Внутреннее</option></select></div><div class="field"><label>Автоответ</label><select id="kAuto"><option value="true">Разрешён</option><option value="false">Запрещён</option></select></div></div><div class="grid2" style="margin-top:12px"><div class="field"><label>Цена</label><input id="kPrice" inputmode="decimal"></div><div class="field"><label>Валюта</label><input id="kCur" placeholder="THB"></div></div><div class="field" style="margin-top:12px"><label>Источник</label><input id="kSrc"></div><div class="field" style="margin-top:12px"><label>Инструкция AI</label><textarea id="kGuide"></textarea></div><button class="btn" style="width:100%;margin-top:14px" onclick="saveKb()">Сохранить</button></div></div>`}function openKb(id){state.editing=id||null;const x=state.kb.find(v=>v.id===id)||{};$('#shTitle').textContent=id?'Редактировать запись':'Новая запись';$('#kTitle').value=x.title||'';$('#kCat').value=x.category||'';$('#kDesc').value=x.description||'';$('#kVis').value=x.visibility||'customer_safe';$('#kAuto').value=String(!!x.auto_answer_allowed);$('#kPrice').value=x.price??'';$('#kCur').value=x.currency||'';$('#kSrc').value=x.source||'';$('#kGuide').value=x.answer_guidance||'';$('#sheet').classList.add('on');document.body.style.overflow='hidden'}function closeKb(){const s=$('#sheet');if(s)s.classList.remove('on');document.body.style.overflow=''}async function saveKb(){const b={title:$('#kTitle').value.trim(),category:$('#kCat').value.trim(),description:$('#kDesc').value.trim(),visibility:$('#kVis').value,auto_answer_allowed:$('#kAuto').value==='true',price:$('#kPrice').value?Number($('#kPrice').value):null,currency:$('#kCur').value.trim()||null,source:$('#kSrc').value.trim()||null,answer_guidance:$('#kGuide').value.trim()||null};if(!b.title||!b.category||!b.description)return toast('Заполните название, категорию и описание');try{await call(state.editing?'/knowledge/'+state.editing:'/knowledge',{method:state.editing?'PATCH':'POST',body:JSON.stringify(b)});toast('Сохранено');closeKb();await kb($('#main'))}catch(e){toast(e.message)}}async function connect(m){const s=await call('/settings');m.innerHTML=`<div class="eyebrow">Интеграции</div><h1 class="title">Подключения</h1><p class="sub">Секреты хранятся только server-side.</p><div class="grid2"><div class="card"><h2>Telegram Business</h2><p class="sub">@pcs_manager_bot</p><div class="field"><label>Bot Token</label><input id="tgToken" type="password" placeholder="${s.configured?.telegram_bot_token?'Настроено':'Вставьте токен'}"></div><div class="toolbar" style="margin-top:12px"><button class="btn soft" onclick="saveSettings()">Сохранить</button><button class="btn ghost" onclick="testTg()">Проверить</button><button class="btn" onclick="installWh()">Webhook</button></div></div><div class="card"><h2>TokenRouter · Kimi K3</h2><div class="field"><label>API Key</label><input id="trKey" type="password" placeholder="${s.configured?.tokenrouter_key?'Настроено':'Вставьте ключ'}"></div><div class="field" style="margin-top:10px"><label>Модель</label><input id="trModel" value="${esc(s.tokenrouter_model||'moonshotai/kimi-k3')}"></div><div class="toolbar" style="margin-top:12px"><button class="btn soft" onclick="saveSettings()">Сохранить</button><button class="btn ghost" onclick="testTR()">Проверить</button></div></div></div>`}async function saveSettings(){try{await call('/settings',{method:'PUT',body:JSON.stringify({telegram_bot_token:$('#tgToken')?.value||'',tokenrouter_key:$('#trKey')?.value||'',tokenrouter_model:$('#trModel')?.value||'moonshotai/kimi-k3'})});toast('Настройки сохранены')}catch(e){toast(e.message)}}async function testTg(){try{const x=await call('/test/telegram',{method:'POST'});toast('Telegram: @'+(x.username||'OK'))}catch(e){toast(e.message)}}async function installWh(){try{await call('/telegram/install-webhook',{method:'POST'});toast('Webhook установлен')}catch(e){toast(e.message)}}async function testTR(){try{await call('/test/tokenrouter',{method:'POST'});toast('TokenRouter работает')}catch(e){toast(e.message)}}async function statusPage(m){const s=await call('/status');const rows=[['Backend','Работает',false],['База данных','Работает',false],['Telegram Bot',s.configured?.telegram_bot_token?'Настроен':'Не настроен',!s.configured?.telegram_bot_token],['Telegram Business',s.business_can_reply?'Может отвечать':'Нет права ответа',!s.business_can_reply],['AI · Kimi K3',s.configured?.tokenrouter_key?'Настроен':'Не настроен',!s.configured?.tokenrouter_key],['Auto-send',s.auto_send?'Включён':'Выключен',!s.auto_send]];m.innerHTML=`<div class="eyebrow">Диагностика</div><h1 class="title">Состояние системы</h1><p class="sub">Только реальные состояния production-контура.</p><div class="status-list">${rows.map(r=>`<div class="status-row"><div><div class="status-name">${r[0]}</div></div><div class="status-badge ${r[2]?'warn':''}"><span class="dot"></span>${r[1]}</div></div>`).join('')}</div>`}render();</script></body></html>
