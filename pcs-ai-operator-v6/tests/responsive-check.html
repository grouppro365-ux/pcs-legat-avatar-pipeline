<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PCS — проверка адаптивности</title>
<style>body{margin:0;padding:12px;background:#e8edf0;color:#18333c;font:14px system-ui}header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}button{padding:10px;border:1px solid #9aaeb7;background:white;border-radius:8px;cursor:pointer}button[aria-pressed=true]{background:#007f8c;color:white}iframe{display:block;width:390px;height:844px;background:white;border:1px solid #afbec5;margin:auto;max-width:100%}small{display:block}p{margin:0}</style>
<header><p><b>Реальная панель PCS</b><small>Проверка CSS в узком окне; не эмуляция iOS/Telegram.</small></p><button type="button" data-width="360" aria-pressed="false">360</button><button type="button" data-width="390" aria-pressed="true">390</button><button type="button" data-width="430" aria-pressed="false">430</button><button type="button" data-width="820" aria-pressed="false">820</button><span id="size" role="status">390 × 844</span></header>
<iframe src="../index.html" title="Панель PCS при ширине 390 пикселей"></iframe>
<script>const frame=document.querySelector('iframe');document.querySelector('header').addEventListener('click',e=>{const b=e.target.closest('[data-width]');if(!b)return;frame.style.width=b.dataset.width+'px';frame.title='Панель PCS при ширине '+b.dataset.width+' пикселей';document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.getElementById('size').textContent=b.dataset.width+' × 844';});</script></html>
