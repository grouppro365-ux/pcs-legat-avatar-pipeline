<link rel="stylesheet" href="../contracts-ui.css?v=20261003-history1"><link rel="stylesheet" href="../prospect-source-controls.css?v=20261006-source1"><link rel="stylesheet" href="../catalog-create.css?v=20261007-create1"></head><body><p class="pill warn">ТЕСТОВЫЕ ДАННЫЕ · без записи в базу</p><main><h1>Галерея PCS</h1><button class="btn" onclick="mediaManager('11111111-1111-4111-8111-111111111111')">Фото тестовой карточки</button><label>Ответ тестового сервера <select id="testMode"><option value="success">Успех</option><option value="failure">Ошибка</option></select></label></main><div id="sheet" class="sheet"><div id="sheetbox" class="sheetbox"></div></div><p id="testResult" role="status"></p><script>
window.PCS={catalog:[{id:'11111111-1111-4111-8111-111111111111',title:'Тестовая карточка',media_items:[]}]};
window.$=s=>document.querySelector(s);
window.esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
window.closeSheet=()=>{document.getElementById('sheet').classList.remove('on');document.body.classList.remove('sheet-open')};
window.openSheet=(title,body)=>{document.getElementById('sheetbox').innerHTML='<div class="sheethead"><button class="iconbtn" onclick="closeSheet()">×</button><h2>'+esc(title)+'</h2></div><p class="pill warn">ТЕСТОВЫЕ ДАННЫЕ · без записи в базу</p>'+body;document.getElementById('sheet').classList.add('on');document.body.classList.add('sheet-open')};
window.toast=msg=>document.getElementById('testResult').textContent=msg;
const picture=label=>'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300"><rect width="400" height="300" fill="#e6f1ef"/><text x="200" y="150" text-anchor="middle" font-size="30" fill="#214d49">'+label+'</text></svg>');
let photos=[{id:'photo-a',gallery_version:'a'.repeat(32),public_url:picture('Тест A')},{id:'photo-b',gallery_version:'a'.repeat(32),public_url:picture('Тест Б')}];
window.call=async(path,opt={})=>{
 if(!opt.method)return photos.map(x=>({...x}));
 await new Promise(resolve=>setTimeout(resolve,500));
 if(document.getElementById('testMode').value==='failure')throw Error('Тестовый сбой — фотографии сохранены');
 if(opt.method==='DELETE'){const ids=opt.body?JSON.parse(opt.body).ids:[path.split('/').pop()];photos=photos.filter(x=>!ids.includes(x.id));return{ok:true,deleted:ids}}
 if(path.endsWith('/order')){const ids=JSON.parse(opt.body).ids;photos=ids.map(id=>photos.find(x=>x.id===id));return{ok:true,id:'11111111-1111-4111-8111-111111111111',ids}}
 return {ok:true};
};
</script><script src="../media.js?v=20261008-photo3"></script></body></html>
