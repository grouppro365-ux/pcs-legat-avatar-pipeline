name: Build Agency Browser Harness Opera
on:
  push:
    branches:
      - agent/browser-harness-opera-minimal

permissions:
  contents: write

jobs:
  verify-package-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        working-directory: browser-harness-opera
        run: |
          for f in bootstrap.js target_tracker.js browser_harness_client.js browser_harness_core.js planner_protocol.js service_worker.js workbench.js tests/planner_protocol_test.js tests/core_test.js tests/static_checks.js; do
            node --check "$f"
          done

      - name: Browser Harness core tests
        working-directory: browser-harness-opera
        run: node tests/core_test.js

      - name: Planner protocol regression
        working-directory: browser-harness-opera
        run: node tests/planner_protocol_test.js

      - name: Agency Dev Core / RUflo static gates
        working-directory: browser-harness-opera
        run: node tests/static_checks.js

      - name: Build one Opera-ready folder
        run: |
          rm -rf dist Agency-Browser-Harness-Opera-v0.1.1.zip Agency-Browser-Harness-Opera-v0.1.1.zip.sha256
          mkdir -p dist/Agency-Browser-Harness
          cp browser-harness-opera/manifest.json dist/Agency-Browser-Harness/
          cp browser-harness-opera/bootstrap.js dist/Agency-Browser-Harness/
          cp browser-harness-opera/target_tracker.js dist/Agency-Browser-Harness/
          cp browser-harness-opera/browser_harness_client.js dist/Agency-Browser-Harness/
          cp browser-harness-opera/browser_harness_core.js dist/Agency-Browser-Harness/
          cp browser-harness-opera/planner_protocol.js dist/Agency-Browser-Harness/
          cp browser-harness-opera/service_worker.js dist/Agency-Browser-Harness/
          cp browser-harness-opera/workbench.html dist/Agency-Browser-Harness/
          cp browser-harness-opera/workbench.js dist/Agency-Browser-Harness/
          cp browser-harness-opera/README.md dist/Agency-Browser-Harness/
          cp browser-harness-opera/LICENSE.browser-harness.txt dist/Agency-Browser-Harness/
          test -f dist/Agency-Browser-Harness/manifest.json
          test "$(find dist -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1

      - name: Release-folder smoke
        run: |
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('dist/Agency-Browser-Harness/manifest.json','utf8')); if(m.manifest_version!==3||m.version!=='0.1.1'||m.background.service_worker!=='bootstrap.js') process.exit(1); console.log('manifest PASS')"
          for f in dist/Agency-Browser-Harness/*.js; do node --check "$f"; done
          grep -q 'class Driver' dist/Agency-Browser-Harness/browser_harness_core.js
          grep -q 'class ElementProxy' dist/Agency-Browser-Harness/browser_harness_core.js
          grep -q 'waitFor(condition' dist/Agency-Browser-Harness/browser_harness_core.js
          grep -q 'sendMutationOnce' dist/Agency-Browser-Harness/browser_harness_core.js
          grep -q 'navigation_after_delivery_loss' dist/Agency-Browser-Harness/browser_harness_core.js
          grep -q 'collectRequestScopedObjects' dist/Agency-Browser-Harness/planner_protocol.js
          grep -q 'new Driver(chatTab.id)' dist/Agency-Browser-Harness/service_worker.js
          grep -q 'chatDriver.read({maxChars:60000, tail:true})' dist/Agency-Browser-Harness/service_worker.js
          grep -q 'pendingChildTabId' dist/Agency-Browser-Harness/target_tracker.js
          ! grep -q 'data-message-author-role' dist/Agency-Browser-Harness/service_worker.js
          ! grep -q 'activeRequest' dist/Agency-Browser-Harness/service_worker.js
          ! grep -Eq 'api\.openai\.com|OPENAI_API_KEY|OpenRouter|TokenRouter' dist/Agency-Browser-Harness/*.js

      - name: ZIP integrity and SHA256
        run: |
          (cd dist/Agency-Browser-Harness && sha256sum * > SHA256SUMS.txt)
          (cd dist && zip -qr ../Agency-Browser-Harness-Opera-v0.1.1.zip Agency-Browser-Harness)
          unzip -t Agency-Browser-Harness-Opera-v0.1.1.zip
          unzip -l Agency-Browser-Harness-Opera-v0.1.1.zip | grep 'Agency-Browser-Harness/manifest.json'
          sha256sum Agency-Browser-Harness-Opera-v0.1.1.zip > Agency-Browser-Harness-Opera-v0.1.1.zip.sha256

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agency-Browser-Harness-Opera-v0.1.1
          path: |
            Agency-Browser-Harness-Opera-v0.1.1.zip
            Agency-Browser-Harness-Opera-v0.1.1.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish persistent GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES='v0.1.1 fixes the live 0/50 stall observed when ChatGPT had already rendered a valid planner JSON. Response extraction is now anchored to the exact requestId and no longer depends on parse state from the rest of the chat transcript. Direct minimal adaptation of scriby/browser-harness (MIT); no paid OpenAI API. Static/unit/package gates passed; live Opera E2E still required before unattended production use.'
          if gh release view abh-v0.1.1 >/dev/null 2>&1; then
            gh release upload abh-v0.1.1 Agency-Browser-Harness-Opera-v0.1.1.zip Agency-Browser-Harness-Opera-v0.1.1.zip.sha256 --clobber
            gh release edit abh-v0.1.1 --target "$GITHUB_SHA" --notes "$NOTES"
          else
            gh release create abh-v0.1.1 Agency-Browser-Harness-Opera-v0.1.1.zip Agency-Browser-Harness-Opera-v0.1.1.zip.sha256 --target "$GITHUB_SHA" --title 'Agency Browser Harness v0.1.1' --notes "$NOTES"
          fi
