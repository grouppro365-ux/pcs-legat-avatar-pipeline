name: Build Agency Browser Harness Opera
on:
  push:
    branches:
      - agent/browser-harness-opera-minimal

permissions:
  contents: write

jobs:
  verify-package-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        working-directory: browser-harness-opera
        run: |
          for f in bootstrap.js target_tracker.js browser_harness_client.js browser_harness_core.js planner_protocol.js service_worker.js chatgpt_observer.js workbench.js seo_article_writer_tatyana.js tests/planner_protocol_test.js tests/core_test.js tests/seo_skill_integration_test.js tests/chat_observer_static_test.js tests/static_checks.js; do
            node --check "$f"
          done

      - name: Browser Harness core tests
        working-directory: browser-harness-opera
        run: node tests/core_test.js

      - name: Planner protocol regression
        working-directory: browser-harness-opera
        run: node tests/planner_protocol_test.js

      - name: Embedded SEO skill integration regression
        working-directory: browser-harness-opera
        run: node tests/seo_skill_integration_test.js

      - name: Event-driven ChatGPT observer regression
        working-directory: browser-harness-opera
        run: node tests/chat_observer_static_test.js

      - name: Agency Dev Core / RUflo static gates
        working-directory: browser-harness-opera
        run: node tests/static_checks.js

      - name: Build one Opera-ready folder
        run: |
          rm -rf dist Agency-Browser-Harness-Opera-v0.3.0.zip Agency-Browser-Harness-Opera-v0.3.0.zip.sha256
          mkdir -p dist/Agency-Browser-Harness/skills/seo-article-writer-tatyana
          cp browser-harness-opera/manifest.json dist/Agency-Browser-Harness/
          cp browser-harness-opera/bootstrap.js dist/Agency-Browser-Harness/
          cp browser-harness-opera/target_tracker.js dist/Agency-Browser-Harness/
          cp browser-harness-opera/browser_harness_client.js dist/Agency-Browser-Harness/
          cp browser-harness-opera/browser_harness_core.js dist/Agency-Browser-Harness/
          cp browser-harness-opera/planner_protocol.js dist/Agency-Browser-Harness/
          cp browser-harness-opera/service_worker.js dist/Agency-Browser-Harness/
          cp browser-harness-opera/chatgpt_observer.js dist/Agency-Browser-Harness/
          cp browser-harness-opera/seo_article_writer_tatyana.js dist/Agency-Browser-Harness/
          cp browser-harness-opera/workbench.html dist/Agency-Browser-Harness/
          cp browser-harness-opera/workbench.js dist/Agency-Browser-Harness/
          cp browser-harness-opera/README.md dist/Agency-Browser-Harness/
          cp browser-harness-opera/LICENSE.browser-harness.txt dist/Agency-Browser-Harness/
          cp browser-harness-opera/skills/seo-article-writer-tatyana/SKILL.md dist/Agency-Browser-Harness/skills/seo-article-writer-tatyana/
          test -f dist/Agency-Browser-Harness/manifest.json
          test -f dist/Agency-Browser-Harness/chatgpt_observer.js
          test -f dist/Agency-Browser-Harness/skills/seo-article-writer-tatyana/SKILL.md
          test "$(find dist -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1

      - name: Release-folder smoke
        run: |
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('dist/Agency-Browser-Harness/manifest.json','utf8')); if(m.manifest_version!==3||m.version!=='0.3.0'||m.background.service_worker!=='bootstrap.js') process.exit(1); const c=m.content_scripts.find(x=>(x.matches||[]).some(y=>y.includes('chatgpt.com'))); if(!c||!c.js.includes('chatgpt_observer.js')) process.exit(2); console.log('manifest PASS')"
          for f in dist/Agency-Browser-Harness/*.js; do node --check "$f"; done
          grep -q 'class Driver' dist/Agency-Browser-Harness/browser_harness_core.js
          grep -q 'class ElementProxy' dist/Agency-Browser-Harness/browser_harness_core.js
          grep -q 'waitFor(condition' dist/Agency-Browser-Harness/browser_harness_core.js
          grep -q 'new MutationObserver' dist/Agency-Browser-Harness/chatgpt_observer.js
          grep -q 'ABH_CHAT_RESPONSE' dist/Agency-Browser-Harness/chatgpt_observer.js
          grep -q 'waiting_chatgpt' dist/Agency-Browser-Harness/service_worker.js
          grep -q 'executePlannerBundle' dist/Agency-Browser-Harness/service_worker.js
          grep -q 'BATCH_MAX_STEPS = 500' dist/Agency-Browser-Harness/service_worker.js
          grep -q 'BATCH_SCOPE_INCOMPLETE' dist/Agency-Browser-Harness/service_worker.js
          grep -q 'PROGRESS_COMPLETED_REQUIRES_VERIFY_STEP' dist/Agency-Browser-Harness/planner_protocol.js
          grep -q 'MAX_ACTION_BUNDLE = 12' dist/Agency-Browser-Harness/planner_protocol.js
          grep -q 'name: seo-article-writer-tatyana' dist/Agency-Browser-Harness/skills/seo-article-writer-tatyana/SKILL.md
          grep -q 'IndexNow alone is never' dist/Agency-Browser-Harness/seo_article_writer_tatyana.js
          ! grep -q 'CHATGPT_RESPONSE_TIMEOUT' dist/Agency-Browser-Harness/service_worker.js
          ! grep -q 'waitPlannerResponse' dist/Agency-Browser-Harness/service_worker.js
          ! grep -Eq 'api\.openai\.com|OPENAI_API_KEY|OpenRouter|TokenRouter' dist/Agency-Browser-Harness/*.js

      - name: ZIP integrity and SHA256
        run: |
          (cd dist/Agency-Browser-Harness && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd dist && zip -qr ../Agency-Browser-Harness-Opera-v0.3.0.zip Agency-Browser-Harness)
          unzip -t Agency-Browser-Harness-Opera-v0.3.0.zip
          unzip -l Agency-Browser-Harness-Opera-v0.3.0.zip | grep 'Agency-Browser-Harness/manifest.json'
          unzip -l Agency-Browser-Harness-Opera-v0.3.0.zip | grep 'Agency-Browser-Harness/chatgpt_observer.js'
          unzip -l Agency-Browser-Harness-Opera-v0.3.0.zip | grep 'Agency-Browser-Harness/skills/seo-article-writer-tatyana/SKILL.md'
          sha256sum Agency-Browser-Harness-Opera-v0.3.0.zip > Agency-Browser-Harness-Opera-v0.3.0.zip.sha256

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agency-Browser-Harness-Opera-v0.3.0
          path: |
            Agency-Browser-Harness-Opera-v0.3.0.zip
            Agency-Browser-Harness-Opera-v0.3.0.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish persistent GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES='v0.3.0 replaces long ChatGPT response polling with an event-driven content observer that persists the exact requestId response and wakes the MV3 service worker. Pending waits survive service-worker sleep/restart and are recovered without resending confirmed/uncertain prompts. The planner can return small local action bundles (max 12) so deterministic same-page work such as article/content/Rank Math field edits can execute without a ChatGPT round-trip per click. Browser Harness Driver/ElementProxy remains the execution base. seo-article-writer-tatyana remains embedded and task-conditional. Static/unit/package gates passed. This is a live-E2E candidate; do not call production-ready until the user Opera run completes at least three real articles consecutively.'
          if gh release view abh-v0.3.0 >/dev/null 2>&1; then
            gh release upload abh-v0.3.0 Agency-Browser-Harness-Opera-v0.3.0.zip Agency-Browser-Harness-Opera-v0.3.0.zip.sha256 --clobber
            gh release edit abh-v0.3.0 --target "$GITHUB_SHA" --notes "$NOTES"
          else
            gh release create abh-v0.3.0 Agency-Browser-Harness-Opera-v0.3.0.zip Agency-Browser-Harness-Opera-v0.3.0.zip.sha256 --target "$GITHUB_SHA" --title 'Agency Browser Harness v0.3.0' --notes "$NOTES"
          fi
