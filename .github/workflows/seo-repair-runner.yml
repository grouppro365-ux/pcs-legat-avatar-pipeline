name: Hosting Secret Presence Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-repair-runner.yml'

permissions:
  contents: read

jobs:
  probe-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BEGET_USER: ${{ secrets.BEGET_USER }}
      BEGET_PASSWORD: ${{ secrets.BEGET_PASSWORD }}
      BEGET_LOGIN: ${{ secrets.BEGET_LOGIN }}
      BEGET_PASS: ${{ secrets.BEGET_PASS }}
      BEGET_FTP_USER: ${{ secrets.BEGET_FTP_USER }}
      BEGET_FTP_PASSWORD: ${{ secrets.BEGET_FTP_PASSWORD }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASS: ${{ secrets.FTP_PASS }}
      WP_FLEET_USER: ${{ secrets.WP_FLEET_USER }}
      WP_FLEET_PASSWORD: ${{ secrets.WP_FLEET_PASSWORD }}
      HOSTING_USER: ${{ secrets.HOSTING_USER }}
      HOSTING_PASSWORD: ${{ secrets.HOSTING_PASSWORD }}
    steps:
      - name: Report only secret presence
        shell: bash
        run: |
          set -euo pipefail
          pair() { if [ -n "$2" ] && [ -n "$3" ]; then echo "$1=yes"; else echo "$1=no"; fi; }
          pair BEGET_USER_PASSWORD "$BEGET_USER" "$BEGET_PASSWORD"
          pair BEGET_LOGIN_PASS "$BEGET_LOGIN" "$BEGET_PASS"
          pair BEGET_FTP "$BEGET_FTP_USER" "$BEGET_FTP_PASSWORD"
          pair FTP_USER_PASSWORD "$FTP_USER" "$FTP_PASSWORD"
          pair FTP_USERNAME_PASS "$FTP_USERNAME" "$FTP_PASS"
          pair WP_FLEET "$WP_FLEET_USER" "$WP_FLEET_PASSWORD"
          pair HOSTING "$HOSTING_USER" "$HOSTING_PASSWORD"
