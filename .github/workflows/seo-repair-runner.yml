name: WP Key Sheet Access Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-repair-runner.yml'

permissions:
  contents: read

jobs:
  probe-key-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check access without exposing rows
        shell: bash
        run: python3 .github/seo/check_wp_key_sheet_public.py
