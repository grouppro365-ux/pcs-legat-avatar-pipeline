name: Fleet 102 Completion and Bridge Discovery

# retry after robust report path fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-repair-runner.yml'

permissions:
  contents: write

jobs:
  complete-and-discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit resolved domains and discover REST bridge
        shell: bash
        run: |
          set -euo pipefail
          cd .github/seo
          python3 seo_fleet_completion.py
          cp seo-fleet-completion.json /tmp/seo-fleet-completion.json
      - name: Publish full fleet report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "seo-fleet-auditor"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main --quiet
          git reset --hard origin/main
          mkdir -p .seo-runner
          cp /tmp/seo-fleet-completion.json .seo-runner/fleet-completion.json
          git add .seo-runner/fleet-completion.json
          git commit -m "Publish 102 portal completion and bridge discovery [skip ci]"
          git push origin HEAD:main
