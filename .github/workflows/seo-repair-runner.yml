name: Full Fleet SEO Reaudit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-repair-runner.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Reaudit 97 explicit URLs
        run: python3 .github/seo/seo_fleet_discovery.py
      - name: Complete 102 inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .seo-runner
          cp seo-fleet-discovery.json .seo-runner/fleet-discovery.json
          python3 .github/seo/seo_fleet_completion.py
          cp seo-fleet-completion.json .seo-runner/fleet-completion.json
          python3 .github/seo/seo_actionable_diagnostics.py
      - name: Publish fresh fleet reports
        shell: bash
        run: |
          set -euo pipefail
          cp seo-fleet-discovery.json /tmp/fleet-discovery.json
          cp seo-fleet-completion.json /tmp/fleet-completion.json
          cp seo-actionable-diagnostics.json /tmp/actionable.json
          git config user.name "seo-fleet-auditor"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main --quiet
          git reset --hard origin/main
          mkdir -p .seo-runner
          cp /tmp/fleet-discovery.json .seo-runner/fleet-discovery.json
          cp /tmp/fleet-completion.json .seo-runner/fleet-completion.json
          cp /tmp/actionable.json .seo-runner/actionable-diagnostics.json
          git add .seo-runner/fleet-discovery.json .seo-runner/fleet-completion.json .seo-runner/actionable-diagnostics.json
          git commit -m "Publish post-repair 102-site SEO reaudit [skip ci]"
          git push origin HEAD:main
