name: Tag Archive SEO Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-repair-runner.yml'

permissions:
  contents: write

jobs:
  audit-tags:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Audit tag archives
        run: python3 .github/seo/seo_tag_audit.py
      - name: Publish tag audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "seo-tag-auditor"
          git config user.email "actions@users.noreply.github.com"
          cp seo-tag-audit.json /tmp/seo-tag-audit.json
          git fetch origin main --quiet
          git reset --hard origin/main
          mkdir -p .seo-runner
          cp /tmp/seo-tag-audit.json .seo-runner/tag-audit.json
          git add .seo-runner/tag-audit.json
          git commit -m "Publish tag archive SEO audit [skip ci]"
          git push origin HEAD:main
