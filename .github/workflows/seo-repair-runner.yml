name: Fleet SEO Discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-repair-runner.yml'

permissions:
  contents: write

jobs:
  fleet-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit all portal URLs read-only
        shell: bash
        run: |
          set -euo pipefail
          cd .github/seo
          python3 seo_fleet_discovery.py
          cp seo-fleet-discovery.json /tmp/seo-fleet-discovery.json

      - name: Publish fleet discovery report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "seo-fleet-auditor"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main --quiet
          git reset --hard origin/main
          mkdir -p .seo-runner
          cp /tmp/seo-fleet-discovery.json .seo-runner/fleet-discovery.json
          git add .seo-runner/fleet-discovery.json
          git commit -m "Publish fleet SEO discovery report [skip ci]"
          git push origin HEAD:main
