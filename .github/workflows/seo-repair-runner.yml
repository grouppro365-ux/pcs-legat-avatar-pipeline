name: Actionable Fleet SEO Diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-repair-runner.yml'

permissions:
  contents: write

jobs:
  diagnose-actionable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify robots HTTPS and post failures
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/seo/seo_actionable_diagnostics.py
          cp seo-actionable-diagnostics.json /tmp/seo-actionable-diagnostics.json
      - name: Publish actionable diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "seo-fleet-diagnostics"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main --quiet
          git reset --hard origin/main
          mkdir -p .seo-runner
          cp /tmp/seo-actionable-diagnostics.json .seo-runner/actionable-diagnostics.json
          git add .seo-runner/actionable-diagnostics.json
          git commit -m "Publish actionable fleet SEO diagnostics [skip ci]"
          git push origin HEAD:main
