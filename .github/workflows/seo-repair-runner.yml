name: Homepage H1 Diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-repair-runner.yml'

permissions:
  contents: write

jobs:
  diagnose-h1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect rendered homepage H1 structure
        shell: bash
        run: |
          cd .github/seo
          python3 seo_h1_diag.py
          cp seo-h1-diag.json /tmp/seo-h1-diag.json
      - name: Publish H1 diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "seo-h1-diagnostics"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main --quiet
          git reset --hard origin/main
          mkdir -p .seo-runner
          cp /tmp/seo-h1-diag.json .seo-runner/h1-diag.json
          git add .seo-runner/h1-diag.json
          git commit -m "Publish homepage H1 diagnostics [skip ci]"
          git push origin HEAD:main
