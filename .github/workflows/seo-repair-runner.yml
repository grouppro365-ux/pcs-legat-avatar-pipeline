name: Fleet SEO Repair Cohorts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-repair-runner.yml'

permissions:
  contents: write

jobs:
  build-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build repair cohorts
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/seo/seo_fleet_plan.py
          cp seo-fleet-plan.json /tmp/seo-fleet-plan.json
      - name: Publish repair plan
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "seo-fleet-planner"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main --quiet
          git reset --hard origin/main
          mkdir -p .seo-runner
          cp /tmp/seo-fleet-plan.json .seo-runner/fleet-plan.json
          git add .seo-runner/fleet-plan.json
          git commit -m "Publish fleet SEO repair cohorts [skip ci]"
          git push origin HEAD:main
