name: Fleet Repair Runner PHP Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-repair-runner.yml'

permissions:
  contents: read

jobs:
  validate-repair-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python repair runner
        shell: bash
        run: python3 -m py_compile .github/seo/seo_fleet_beget_repair.py
      - name: Validate target planning
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util,json
          p='.github/seo/seo_fleet_beget_repair.py'
          s=importlib.util.spec_from_file_location('repair',p);m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          t=m.build_targets()
          print(json.dumps({'targets':len(t),'tag':sum(x['fix_tag'] for x in t),'robots':sum(x['fix_robots'] for x in t),'https':sum(x['fix_https'] for x in t),'h1':sum(bool(x['h1_mode']) for x in t),'capitrx_excluded':all(x['domain']!='capitrx.ru' for x in t)}))
          assert t and all(x['ftp_wp_path']==x['domain']+'/public_html' for x in t)
          cfg={'domain':'example.test','ftp_wp_path':'example.test/public_html','fix_tag':True,'fix_robots':True,'fix_https':True,'h1_mode':'keep_first_site_title','token':'dummy-token'}
          open('/tmp/seo-fleet-installer.php','w',encoding='utf-8').write(m.make_php(cfg))
          PY
      - name: Lint generated PHP installer
        shell: bash
        run: |
          set -euo pipefail
          command -v php
          php -l /tmp/seo-fleet-installer.php
