name: Dispatcher WordPress API Discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-repair-runner.yml'

permissions:
  contents: write

jobs:
  discover-dispatcher-api:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect public Dispatcher frontend bundle
        shell: bash
        run: |
          set -euo pipefail
          cd .github/seo
          python3 dispatcher_api_discovery.py
          cp dispatcher-api-discovery.json /tmp/dispatcher-api-discovery.json
      - name: Publish sanitized route report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dispatcher-api-auditor"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main --quiet
          git reset --hard origin/main
          mkdir -p .seo-runner
          cp /tmp/dispatcher-api-discovery.json .seo-runner/dispatcher-api-discovery.json
          git add .seo-runner/dispatcher-api-discovery.json
          git commit -m "Publish Dispatcher API route discovery [skip ci]"
          git push origin HEAD:main
