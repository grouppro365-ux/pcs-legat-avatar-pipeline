name: Strict Final SEO Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-repair-runner.yml'

permissions:
  contents: write

jobs:
  strict-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run strict read-only SEO audit
        shell: bash
        run: |
          set +e
          cd .github/seo
          python3 seo_final_audit_strict.py
          code=$?
          echo "$code" > /tmp/seo-strict-code
          cp seo-final-strict-report.json /tmp/seo-final-strict-report.json
          exit 0

      - name: Publish strict final report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "seo-final-verifier"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main --quiet
          git reset --hard origin/main
          mkdir -p .seo-runner
          cp /tmp/seo-final-strict-report.json .seo-runner/final-strict-report.json
          git add .seo-runner/final-strict-report.json
          git commit -m "Publish strict final SEO regression report [skip ci]"
          git push origin HEAD:main

      - name: Enforce strict all-pass gate
        shell: bash
        run: |
          code="$(cat /tmp/seo-strict-code)"
          [ "$code" = "0" ]
