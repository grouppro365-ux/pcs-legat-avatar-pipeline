name: Build Agency Universal Harness V2
on:
  push:
    branches:
      - agent/agency-universal-harness-v2

permissions:
  contents: write

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        working-directory: agency-universal-harness
        run: |
          for f in service_worker_v2.js response_parser.js chat_cdp.js policy.js locator_engine.js page_agent.js chatgpt_adapter.js popup.js; do
            node --check "$f"
          done
      - name: V2 safety and architecture regression
        working-directory: agency-universal-harness
        run: node tests/static_checks.js
      - name: Live-response parser regression
        working-directory: agency-universal-harness
        run: node tests/response_parser_test.js
      - name: Build Opera-ready folder
        run: |
          rm -rf dist Agency-Universal-Harness-Opera-v2.0.0.zip
          mkdir -p dist/Agency-Universal-Harness
          cp agency-universal-harness/manifest.json dist/Agency-Universal-Harness/
          cp agency-universal-harness/service_worker_v2.js dist/Agency-Universal-Harness/
          cp agency-universal-harness/response_parser.js dist/Agency-Universal-Harness/
          cp agency-universal-harness/chat_cdp.js dist/Agency-Universal-Harness/
          cp agency-universal-harness/policy.js dist/Agency-Universal-Harness/
          cp agency-universal-harness/locator_engine.js dist/Agency-Universal-Harness/
          cp agency-universal-harness/page_agent.js dist/Agency-Universal-Harness/
          cp agency-universal-harness/chatgpt_adapter.js dist/Agency-Universal-Harness/
          cp agency-universal-harness/popup.html dist/Agency-Universal-Harness/
          cp agency-universal-harness/popup.js dist/Agency-Universal-Harness/
          cp agency-universal-harness/README.txt dist/Agency-Universal-Harness/
          test -f dist/Agency-Universal-Harness/manifest.json
          test "$(find dist -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1
      - name: Release-folder smoke check
        run: |
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('dist/Agency-Universal-Harness/manifest.json','utf8')); if(m.manifest_version!==3||m.version!=='2.0.0'||m.background.service_worker!=='service_worker_v2.js'||!m.permissions.includes('debugger')) process.exit(1); console.log('release manifest PASS')"
          for f in dist/Agency-Universal-Harness/*.js; do node --check "$f"; done
          grep -q 'new WeakMap' dist/Agency-Universal-Harness/page_agent.js
          ! grep -q 'refs.clear' dist/Agency-Universal-Harness/page_agent.js
          grep -q 'semantic_fallback' dist/Agency-Universal-Harness/locator_engine.js
          grep -q 'recoverRun' dist/Agency-Universal-Harness/service_worker_v2.js
          grep -q 'DONE_REJECTED_PROOF_NOT_VERIFIED' dist/Agency-Universal-Harness/service_worker_v2.js
          grep -q 'Input.insertText' dist/Agency-Universal-Harness/chat_cdp.js
          grep -q 'Input.dispatchKeyEvent' dist/Agency-Universal-Harness/chat_cdp.js
          ! grep -q 'new KeyboardEvent' dist/Agency-Universal-Harness/chatgpt_adapter.js
      - name: SHA256 inventory and ZIP
        run: |
          (cd dist/Agency-Universal-Harness && sha256sum * > SHA256SUMS.txt)
          (cd dist && zip -qr ../Agency-Universal-Harness-Opera-v2.0.0.zip Agency-Universal-Harness)
          unzip -t Agency-Universal-Harness-Opera-v2.0.0.zip
          unzip -l Agency-Universal-Harness-Opera-v2.0.0.zip | grep 'Agency-Universal-Harness/manifest.json'
          sha256sum Agency-Universal-Harness-Opera-v2.0.0.zip > Agency-Universal-Harness-Opera-v2.0.0.zip.sha256
      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agency-Universal-Harness-Opera-v2.0.0
          path: |
            Agency-Universal-Harness-Opera-v2.0.0.zip
            Agency-Universal-Harness-Opera-v2.0.0.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish persistent GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view auh-v2.0.0 >/dev/null 2>&1; then
            gh release upload auh-v2.0.0 Agency-Universal-Harness-Opera-v2.0.0.zip Agency-Universal-Harness-Opera-v2.0.0.zip.sha256 --clobber
          else
            gh release create auh-v2.0.0 Agency-Universal-Harness-Opera-v2.0.0.zip Agency-Universal-Harness-Opera-v2.0.0.zip.sha256 --target "$GITHUB_SHA" --title "Agency Universal Harness v2.0.0" --notes "Browser-Harness-based universal runtime. Stable refs, self-healing locator cascade, bounded recover/replan, cross-site navigation, reusable learned routes, trusted ChatGPT submit and page-verified completion proof."
          fi
