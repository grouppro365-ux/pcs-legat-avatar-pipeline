name: PCS content video worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/video/**'
      - '.github/workflows/pcs-content-video.yml'
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
  id-token: write
# Reuse the same private kernel and quota as the existing avatar workflow.
concurrency:
  group: pcs-legat-existing-kaggle
  cancel-in-progress: false
jobs:
  content-video:
    if: github.repository == 'grouppro365-ux/pcs-legat-avatar-pipeline' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned open-source clients
        run: python -m pip install --disable-pip-version-check kaggle==2.2.5 imageio-ffmpeg==0.6.0 fonttools==4.61.1
      - name: Process one confirmed canonical video job
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python tools/video/content_video_worker.py
      - name: Summarize sanitized GPU diagnostics
        if: failure()
        run: python tools/ltx/collect_gpu_diagnostics.py pcs-content-video-work/raw
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pcs-content-video-diagnostics
          path: |
            pcs-content-video-work/raw/pcs-gpu-diagnostics.json
            pcs-content-video-work/raw/**/bootstrap.json
            pcs-content-video-work/raw/**/failure.json
          if-no-files-found: ignore
          retention-days: 14
