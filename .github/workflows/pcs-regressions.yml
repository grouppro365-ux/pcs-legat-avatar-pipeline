name: PCS application regressions
on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'pcs-ai-operator-v6/**'
      - 'server/**'
      - 'supabase/**'
      - 'tests/**'
      - 'tools/**'
      - 'api/**'
      - '.github/workflows/pcs-regressions.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'pcs-ai-operator-v6/**'
      - 'server/**'
      - 'supabase/**'
      - 'tests/**'
      - 'tools/**'
      - 'api/**'
      - '.github/workflows/pcs-regressions.yml'
permissions:
  contents: read
concurrency:
  group: pcs-regressions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts
      - name: Install video artifact verification tools
        run: python -m pip install --disable-pip-version-check --no-deps imageio-ffmpeg==0.6.0 fonttools==4.61.1
      - name: Run application and browser-module regressions
        shell: bash
        run: |
          mapfile -d '' pcs_test_files < <(git ls-files -z -- '*.test.mjs')
          test "${#pcs_test_files[@]}" -gt 0
          node --test "${pcs_test_files[@]}"
      - name: Check whitespace
        run: git diff --check
