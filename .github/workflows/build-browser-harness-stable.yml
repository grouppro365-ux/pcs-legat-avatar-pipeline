name: Build Agency Browser Harness STABLE Chat94
on:
  push:
    branches:
      - agent/browser-harness-stable-chat94

permissions:
  contents: write

jobs:
  verify-package-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        working-directory: browser-harness-opera
        run: |
          for f in bootstrap.js target_tracker.js browser_harness_client.js browser_harness_core.js planner_protocol.js service_worker.js workbench.js seo_article_writer_tatyana.js chat_turns_client.js chat_protocol_v94.js chat_transport_v94.js tests/planner_protocol_test.js tests/core_test.js tests/stable_textfix_regression_test.js tests/chat_protocol_v94_test.js tests/chat_transport_v94_static_test.js tests/chat_transport_override_test.js; do
            node --check "$f"
          done

      - name: Browser Harness core tests
        working-directory: browser-harness-opera
        run: node tests/core_test.js

      - name: Planner parser regression
        working-directory: browser-harness-opera
        run: node tests/planner_protocol_test.js

      - name: Stable target executor and CMS editor regression
        working-directory: browser-harness-opera
        run: node tests/stable_textfix_regression_test.js

      - name: ChatGPT request-anchored multi-fragment regression
        working-directory: browser-harness-opera
        run: node tests/chat_protocol_v94_test.js

      - name: ChatGPT deterministic transport static gates
        working-directory: browser-harness-opera
        run: node tests/chat_transport_v94_static_test.js

      - name: ChatGPT transport override runtime recovery
        working-directory: browser-harness-opera
        run: node tests/chat_transport_override_test.js

      - name: Protect stable target-side runtime
        run: |
          test "$(git hash-object browser-harness-opera/service_worker.js)" = "5c1a199bef7e3962fd4a6f37b1a023d85984c233"
          test "$(git hash-object browser-harness-opera/browser_harness_core.js)" = "00c7bf25963c917b175161d18a8219e45a90456f"
          test "$(git hash-object browser-harness-opera/browser_harness_client.js)" = "1ff22a9e42e98ec499ed984a4cd157cfc18b9556"
          test "$(git hash-object browser-harness-opera/target_tracker.js)" = "0c9f6e5deae659d06d659848c3a9a82c8e4873fc"
          test "$(git hash-object browser-harness-opera/seo_article_writer_tatyana.js)" = "a778d5fa461f14726a075e8ddcbe6ab3863b57a7"
          echo 'target-side stable lock PASS'

      - name: Build one Opera-ready folder
        run: |
          rm -rf dist Agency-Browser-Harness-Opera-v0.1.3-STABLE.zip Agency-Browser-Harness-Opera-v0.1.3-STABLE.zip.sha256
          mkdir -p dist/Agency-Browser-Harness/skills/seo-article-writer-tatyana
          cp browser-harness-opera/manifest.json dist/Agency-Browser-Harness/
          cp browser-harness-opera/bootstrap.js dist/Agency-Browser-Harness/
          cp browser-harness-opera/target_tracker.js dist/Agency-Browser-Harness/
          cp browser-harness-opera/browser_harness_client.js dist/Agency-Browser-Harness/
          cp browser-harness-opera/browser_harness_core.js dist/Agency-Browser-Harness/
          cp browser-harness-opera/planner_protocol.js dist/Agency-Browser-Harness/
          cp browser-harness-opera/service_worker.js dist/Agency-Browser-Harness/
          cp browser-harness-opera/seo_article_writer_tatyana.js dist/Agency-Browser-Harness/
          cp browser-harness-opera/chat_turns_client.js dist/Agency-Browser-Harness/
          cp browser-harness-opera/chat_protocol_v94.js dist/Agency-Browser-Harness/
          cp browser-harness-opera/chat_transport_v94.js dist/Agency-Browser-Harness/
          cp browser-harness-opera/workbench.html dist/Agency-Browser-Harness/
          cp browser-harness-opera/workbench.js dist/Agency-Browser-Harness/
          cp browser-harness-opera/README.md dist/Agency-Browser-Harness/
          cp browser-harness-opera/LICENSE.browser-harness.txt dist/Agency-Browser-Harness/
          cp browser-harness-opera/skills/seo-article-writer-tatyana/SKILL.md dist/Agency-Browser-Harness/skills/seo-article-writer-tatyana/

      - name: Release-folder smoke
        run: |
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('dist/Agency-Browser-Harness/manifest.json','utf8')); if(m.manifest_version!==3||m.version!=='0.1.3'||m.background.service_worker!=='bootstrap.js') process.exit(1); console.log('manifest PASS')"
          for f in dist/Agency-Browser-Harness/*.js; do node --check "$f"; done
          grep -q 'class Driver' dist/Agency-Browser-Harness/browser_harness_core.js
          grep -q 'class ElementProxy' dist/Agency-Browser-Harness/browser_harness_core.js
          grep -q 'collectDocuments' dist/Agency-Browser-Harness/browser_harness_client.js
          grep -q "doc.execCommand('insertText'" dist/Agency-Browser-Harness/browser_harness_client.js
          grep -q 'seo_article_writer_tatyana.js' dist/Agency-Browser-Harness/bootstrap.js
          grep -q 'chat_protocol_v94.js' dist/Agency-Browser-Harness/bootstrap.js
          grep -q 'chat_transport_v94.js' dist/Agency-Browser-Harness/bootstrap.js
          grep -q 'ABH_JSON_DONE_' dist/Agency-Browser-Harness/chat_transport_v94.js
          grep -q 'assistantFragmentsAfterRequest' dist/Agency-Browser-Harness/chat_transport_v94.js
          grep -q 'ABH_CHAT_STATE_V94' dist/Agency-Browser-Harness/chat_turns_client.js
          grep -q 'name: seo-article-writer-tatyana' dist/Agency-Browser-Harness/skills/seo-article-writer-tatyana/SKILL.md
          ! grep -q 'MutationObserver' dist/Agency-Browser-Harness/chat_transport_v94.js
          ! grep -Eq 'ABH_CHAT_ARM|waiting_chatgpt|CHATGPT_OBSERVER_NOT_READY' dist/Agency-Browser-Harness/*.js
          ! grep -Eq 'api\.openai\.com|OPENAI_API_KEY|OpenRouter|TokenRouter' dist/Agency-Browser-Harness/*.js

      - name: ZIP integrity and SHA256
        run: |
          (cd dist/Agency-Browser-Harness && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd dist && zip -qr ../Agency-Browser-Harness-Opera-v0.1.3-STABLE.zip Agency-Browser-Harness)
          unzip -t Agency-Browser-Harness-Opera-v0.1.3-STABLE.zip
          unzip -l Agency-Browser-Harness-Opera-v0.1.3-STABLE.zip | grep 'Agency-Browser-Harness/manifest.json'
          unzip -l Agency-Browser-Harness-Opera-v0.1.3-STABLE.zip | grep 'Agency-Browser-Harness/chat_transport_v94.js'
          unzip -l Agency-Browser-Harness-Opera-v0.1.3-STABLE.zip | grep 'Agency-Browser-Harness/chat_turns_client.js'
          unzip -l Agency-Browser-Harness-Opera-v0.1.3-STABLE.zip | grep 'Agency-Browser-Harness/skills/seo-article-writer-tatyana/SKILL.md'
          sha256sum Agency-Browser-Harness-Opera-v0.1.3-STABLE.zip > Agency-Browser-Harness-Opera-v0.1.3-STABLE.zip.sha256

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agency-Browser-Harness-Opera-v0.1.3-STABLE
          path: |
            Agency-Browser-Harness-Opera-v0.1.3-STABLE.zip
            Agency-Browser-Harness-Opera-v0.1.3-STABLE.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish persistent GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES='STABLE ChatGPT transport repair. Keeps the v0.1.2 Browser Harness target executor, CMS/Gutenberg text editing and seo-article-writer-tatyana unchanged. Replaces only the open-ChatGPT request/response transport using the proven Agency Browser Bridge 9.3/9.4 protocol: exact composer replacement, trusted Enter, real user-turn confirmation, pinned conversation, request-anchored assistant fragments, multi-fragment JSON recovery and no blind duplicate send. No paid OpenAI API. Static/unit/regression/package gates passed; live Opera E2E remains required before unattended production use.'
          if gh release view abh-v0.1.3-stable >/dev/null 2>&1; then
            gh release upload abh-v0.1.3-stable Agency-Browser-Harness-Opera-v0.1.3-STABLE.zip Agency-Browser-Harness-Opera-v0.1.3-STABLE.zip.sha256 --clobber
            gh release edit abh-v0.1.3-stable --target "$GITHUB_SHA" --notes "$NOTES"
          else
            gh release create abh-v0.1.3-stable Agency-Browser-Harness-Opera-v0.1.3-STABLE.zip Agency-Browser-Harness-Opera-v0.1.3-STABLE.zip.sha256 --target "$GITHUB_SHA" --title 'Agency Browser Harness v0.1.3 STABLE' --notes "$NOTES"
          fi
