name: Build Agency Browser Harness STABLE
on:
  push:
    branches:
      - agent/browser-harness-stable-textfix

permissions:
  contents: write

jobs:
  verify-package-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        working-directory: browser-harness-opera
        run: |
          for f in bootstrap.js target_tracker.js browser_harness_client.js browser_harness_core.js planner_protocol.js service_worker.js workbench.js seo_article_writer_tatyana.js tests/planner_protocol_test.js tests/core_test.js tests/stable_textfix_regression_test.js; do
            node --check "$f"
          done

      - name: Browser Harness core tests
        working-directory: browser-harness-opera
        run: node tests/core_test.js

      - name: Planner parser regression
        working-directory: browser-harness-opera
        run: node tests/planner_protocol_test.js

      - name: Stable transport + editor text regression
        working-directory: browser-harness-opera
        run: node tests/stable_textfix_regression_test.js

      - name: Build one Opera-ready folder
        run: |
          rm -rf dist Agency-Browser-Harness-Opera-v0.1.2-STABLE.zip Agency-Browser-Harness-Opera-v0.1.2-STABLE.zip.sha256
          mkdir -p dist/Agency-Browser-Harness/skills/seo-article-writer-tatyana
          cp browser-harness-opera/manifest.json dist/Agency-Browser-Harness/
          cp browser-harness-opera/bootstrap.js dist/Agency-Browser-Harness/
          cp browser-harness-opera/target_tracker.js dist/Agency-Browser-Harness/
          cp browser-harness-opera/browser_harness_client.js dist/Agency-Browser-Harness/
          cp browser-harness-opera/browser_harness_core.js dist/Agency-Browser-Harness/
          cp browser-harness-opera/planner_protocol.js dist/Agency-Browser-Harness/
          cp browser-harness-opera/service_worker.js dist/Agency-Browser-Harness/
          cp browser-harness-opera/seo_article_writer_tatyana.js dist/Agency-Browser-Harness/
          cp browser-harness-opera/workbench.html dist/Agency-Browser-Harness/
          cp browser-harness-opera/workbench.js dist/Agency-Browser-Harness/
          cp browser-harness-opera/README.md dist/Agency-Browser-Harness/
          cp browser-harness-opera/LICENSE.browser-harness.txt dist/Agency-Browser-Harness/
          cp browser-harness-opera/skills/seo-article-writer-tatyana/SKILL.md dist/Agency-Browser-Harness/skills/seo-article-writer-tatyana/

      - name: Release-folder smoke
        run: |
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('dist/Agency-Browser-Harness/manifest.json','utf8')); if(m.manifest_version!==3||m.version!=='0.1.2'||m.background.service_worker!=='bootstrap.js') process.exit(1); console.log('manifest PASS')"
          for f in dist/Agency-Browser-Harness/*.js; do node --check "$f"; done
          grep -q 'class Driver' dist/Agency-Browser-Harness/browser_harness_core.js
          grep -q 'class ElementProxy' dist/Agency-Browser-Harness/browser_harness_core.js
          grep -q 'chatDriver.read({maxChars:60000, tail:true})' dist/Agency-Browser-Harness/service_worker.js
          grep -q 'collectRequestScopedObjects' dist/Agency-Browser-Harness/planner_protocol.js
          grep -q 'collectDocuments' dist/Agency-Browser-Harness/browser_harness_client.js
          grep -q 'contentDocument' dist/Agency-Browser-Harness/browser_harness_client.js
          grep -q "doc.execCommand('insertText'" dist/Agency-Browser-Harness/browser_harness_client.js
          grep -q 'seo_article_writer_tatyana.js' dist/Agency-Browser-Harness/bootstrap.js
          grep -q 'name: seo-article-writer-tatyana' dist/Agency-Browser-Harness/skills/seo-article-writer-tatyana/SKILL.md
          ! find dist/Agency-Browser-Harness -maxdepth 1 -type f -name '*observer*' | grep .
          ! grep -Eq 'ABH_CHAT_ARM|waiting_chatgpt|CHATGPT_OBSERVER_NOT_READY' dist/Agency-Browser-Harness/*.js
          ! grep -Eq 'api\.openai\.com|OPENAI_API_KEY|OpenRouter|TokenRouter' dist/Agency-Browser-Harness/*.js

      - name: ZIP integrity and SHA256
        run: |
          (cd dist/Agency-Browser-Harness && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd dist && zip -qr ../Agency-Browser-Harness-Opera-v0.1.2-STABLE.zip Agency-Browser-Harness)
          unzip -t Agency-Browser-Harness-Opera-v0.1.2-STABLE.zip
          unzip -l Agency-Browser-Harness-Opera-v0.1.2-STABLE.zip | grep 'Agency-Browser-Harness/manifest.json'
          unzip -l Agency-Browser-Harness-Opera-v0.1.2-STABLE.zip | grep 'Agency-Browser-Harness/skills/seo-article-writer-tatyana/SKILL.md'
          sha256sum Agency-Browser-Harness-Opera-v0.1.2-STABLE.zip > Agency-Browser-Harness-Opera-v0.1.2-STABLE.zip.sha256

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agency-Browser-Harness-Opera-v0.1.2-STABLE
          path: |
            Agency-Browser-Harness-Opera-v0.1.2-STABLE.zip
            Agency-Browser-Harness-Opera-v0.1.2-STABLE.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish persistent GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES='STABLE rollback line. Restores the user-observed working abh-v0.1.1 ChatGPT/service-worker/Driver/target-tracker transport byte-for-byte and removes the v0.3 observer/event transport entirely. The only execution-side expansion is same-origin CMS/Gutenberg iframe traversal and owner-document contenteditable text replacement. seo-article-writer-tatyana is bundled and loaded into the existing planner. No paid AI API. CI hard-locks the working transport by Git blob SHA. Live Opera text-edit E2E remains required before unattended production use.'
          if gh release view abh-v0.1.2-stable >/dev/null 2>&1; then
            gh release upload abh-v0.1.2-stable Agency-Browser-Harness-Opera-v0.1.2-STABLE.zip Agency-Browser-Harness-Opera-v0.1.2-STABLE.zip.sha256 --clobber
            gh release edit abh-v0.1.2-stable --target "$GITHUB_SHA" --notes "$NOTES"
          else
            gh release create abh-v0.1.2-stable Agency-Browser-Harness-Opera-v0.1.2-STABLE.zip Agency-Browser-Harness-Opera-v0.1.2-STABLE.zip.sha256 --target "$GITHUB_SHA" --title 'Agency Browser Harness v0.1.2 STABLE' --notes "$NOTES"
          fi
