name: PCS Legat Kaggle GPU

on:
  workflow_dispatch:
    inputs:
      engine:
        description: Existing private Kaggle workload
        required: true
        default: avatar
        type: choice
        options: [avatar, ltx-smoke]
  push:
    branches: [main]
    paths: ['tools/ltx/**', 'patch_notebook.py']
  schedule:
    # 03:30 Thailand (UTC+7) = 20:30 UTC on the previous day.
    - cron: "30 20 * * *"

permissions:
  contents: read

# Both workloads use the same existing private kernel and quota.
concurrency:
  group: pcs-legat-existing-kaggle
  cancel-in-progress: false

jobs:
  run-kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PCS_GPU_ENGINE: ${{ github.event_name == 'push' && 'ltx-smoke' || inputs.engine || 'avatar' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Select the existing workload for a source push
        if: github.event_name == 'push'
        env:
          PCS_PUSH_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          [[ "$PCS_PUSH_BEFORE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          set +e
          git diff --quiet "$PCS_PUSH_BEFORE" "$GITHUB_SHA" -- patch_notebook.py
          pcs_diff_status=$?
          set -e
          case "$pcs_diff_status" in
            0) echo 'PCS_GPU_ENGINE=ltx-smoke' >> "$GITHUB_ENV" ;;
            1) echo 'PCS_GPU_ENGINE=avatar' >> "$GITHUB_ENV" ;;
            *) exit "$pcs_diff_status" ;;
          esac
      - name: Prepare asset-free LTX smoke notebook
        if: env.PCS_GPU_ENGINE == 'ltx-smoke'
        run: python tools/ltx/prepare_kaggle_smoke.py kaggle-ltx-smoke "${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Prepare current private notebook
        if: env.PCS_GPU_ENGINE == 'avatar'
        run: |
          cat notebook.gz.part* | gzip -dc > kaggle_avatar_pipeline.ipynb
          python patch_notebook.py
          python -m json.tool kaggle_avatar_pipeline.ipynb >/dev/null
      - name: Install official Kaggle CLI
        run: python -m pip install --disable-pip-version-check kaggle==2.2.5
      - name: Authenticate and start private GPU kernel
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          test -n "$KAGGLE_API_TOKEN"
          if [ "$PCS_GPU_ENGINE" = "ltx-smoke" ]; then
            python tools/ltx/kaggle_existing_run.py start kaggle-ltx-smoke kaggle-run.json
          else
            python tools/ltx/kaggle_existing_run.py start . kaggle-run.json
          fi
      - name: Wait for the Kaggle run
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python tools/ltx/kaggle_existing_run.py wait kaggle-run.json
      - name: Download outputs and failure diagnostics
        if: always()
        continue-on-error: true
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python tools/ltx/kaggle_existing_run.py output kaggle-run.json kaggle-output
      - name: Summarize GPU failure without private data
        if: always()
        run: python tools/ltx/collect_gpu_diagnostics.py kaggle-output
      - name: Install pinned LTX artifact verifier
        if: success() && env.PCS_GPU_ENGINE == 'ltx-smoke'
        run: python -m pip install --disable-pip-version-check --no-deps imageio-ffmpeg==0.6.0
      - name: Verify actual LTX artifact
        if: success() && env.PCS_GPU_ENGINE == 'ltx-smoke'
        run: python tools/ltx/verify_kaggle_smoke.py kaggle-output kaggle-ltx-smoke/expected-run.json
      - name: Upload LTX smoke artifact
        if: always() && env.PCS_GPU_ENGINE == 'ltx-smoke'
        uses: actions/upload-artifact@v4
        with:
          name: pcs-ltx-smoke-output
          path: |
            kaggle-output/**/ltx-smoke.mp4
            kaggle-output/**/result.json
            kaggle-output/**/failure.json
            kaggle-output/**/bootstrap.json
            kaggle-output/pcs-gpu-diagnostics.json
            kaggle-run.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload failed avatar diagnostics
        if: failure() && env.PCS_GPU_ENGINE == 'avatar'
        uses: actions/upload-artifact@v4
        with:
          name: pcs-avatar-failure-diagnostics
          path: kaggle-output/pcs-gpu-diagnostics.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload sanitized avatar execution diagnostics
        if: success() && env.PCS_GPU_ENGINE == 'avatar'
        uses: actions/upload-artifact@v4
        with:
          name: pcs-avatar-run-diagnostics
          path: |
            kaggle-output/pcs-gpu-diagnostics.json
            kaggle-run.json
          if-no-files-found: error
          retention-days: 14
