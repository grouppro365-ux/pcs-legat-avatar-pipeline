<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061725"><title>PCS Manager</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--bg:#f5f8fb;--card:#fff;--text:#092039;--muted:#718094;--line:#dfe8ee;--accent:#08a5aa;--soft:#e5f8f8;--danger:#e94e5b;--shadow:0 14px 40px #183e5b16}*{box-sizing:border-box}html[data-theme=dark]{--bg:#061725;--card:#0c2234;--text:#f5fbff;--muted:#9eb1c1;--line:#1b3a50;--accent:#20ccd0;--soft:#0c343d;--shadow:0 18px 55px #0007}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Arial;padding:0 0 84px}.wrap{max-width:760px;margin:auto}.top{padding:22px 18px 34px;background:linear-gradient(145deg,#071a2a,#0b3440);color:#fff;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;justify-content:space-between}.appname{font-weight:800;font-size:18px;letter-spacing:-.02em}.top h1{font-size:34px;line-height:1.02;margin:28px 0 5px}.top p{margin:0;color:#a9c0cb}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:12px 12px 0;position:sticky;top:0;z-index:6;background:var(--bg)}button{font:inherit}.tab{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:14px;padding:10px 4px;font-weight:700}.tab.active{background:var(--accent);color:white;border-color:var(--accent)}main{padding:14px 12px}.screen{display:none}.screen.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:16px}.metric b{font-size:29px;display:block}.metric span{color:var(--muted)}h2{font-size:20px;margin:22px 3px 10px}.list{display:grid;gap:9px}.client{display:grid;grid-template-columns:48px 1fr auto;gap:11px;align-items:center;text-align:left;width:100%;color:inherit}.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--accent);font-weight:900}.client strong{display:block;font-size:16px}.sub{color:var(--muted);font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:var(--soft);color:var(--accent);font-size:10px;font-weight:800;margin-top:5px}.hot{background:#feecef;color:#d33b48}.catalog{display:grid;gap:9px}.item h3{margin:0 0 5px;font-size:16px}.price{font-weight:900;color:var(--accent)}.statusrow{display:flex;justify-content:space-between;gap:15px}.ok{color:#36bf77}.bad{color:var(--danger)}.login{position:fixed;inset:0;z-index:50;background:linear-gradient(145deg,#061725,#0b3340);display:grid;place-items:center;padding:22px}.loginbox{width:min(420px,100%);background:#fff;color:#092039;border-radius:28px;padding:28px}.loginbox .appname{color:#092039}.loginbox h1{margin:28px 0 5px;font-size:29px}.loginbox p{color:#718094;margin:0 0 20px}.loginbox input,.reply textarea{width:100%;border:1px solid #d8e4ea;border-radius:15px;padding:14px;background:#f8fbfc;color:#092039;outline:0}.primary{border:0;background:linear-gradient(135deg,#079da5,#13bdbe);color:white;border-radius:15px;padding:14px;font-weight:850;width:100%;margin-top:10px}.err{color:#db3b48;margin-top:8px;font-size:12px}.sheet{position:fixed;inset:0;z-index:40;background:#0009;display:flex;align-items:flex-end;justify-content:center}.sheetbox{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:18px 12px calc(18px + env(safe-area-inset-bottom))}.sheethead{display:flex;justify-content:space-between;align-items:center;padding:0 3px}.close{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:50%;width:38px;height:38px}.thread{display:grid;gap:7px;margin:14px 0}.msg{max-width:87%;padding:10px 12px;border-radius:15px;background:var(--card);border:1px solid var(--line);white-space:pre-wrap}.msg.out{justify-self:end;background:var(--soft)}.reply textarea{background:var(--card);color:var(--text);border-color:var(--line);min-height:82px}.hidden{display:none!important}.empty{text-align:center;color:var(--muted);padding:30px}.refresh{border:0;background:#ffffff18;color:#fff;border-radius:13px;padding:9px 12px}@media(max-width:390px){.top h1{font-size:30px}.tab{font-size:12px}.grid{gap:8px}.card{padding:14px}}
</style></head><body><div id="login" class="login"><div class="loginbox"><div class="appname">PCS Manager</div><h1>PCS Manager</h1><p>Рабочая панель оператора</p><input id="pw" type="password" placeholder="Пароль администратора" autocomplete="current-password"><button id="loginBtn" class="primary">Войти</button><div id="loginErr" class="err"></div></div></div><div class="wrap"><header class="top"><div class="brand"><div class="appname">PCS Manager</div><button id="refresh" class="refresh">↻ Обновить</button></div><h1>Не теряйте<br>клиента.</h1><p>Telegram Business · Neon · PCS</p></header><nav class="tabs"><button class="tab active" data-tab="home">Главная</button><button class="tab" data-tab="clients">Клиенты</button><button class="tab" data-tab="catalog">Каталог</button><button class="tab" data-tab="status">Статус</button></nav><main><section id="home" class="screen active"><div id="metrics" class="grid"></div><h2>Последние обращения</h2><div id="recent" class="list"></div></section><section id="clients" class="screen"><h2>Клиенты</h2><div id="clientList" class="list"></div></section><section id="catalog" class="screen"><h2>Каталог PCS</h2><div id="catalogList" class="catalog"></div></section><section id="status" class="screen"><h2>Система</h2><div id="statusList" class="list"></div><button id="testTg" class="primary">Проверить Telegram</button><div id="tgMsg" class="err"></div></section></main></div><div id="sheet" class="sheet hidden"><div class="sheetbox"><div class="sheethead"><h2 id="sheetTitle">Клиент</h2><button id="close" class="close">×</button></div><div id="sheetBody"></div></div></div><script>
const API_BASE='https://nnlzgertmmxuteozoeel.supabase.co/functions/v1/pcs-manager-publish-once';const $=x=>document.getElementById(x), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let token=localStorage.pcsToken||'', data={};
try{const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();document.documentElement.dataset.theme=tg.colorScheme==='dark'?'dark':'light';tg.setHeaderColor(document.documentElement.dataset.theme==='dark'?'#061725':'#f5f8fb');tg.setBackgroundColor(document.documentElement.dataset.theme==='dark'?'#061725':'#f5f8fb')}}catch{}
async function api(op,opt={}){const query=opt.query||{};const fo={...opt};delete fo.query;const qs=new URLSearchParams({op,...query});const r=await fetch(API_BASE+'?'+qs.toString(),{...fo,headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{}),...(fo.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Ошибка '+r.status);return j}
function initials(n){return String(n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function clientCard(c){return `<button class="client card" data-client="${esc(c.id)}"><span class="avatar">${esc(initials(c.name||c.username))}</span><span><strong>${esc(c.name||c.username||'Клиент')}</strong><span class="sub">${esc(c.last_message||c.need||'Нет сообщения')}</span><span class="badge ${c.priority==='HOT'?'hot':''}">${esc(c.status||'NEW')}</span></span><span>›</span></button>`}
function render(){const s=data.status||{},cs=data.clients||[],cat=data.catalog||[];$('metrics').innerHTML=`<div class="card metric"><span>Клиенты</span><b>${cs.length}</b></div><div class="card metric"><span>Каталог</span><b>${cat.length}</b></div><div class="card metric"><span>Telegram</span><b class="${s.configured?.telegram?'ok':'bad'}">${s.configured?.telegram?'ON':'OFF'}</b></div><div class="card metric"><span>База</span><b class="${s.database?'ok':'bad'}">${s.database?'OK':'ERR'}</b></div>`;$('recent').innerHTML=cs.slice(0,5).map(clientCard).join('')||'<div class="empty card">Нет клиентов</div>';$('clientList').innerHTML=cs.map(clientCard).join('')||'<div class="empty card">Нет клиентов</div>';$('catalogList').innerHTML=cat.map(i=>`<article class="card item"><h3>${esc(i.title)}</h3><div class="sub">${esc(i.description||i.city||'')}</div><div class="price">${i.daily_price?i.daily_price+' THB/сутки':i.monthly_price?i.monthly_price+' THB/мес':'по запросу'}</div></article>`).join('')||'<div class="empty card">Каталог пуст</div>';$('statusList').innerHTML=[['Neon PostgreSQL',s.database],['Telegram token',s.configured?.telegram],['Telegram Business',s.connection?.can_reply],['Чтение сообщений',s.connection?.can_read_messages]].map(([n,v])=>`<div class="card statusrow"><b>${n}</b><span class="${v?'ok':'bad'}">${v?'Работает':'Нет'}</span></div>`).join('')}
async function load(){const [status,clients,catalog]=await Promise.all([api('status'),api('clients'),api('catalog')]);data={status,clients,catalog};render()}
async function openClient(id){const d=await api('client',{query:{id}});$('sheetTitle').textContent=d.contact.name||d.contact.username||'Клиент';$('sheetBody').innerHTML=`<div class="thread">${(d.messages||[]).slice(-40).map(m=>`<div class="msg ${String(m.direction).toUpperCase()==='OUT'?'out':''}">${esc(m.text||m.raw?.caption||m.raw?.pcs_voice_transcript||(m.raw?.photo_file_id?'📷 Фото':m.raw?.voice_file_id?'🎤 Голосовое':m.raw?.document_name?'📎 '+m.raw.document_name:'[медиа]'))}</div>`).join('')}</div><div class="reply"><textarea id="reply" placeholder="Ответ клиенту"></textarea><button id="send" class="primary">Отправить в Telegram</button><div id="sendErr" class="err"></div></div>`;$('sheet').classList.remove('hidden');$('send').onclick=async()=>{const text=$('reply').value.trim();if(!text)return;$('send').disabled=true;try{await api('send',{method:'POST',query:{id},body:JSON.stringify({text})});await openClient(id);await load()}catch(e){$('sendErr').textContent=e.message;$('send').disabled=false}}}
document.addEventListener('click',e=>{const c=e.target.closest('[data-client]');if(c)openClient(c.dataset.client);const t=e.target.closest('[data-tab]');if(t){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===t.dataset.tab))}});$('close').onclick=()=>$('sheet').classList.add('hidden');$('sheet').onclick=e=>{if(e.target===$('sheet'))$('sheet').classList.add('hidden')};$('refresh').onclick=()=>load();$('testTg').onclick=async()=>{try{const r=await api('telegram-test',{method:'POST'});$('tgMsg').className='err ok';$('tgMsg').textContent='Telegram работает: @'+(r.username||'OK')}catch(e){$('tgMsg').className='err bad';$('tgMsg').textContent=e.message}};
$('loginBtn').onclick=async()=>{try{$('loginErr').textContent='';const r=await api('login',{method:'POST',body:JSON.stringify({password:$('pw').value})});token=r.token;localStorage.pcsToken=token;$('login').classList.add('hidden');await load()}catch(e){$('loginErr').textContent=e.message}};$('pw').onkeydown=e=>{if(e.key==='Enter')$('loginBtn').click()};
(async()=>{if(!token)return;try{await api('session');$('login').classList.add('hidden');await load()}catch{localStorage.removeItem('pcsToken');token=''}})();
</script></body></html>
