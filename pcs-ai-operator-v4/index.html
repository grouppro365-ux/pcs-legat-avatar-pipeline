<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f2ec"><title>PCS AI Operator</title><style>
:root{--bg:#f6f2ec;--panel:#fffdf9;--panel2:#f4f0ea;--ink:#252830;--muted:#737780;--line:#ddd6cd;--lav:#e9e1f6;--sage:#e3ebdd;--blue:#dfeaf5;--peach:#f2ded3;--warn:#f5eabc;--danger:#f1d8d8;--ok:#4f7f61;--shadow:0 18px 48px rgba(37,40,48,.09);--r:22px;--pad:18px}
[data-theme=dark]{--bg:#17191e;--panel:#22262d;--panel2:#1c2026;--ink:#f5f1ea;--muted:#a8acb4;--line:#353a44;--lav:#40374f;--sage:#344139;--blue:#303c49;--peach:#4a3832;--warn:#514a2d;--danger:#4a3030;--ok:#8bc49a;--shadow:0 18px 48px rgba(0,0,0,.28)}
*{box-sizing:border-box}html,body{margin:0;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.top{height:64px;position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:10px 16px;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.logo{width:42px;height:42px;border-radius:14px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:900}.brand{font-weight:850;font-size:18px}.spacer{flex:1}.iconbtn{width:44px;height:44px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink)}.layout{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:calc(100dvh - 64px)}.side{padding:18px 14px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--panel) 45%,transparent)}.nav{display:grid;gap:7px}.nav button{min-height:46px;border:0;background:transparent;color:var(--muted);text-align:left;padding:11px 13px;border-radius:14px;font-weight:760}.nav button.on{background:var(--lav);color:var(--ink)}main{width:min(100%,1320px);margin:0 auto;padding:28px clamp(20px,3vw,42px) 56px;min-width:0}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#927baa;font-weight:850}.title{font-size:clamp(34px,4vw,48px);line-height:1.02;letter-spacing:-.045em;margin:8px 0 8px}.sub{color:var(--muted);margin:0 0 18px;max-width:760px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric,.card,.item{border:1px solid var(--line);box-shadow:var(--shadow);background:var(--panel)}.metric{min-height:112px;border-radius:22px;padding:16px;display:flex;flex-direction:column;justify-content:space-between}.metric:nth-child(1){background:linear-gradient(145deg,var(--panel),var(--lav))}.metric:nth-child(2){background:linear-gradient(145deg,var(--panel),var(--blue))}.metric:nth-child(3){background:linear-gradient(145deg,var(--panel),var(--sage))}.metric:nth-child(4){background:linear-gradient(145deg,var(--panel),var(--peach))}.metric small{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}.metric b{font-size:34px}.card{border-radius:var(--r);padding:var(--pad);margin-top:14px}.item{border-radius:18px;padding:15px}.item h3,.card h2,.card h3{margin:0 0 8px}.item p{margin:6px 0;color:var(--muted);overflow-wrap:anywhere}.list{display:grid;gap:11px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{min-height:44px;border:0;border-radius:13px;padding:10px 14px;background:var(--ink);color:var(--bg);font-weight:800}.btn.soft{background:var(--lav);color:var(--ink)}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.peach{background:var(--peach);color:var(--ink)}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;background:var(--sage);font-size:12px}.pill.warn{background:var(--warn)}.pill.bad{background:var(--danger)}.pills{display:flex;gap:7px;flex-wrap:wrap}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:750}.field input,.field textarea,.field select{width:100%;min-height:46px;padding:11px 12px;border-radius:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);outline:none;font-size:16px}.field textarea{min-height:110px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#9e87bb;box-shadow:0 0 0 3px color-mix(in srgb,var(--lav) 75%,transparent)}.split{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:14px}.client-row{display:grid;gap:4px;padding:13px;border:1px solid var(--line);border-radius:16px;background:var(--panel);cursor:pointer}.client-row.on{outline:2px solid #a994c2;background:var(--lav)}.client-row b{overflow-wrap:anywhere}.muted{color:var(--muted)}.conversation{display:grid;gap:9px;max-height:430px;overflow:auto;padding-right:4px}.bubble{max-width:86%;padding:10px 12px;border-radius:15px;background:var(--panel2);border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}.bubble.out{margin-left:auto;background:var(--blue)}.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:7px 12px}.kv span:nth-child(odd){color:var(--muted)}.status-list{display:grid;gap:9px}.status-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 15px;border:1px solid var(--line);border-radius:17px;background:var(--panel)}.status-name{font-weight:800}.status-badge{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 10px;background:var(--sage);font-size:12px;font-weight:750}.status-badge.warn{background:var(--warn)}.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}.sheet{display:none;position:fixed;inset:0;z-index:90;background:rgba(12,14,18,.48);align-items:flex-end}.sheet.on{display:flex}.sheetbox{width:min(760px,100%);max-height:94dvh;overflow:auto;margin:0 auto;background:var(--panel);border-radius:26px 26px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -16px 54px rgba(0,0,0,.18)}.sheethead{position:sticky;top:-18px;z-index:3;display:flex;align-items:center;gap:10px;padding:18px 0 12px;background:var(--panel)}.sheethead h2{margin:0}.bottom{display:none}.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));z-index:120;transform:translate(-50%,12px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:13px;max-width:calc(100vw - 28px);pointer-events:none}.toast.on{opacity:1;transform:translate(-50%,0)}.login{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 82% 10%,var(--lav),transparent 38%),var(--bg)}.loginbox{width:min(470px,100%);background:var(--panel);border:1px solid var(--line);border-radius:29px;padding:28px;box-shadow:var(--shadow)}.loginbox h1{font-size:clamp(34px,8vw,42px);line-height:1.04;margin:12px 0}.error{color:#b55b5b;margin-top:10px}.empty{padding:26px 12px;text-align:center;color:var(--muted)}.search{width:min(420px,100%)}.fab{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:45;width:54px;height:54px;border-radius:18px;border:0;background:var(--ink);color:var(--bg);font-size:26px;box-shadow:var(--shadow);display:none}
@media(max-width:1024px){.layout{grid-template-columns:205px minmax(0,1fr)}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:1fr}.split{grid-template-columns:300px minmax(0,1fr)}}
@media(max-width:768px){.top{height:60px;padding:8px 14px}.logo{width:40px;height:40px}.brand{font-size:16px}.layout{display:block}.side{display:none}main{width:100%;padding:18px 14px calc(96px + env(safe-area-inset-bottom))}.title{font-size:33px}.sub{font-size:14px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.metric{min-height:94px;padding:13px;border-radius:18px}.metric b{font-size:28px}.card{padding:14px;border-radius:19px;margin-top:11px}.item{padding:13px;border-radius:17px}.grid2,.grid3,.split{grid-template-columns:1fr}.toolbar .btn{flex:1 1 130px}.bottom{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:60;padding:5px;border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,var(--panel) 96%,transparent);backdrop-filter:blur(18px);box-shadow:0 15px 44px rgba(37,40,48,.14)}.bottom button{min-height:50px;min-width:0;border:0;background:transparent;color:var(--muted);border-radius:13px;padding:6px 2px;font-size:10px;font-weight:750}.bottom button.on{background:var(--lav);color:var(--ink)}.sheet{align-items:stretch;padding-top:max(20px,env(safe-area-inset-top))}.sheetbox{height:100%;max-height:100%;border-radius:22px 22px 0 0;padding:15px 15px calc(24px + env(safe-area-inset-bottom))}.sheethead{top:-15px;padding:15px 0 11px}.fab{display:block}.conversation{max-height:55dvh}.kv{grid-template-columns:105px minmax(0,1fr)}}
@media(max-width:430px){main{padding-left:12px;padding-right:12px}.brand{font-size:15px}.title{font-size:30px}.metric{min-height:90px}.metric b{font-size:27px}.status-row{padding:12px 13px}.status-name{font-size:14px}.status-badge{font-size:10.5px}.client-row{padding:12px}.bubble{max-width:92%}}
@media(max-width:360px){.toolbar .btn{flex:1 1 100%}.bottom{left:6px;right:6px}.bottom button{font-size:9px}.metrics{gap:7px}.kv{grid-template-columns:1fr;gap:2px}.kv span:nth-child(odd){margin-top:5px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body><div id="root"></div><div id="toast" class="toast"></div><div id="sheet" class="sheet" aria-hidden="true"><div class="sheetbox" id="sheetbox"></div></div><script>
const API='https://nnlzgertmmxuteozoeel.supabase.co/functions/v1/pcs-ui-api';const MOTION_URL='https://raw.githubusercontent.com/grouppro365-ux/pcs-legat-avatar-pipeline/main/pcs-ai-operator-v4/motion.config.json';let token=localStorage.pcsToken||'';let state={page:'inbox',kb:[],crm:[],crmId:null,motion:null};const $=s=>document.querySelector(s);const esc=(s='')=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function loadMotion(){try{state.motion=await fetch(MOTION_URL,{cache:'no-store'}).then(r=>r.json())}catch{state.motion={presets:{}}}}function animate(el,preset='card',delay=0){if(!el||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const p=state.motion?.presets?.[preset]||{};const k=[{opacity:p.fromOpacity??0,transform:`translateY(${p.fromY??8}px) scale(${p.fromScale??1})`},{opacity:1,transform:'translateY(0) scale(1)'}];el.animate(k,{duration:p.duration||260,easing:p.easing||'ease-out',delay,fill:'both'})}function animatePage(){const main=$('#main');animate(main,'page');document.querySelectorAll('.metric,.card,.item,.client-row,.status-row').forEach((el,i)=>animate(el,'card',i*(state.motion?.presets?.card?.stagger||32)))}function press(btn){if(!btn||matchMedia('(prefers-reduced-motion: reduce)').matches)return;btn.animate([{transform:'scale(1)'},{transform:`scale(${state.motion?.presets?.button?.pressScale||.98})`},{transform:'scale(1)'}],{duration:state.motion?.presets?.button?.duration||120})}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('on');animate(t,'toast');setTimeout(()=>t.classList.remove('on'),2400)}async function call(path,opt={}){const h={'content-type':'application/json',...(opt.headers||{})};if(token)h.authorization='Bearer '+token;const r=await fetch(API+path,{...opt,headers:h});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'HTTP '+r.status);return d}
function theme(){const n=(document.body.dataset.theme||'light')==='dark'?'light':'dark';document.body.dataset.theme=n;localStorage.pcsTheme=n}
function shell(){const nav=[['inbox','Входящие'],['approvals','Требуют ответа'],['crm','CRM'],['kb','База знаний'],['connect','Подключения'],['status','Состояние']];const bottom=[['inbox','Входящие'],['approvals','Ответы'],['crm','CRM'],['kb','База'],['more','Ещё']];return `<div class="top"><div class="logo">PCS</div><div class="brand">PCS AI Operator</div><div class="spacer"></div><button class="iconbtn" aria-label="Сменить тему" onclick="theme()">◐</button></div><div class="layout"><aside class="side"><div class="nav">${nav.map(x=>`<button class="${state.page===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</div></aside><main id="main"></main></div><div class="bottom">${bottom.map(x=>`<button class="${state.page===x[0]?'on':''}" onclick="${x[0]==='more'?"openMore()":`go('${x[0]}')`}">${x[1]}</button>`).join('')}</div>`}
async function login(){document.body.dataset.theme=localStorage.pcsTheme||'light';$('#root').innerHTML=`<div class="login"><div class="loginbox"><div class="eyebrow">Premium Concierge Service Thailand</div><h1>PCS AI Operator</h1><p class="sub">Telegram Business · AI · CRM · база знаний</p><div class="field"><label>Пароль администратора</label><input id="pw" type="password" autocomplete="current-password"></div><button class="btn" style="width:100%;margin-top:14px" onclick="doLogin(this)">Войти</button><div id="le" class="error"></div></div></div>`;animate($('.loginbox'),'sheet')}
async function doLogin(btn){press(btn);try{const d=await call('/login',{method:'POST',body:JSON.stringify({password:$('#pw').value})});token=d.token;localStorage.pcsToken=token;await render()}catch(e){$('#le').textContent=e.message}}
async function render(){document.body.dataset.theme=localStorage.pcsTheme||'light';if(!state.motion)await loadMotion();if(!token)return login();try{await call('/session')}catch{token='';localStorage.removeItem('pcsToken');return login()}$('#root').innerHTML=shell();await renderPage()}
async function go(p){state.page=p;await render()}async function renderPage(){const m=$('#main');try{if(state.page==='inbox')await inbox(m);else if(state.page==='approvals')await approvals(m);else if(state.page==='crm')await crm(m);else if(state.page==='kb')await kb(m);else if(state.page==='connect')await connect(m);else await statusPage(m);animatePage()}catch(e){m.innerHTML=`<div class="card"><h2>Ошибка</h2><p>${esc(e.message)}</p></div>`}}
async function inbox(m){const [s,items]=await Promise.all([call('/status'),call('/inbox')]);m.innerHTML=`<div class="eyebrow">Telegram Business</div><h1 class="title">Входящие</h1><p class="sub">Реальные диалоги, AI-черновики, CRM и следующий шаг.</p><div class="metrics"><div class="metric"><small>Новые</small><b>${s.new_count||0}</b></div><div class="metric"><small>Требуют ответа</small><b>${s.approval_count||0}</b></div><div class="metric"><small>Горячие</small><b>${s.hot_count||0}</b></div><div class="metric"><small>Сегодня</small><b>${s.today_count||0}</b></div></div><div class="card"><h2>Диалоги</h2><div class="list">${items.length?items.map(x=>`<div class="item"><div class="toolbar" style="justify-content:space-between"><h3>${esc(x.name||x.username||'Клиент')}</h3><span class="pill">${esc(x.status||'NEW')}</span></div><p>${esc(x.last_message||'Нет сообщений')}</p><div class="toolbar"><button class="btn soft" onclick="openCrm('${x.id}')">Открыть CRM</button></div></div>`).join(''):'<div class="empty">Пока нет диалогов</div>'}</div></div>`}
async function approvals(m){const a=await call('/approvals');m.innerHTML=`<div class="eyebrow">AI Queue</div><h1 class="title">Требуют ответа</h1><p class="sub">Здесь остаются только ответы, которые нельзя отправить автоматически.</p><div class="list">${a.length?a.map(x=>`<div class="item"><h3>${esc(x.contact_name||'Клиент')}</h3><p><b>Входящее:</b> ${esc(x.source_text||'')}</p><div class="card" style="box-shadow:none;margin:8px 0"><b>Черновик</b><p>${esc(x.answer||'Нет черновика')}</p></div><p class="muted">${esc(x.policy_reason||'')}</p><div class="toolbar"><button class="btn" onclick="approval('${x.id}','send',this)">Отправить</button><button class="btn peach" onclick="approval('${x.id}','reject',this)">Отклонить</button></div></div>`).join(''):'<div class="empty">Очередь пуста</div>'}</div>`}
async function approval(id,act,btn){press(btn);try{await call(`/approvals/${id}/${act}`,{method:'POST'});toast(act==='send'?'Отправлено':'Отклонено');await renderPage()}catch(e){toast(e.message)}}
async function crm(m){state.crm=await call('/crm');m.innerHTML=`<div class="eyebrow">CRM</div><h1 class="title">Клиенты</h1><p class="sub">Карточка клиента, история, потребность, бюджет, статус и следующий шаг.</p><div class="toolbar" style="margin-bottom:12px"><div class="field search"><input id="crmSearch" placeholder="Поиск по имени, username, статусу, городу" oninput="filterCrm()"></div></div><div class="split"><div class="list" id="crmList">${crmRows(state.crm)}</div><div id="crmDetail" class="card" style="margin-top:0"><div class="empty">Выберите клиента</div></div></div>`;if(state.crmId&&state.crm.some(x=>x.id===state.crmId))await openCrm(state.crmId,false)}function crmRows(rows){return rows.length?rows.map(x=>`<div class="client-row ${state.crmId===x.id?'on':''}" data-crm="${x.id}" onclick="openCrm('${x.id}')"><b>${esc(x.name||x.username||'Клиент')}</b><span class="muted">${esc(x.intent||'other')} · ${esc(x.status||'NEW')} ${x.priority==='HOT'?'· 🔥 HOT':''}</span><span class="muted">${esc(x.next_action||'Следующий шаг не задан')}</span></div>`).join(''):'<div class="empty">Клиентов нет</div>'}function filterCrm(){const q=$('#crmSearch').value.toLowerCase();const rows=state.crm.filter(x=>JSON.stringify([x.name,x.username,x.intent,x.status,x.city,x.summary,x.need]).toLowerCase().includes(q));$('#crmList').innerHTML=crmRows(rows)}async function openCrm(id,switchPage=true){state.crmId=id;if(switchPage&&state.page!=='crm'){state.page='crm';await render();return}const d=await call('/crm/'+id);document.querySelectorAll('[data-crm]').forEach(x=>x.classList.toggle('on',x.dataset.crm===id));const c=d.contact;const el=$('#crmDetail');if(!el)return;el.innerHTML=`<div class="toolbar" style="justify-content:space-between"><h2>${esc(c.name||c.username||'Клиент')}</h2><button class="btn soft" onclick="editCrm('${id}')">Редактировать</button></div><div class="pills"><span class="pill">${esc(c.status||'NEW')}</span><span class="pill ${c.priority==='HOT'?'warn':''}">${esc(c.priority||'normal')}</span><span class="pill">${esc(c.intent||'other')}</span></div><div class="kv" style="margin-top:14px"><span>Username</span><b>${esc(c.username||'—')}</b><span>Город</span><b>${esc(c.city||'—')}</b><span>Что нужно</span><b>${esc(c.need||'—')}</b><span>Бюджет</span><b>${esc(c.budget||'—')}</b><span>Срок</span><b>${esc(c.deadline||'—')}</b><span>Summary</span><b>${esc(c.summary||'—')}</b><span>Следующий шаг</span><b>${esc(c.next_action||'—')}</b></div><h3 style="margin-top:18px">История</h3><div class="conversation">${d.messages.length?d.messages.map(x=>`<div class="bubble ${x.direction==='out'?'out':''}">${esc(x.text||'[вложение]')}</div>`).join(''):'<div class="empty">История пуста</div>'}</div><h3 style="margin-top:18px">Задачи</h3><div class="list">${d.tasks.length?d.tasks.map(t=>`<div class="item"><b>${esc(t.title)}</b><p>${esc(t.comment||'')}</p><span class="muted">${t.due_at?new Date(t.due_at).toLocaleString('ru-RU'):'Без срока'} ${t.completed_at?'· выполнено':''}</span></div>`).join(''):'<div class="empty">Задач нет</div>'}</div><button class="btn soft" style="margin-top:10px" onclick="newTask('${id}')">+ Задача</button>`;animate(el,'page')}
function editCrm(id){const c=state.crm.find(x=>x.id===id);if(!c)return;openSheet(`Редактировать клиента`,crmForm(c,id))}function crmForm(c,id){return `<div class="grid2"><div class="field"><label>Имя</label><input id="cf_name" value="${esc(c.name||'')}"></div><div class="field"><label>Статус</label><select id="cf_status">${['NEW','QUALIFYING','QUALIFIED','OFFER_SENT','WAITING_CLIENT','IN_PROGRESS','BOOKED','PAID','COMPLETED','LOST','SPAM'].map(v=>`<option ${c.status===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Приоритет</label><select id="cf_priority"><option value="normal" ${c.priority!=='HOT'?'selected':''}>Обычный</option><option value="HOT" ${c.priority==='HOT'?'selected':''}>HOT</option></select></div><div class="field"><label>Intent</label><input id="cf_intent" value="${esc(c.intent||'')}"></div><div class="field"><label>Город</label><input id="cf_city" value="${esc(c.city||'')}"></div><div class="field"><label>Бюджет</label><input id="cf_budget" value="${esc(c.budget||'')}"></div></div><div class="field" style="margin-top:12px"><label>Что нужно</label><textarea id="cf_need">${esc(c.need||'')}</textarea></div><div class="field" style="margin-top:12px"><label>Summary</label><textarea id="cf_summary">${esc(c.summary||'')}</textarea></div><div class="field" style="margin-top:12px"><label>Следующий шаг</label><textarea id="cf_next">${esc(c.next_action||'')}</textarea></div><div class="toolbar" style="margin-top:14px"><button class="btn" onclick="saveCrm('${id}',this)">Сохранить</button><button class="btn ghost" onclick="closeSheet()">Отмена</button></div>`}async function saveCrm(id,btn){press(btn);try{const body={name:$('#cf_name').value,status:$('#cf_status').value,priority:$('#cf_priority').value,intent:$('#cf_intent').value,city:$('#cf_city').value,budget:$('#cf_budget').value,need:$('#cf_need').value,summary:$('#cf_summary').value,next_action:$('#cf_next').value};await call('/crm/'+id,{method:'PATCH',body:JSON.stringify(body)});toast('Карточка сохранена');closeSheet();state.crm=await call('/crm');await openCrm(id,false)}catch(e){toast(e.message)}}function newTask(id){openSheet('Новая задача',`<div class="field"><label>Задача</label><input id="tf_title"></div><div class="field" style="margin-top:12px"><label>Комментарий</label><textarea id="tf_comment"></textarea></div><div class="field" style="margin-top:12px"><label>Срок</label><input id="tf_due" type="datetime-local"></div><div class="toolbar" style="margin-top:14px"><button class="btn" onclick="saveTask('${id}',this)">Создать</button><button class="btn ghost" onclick="closeSheet()">Отмена</button></div>`)}async function saveTask(id,btn){press(btn);try{await call(`/crm/${id}/tasks`,{method:'POST',body:JSON.stringify({title:$('#tf_title').value,comment:$('#tf_comment').value,due_at:$('#tf_due').value?new Date($('#tf_due').value).toISOString():null})});toast('Задача создана');closeSheet();await openCrm(id,false)}catch(e){toast(e.message)}}
async function kb(m){state.kb=await call('/knowledge');m.innerHTML=`<div class="eyebrow">Knowledge Base</div><h1 class="title">База знаний</h1><p class="sub">AI использует только активные customer-safe записи. Любую запись можно реально открыть, изменить и сохранить новой ревизией.</p><div class="toolbar" style="margin-bottom:12px"><button class="btn" onclick="newKb()">+ Добавить</button></div><div class="list">${state.kb.length?state.kb.map(x=>`<div class="item"><div class="toolbar" style="justify-content:space-between"><h3>${esc(x.title)}</h3><div class="pills"><span class="pill ${x.visibility==='approval_only'?'warn':x.visibility==='internal_only'?'bad':''}">${x.visibility==='customer_safe'?'Можно клиенту':x.visibility==='approval_only'?'С согласованием':'Внутренняя'}</span><span class="pill">rev ${x.revision||1}</span></div></div><p>${esc(x.description||'')}</p><div class="toolbar"><button class="btn soft kb-edit" data-id="${x.id}" onclick="openKbEditor('${x.id}',this)">Редактировать</button></div></div>`).join(''):'<div class="empty">База знаний пуста</div>'}</div>`;m.insertAdjacentHTML('beforeend','<button class="fab" onclick="newKb()" aria-label="Добавить запись">+</button>')}
function newKb(){openKbEditor(null)}function openKbEditor(id,btn){if(btn)press(btn);const x=id?state.kb.find(v=>v.id===id):{};if(id&&!x){toast('Запись не найдена');return}openSheet(id?'Редактировать запись':'Новая запись',kbForm(x||{},id))}function kbForm(x,id){return `<div class="grid2"><div class="field"><label>Название</label><input id="kf_title" value="${esc(x.title||'')}"></div><div class="field"><label>Категория</label><input id="kf_category" value="${esc(x.category||'')}"></div><div class="field"><label>Город</label><input id="kf_city" value="${esc(x.city||'')}"></div><div class="field"><label>Видимость</label><select id="kf_visibility"><option value="customer_safe" ${x.visibility==='customer_safe'?'selected':''}>Можно клиенту</option><option value="approval_only" ${x.visibility==='approval_only'?'selected':''}>С согласованием</option><option value="internal_only" ${x.visibility==='internal_only'?'selected':''}>Внутренняя</option></select></div><div class="field"><label>Цена</label><input id="kf_price" type="number" step="0.01" value="${x.price??''}"></div><div class="field"><label>Валюта</label><input id="kf_currency" value="${esc(x.currency||'')}"></div></div><div class="field" style="margin-top:12px"><label>Описание</label><textarea id="kf_description">${esc(x.description||'')}</textarea></div><div class="field" style="margin-top:12px"><label>Условия</label><textarea id="kf_conditions">${esc(x.conditions||'')}</textarea></div><div class="field" style="margin-top:12px"><label>Ограничения</label><textarea id="kf_restrictions">${esc(x.restrictions||'')}</textarea></div><div class="field" style="margin-top:12px"><label>Источник</label><input id="kf_source" value="${esc(x.source||'')}"></div><div class="field" style="margin-top:12px"><label>Подсказка AI</label><textarea id="kf_guidance">${esc(x.answer_guidance||'')}</textarea></div><label style="display:flex;gap:9px;align-items:center;margin-top:13px"><input id="kf_auto" type="checkbox" ${x.auto_answer_allowed?'checked':''}> Разрешить AI автоматический ответ</label><div class="toolbar" style="margin-top:14px"><button class="btn" onclick="saveKb('${id||''}',this)">Сохранить</button><button class="btn ghost" onclick="closeSheet()">Отмена</button></div>`}async function saveKb(id,btn){press(btn);try{const body={title:$('#kf_title').value.trim(),category:$('#kf_category').value.trim(),description:$('#kf_description').value.trim(),city:$('#kf_city').value.trim()||null,visibility:$('#kf_visibility').value,price:$('#kf_price').value?Number($('#kf_price').value):null,currency:$('#kf_currency').value.trim()||null,conditions:$('#kf_conditions').value.trim()||null,restrictions:$('#kf_restrictions').value.trim()||null,source:$('#kf_source').value.trim()||null,answer_guidance:$('#kf_guidance').value.trim()||null,auto_answer_allowed:$('#kf_auto').checked};if(!body.title||!body.category||!body.description)throw new Error('Название, категория и описание обязательны');await call(id?'/knowledge/'+id:'/knowledge',{method:id?'PATCH':'POST',body:JSON.stringify(body)});toast(id?'Запись обновлена':'Запись добавлена');closeSheet();state.kb=[];await kb($('#main'));animatePage()}catch(e){toast(e.message)}}
async function connect(m){const s=await call('/settings');m.innerHTML=`<div class="eyebrow">Connections</div><h1 class="title">Подключения</h1><p class="sub">Секреты хранятся только server-side. Пустые поля не перезаписывают сохранённые ключи.</p><div class="grid2"><div class="card" style="margin:0"><h2>Telegram Business</h2><p class="muted">@${esc(s.telegram_bot_username||'pcs_manager_bot')}</p><div class="field"><label>Bot Token</label><input id="tgToken" type="password" placeholder="${s.configured?.telegram_bot_token?'Сохранён · введите только для замены':'Вставьте токен'}"></div><div class="field" style="margin-top:10px"><label>Webhook Secret</label><input id="tgSecret" type="password" placeholder="${s.configured?.telegram_webhook_secret?'Сохранён':'Создастся автоматически'}"></div><div class="toolbar" style="margin-top:12px"><button class="btn" onclick="saveSettings(this)">Сохранить</button><button class="btn soft" onclick="testTelegram(this)">Проверить</button><button class="btn ghost" onclick="installWebhook(this)">Webhook</button></div></div><div class="card" style="margin:0"><h2>TokenRouter · Kimi K3</h2><div class="field"><label>API key</label><input id="trKey" type="password" placeholder="${s.configured?.tokenrouter_key?'Сохранён · введите только для замены':'Вставьте ключ'}"></div><div class="field" style="margin-top:10px"><label>Модель</label><input id="trModel" value="${esc(s.tokenrouter_model||'moonshotai/kimi-k3')}"></div><div class="toolbar" style="margin-top:12px"><button class="btn" onclick="saveSettings(this)">Сохранить</button><button class="btn soft" onclick="testTokenRouter(this)">Проверить AI</button></div></div></div>`}async function saveSettings(btn){press(btn);try{const b={};if($('#tgToken')?.value)b.telegram_bot_token=$('#tgToken').value;if($('#tgSecret')?.value)b.telegram_webhook_secret=$('#tgSecret').value;if($('#trKey')?.value)b.tokenrouter_key=$('#trKey').value;if($('#trModel'))b.tokenrouter_model=$('#trModel').value;await call('/settings',{method:'PUT',body:JSON.stringify(b)});toast('Настройки сохранены')}catch(e){toast(e.message)}}async function testTelegram(btn){press(btn);try{const d=await call('/test/telegram',{method:'POST'});toast('Telegram: @'+(d.username||'OK'))}catch(e){toast(e.message)}}async function installWebhook(btn){press(btn);try{await call('/telegram/install-webhook',{method:'POST'});toast('Webhook установлен')}catch(e){toast(e.message)}}async function testTokenRouter(btn){press(btn);try{await call('/test/tokenrouter',{method:'POST'});toast('TokenRouter отвечает')}catch(e){toast(e.message)}}
async function statusPage(m){const s=await call('/status');const rows=[['Backend',true,'Работает'],['База данных',!!s.database,'Работает'],['Telegram Bot',!!s.configured?.telegram_bot_token,s.configured?.telegram_bot_token?'Настроен':'Не настроен'],['Telegram Business',!!s.business_can_reply,s.business_can_reply?'Может отвечать':'Нет права ответа'],['TokenRouter',!!s.configured?.tokenrouter_key,s.configured?.tokenrouter_key?'Ключ сохранён':'Не настроен'],['Auto-send',!!s.auto_send,s.auto_send?'Включён':'Выключен']];m.innerHTML=`<div class="eyebrow">Health</div><h1 class="title">Состояние системы</h1><p class="sub">Только реальные состояния, без декоративной аналитики.</p><div class="status-list">${rows.map(r=>`<div class="status-row"><span class="status-name">${r[0]}</span><span class="status-badge ${r[1]?'':'warn'}"><span class="dot"></span>${r[2]}</span></div>`).join('')}</div>`}
function openMore(){openSheet('Ещё',`<div class="list"><button class="btn soft" onclick="closeSheet();go('connect')">Подключения</button><button class="btn soft" onclick="closeSheet();go('status')">Состояние системы</button></div>`)}function openSheet(title,html){const s=$('#sheet'),b=$('#sheetbox');b.innerHTML=`<div class="sheethead"><h2>${esc(title)}</h2><div class="spacer"></div><button class="iconbtn" onclick="closeSheet()" aria-label="Закрыть">×</button></div>${html}`;s.classList.add('on');s.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';animate(b,'sheet')}function closeSheet(){const s=$('#sheet');s.classList.remove('on');s.setAttribute('aria-hidden','true');document.body.style.overflow=''}$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});loadMotion().then(render);
</script></body></html>
