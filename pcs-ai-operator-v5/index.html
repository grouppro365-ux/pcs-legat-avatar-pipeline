<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f2ec"><title>PCS AI Operator</title><style>
:root{--bg:#f6f2ec;--panel:#fffdf9;--panel2:#f3efe9;--ink:#252830;--muted:#777b84;--line:#ddd6cd;--lav:#e9e1f6;--sage:#e3ebdd;--blue:#dfeaf5;--peach:#f2ded3;--warn:#f4e8b2;--danger:#f1d8d8;--ok:#4f7f61;--shadow:0 18px 48px rgba(37,40,48,.09);--r:22px}
[data-theme=dark]{--bg:#17191e;--panel:#22262d;--panel2:#1c2026;--ink:#f5f1ea;--muted:#a8acb4;--line:#353a44;--lav:#40374f;--sage:#344139;--blue:#303c49;--peach:#4a3832;--warn:#514a2d;--danger:#4a3030;--ok:#8bc49a;--shadow:0 18px 48px rgba(0,0,0,.28)}
*{box-sizing:border-box}html,body{margin:0;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{height:64px;position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;padding:10px 16px;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.logo{width:42px;height:42px;border-radius:14px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:900}.brand{font-weight:850;font-size:18px}.spacer{flex:1}.iconbtn{width:44px;height:44px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink)}.layout{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100dvh - 64px)}.side{padding:18px 14px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--panel) 45%,transparent)}.nav{display:grid;gap:7px}.nav button{min-height:46px;border:0;background:transparent;color:var(--muted);text-align:left;padding:11px 13px;border-radius:14px;font-weight:760}.nav button.on{background:var(--lav);color:var(--ink)}main{width:min(100%,1360px);margin:0 auto;padding:28px clamp(18px,3vw,42px) 58px;min-width:0}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#927baa;font-weight:850}.title{font-size:clamp(34px,4vw,48px);line-height:1.02;letter-spacing:-.045em;margin:8px 0}.sub{color:var(--muted);margin:0 0 18px;max-width:800px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric,.card,.item{border:1px solid var(--line);box-shadow:var(--shadow);background:var(--panel)}.metric{min-height:108px;border-radius:22px;padding:16px;display:flex;flex-direction:column;justify-content:space-between}.metric:nth-child(1){background:linear-gradient(145deg,var(--panel),var(--lav))}.metric:nth-child(2){background:linear-gradient(145deg,var(--panel),var(--blue))}.metric:nth-child(3){background:linear-gradient(145deg,var(--panel),var(--sage))}.metric:nth-child(4){background:linear-gradient(145deg,var(--panel),var(--peach))}.metric small{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}.metric b{font-size:32px}.card{border-radius:var(--r);padding:18px;margin-top:14px}.item{border-radius:18px;padding:15px}.item h3,.card h2,.card h3{margin:0 0 8px}.item p{margin:6px 0;color:var(--muted);overflow-wrap:anywhere}.list{display:grid;gap:11px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{min-height:44px;border:0;border-radius:13px;padding:10px 14px;background:var(--ink);color:var(--bg);font-weight:800}.btn.soft{background:var(--lav);color:var(--ink)}.btn.blue{background:var(--blue);color:var(--ink)}.btn.sage{background:var(--sage);color:var(--ink)}.btn.peach{background:var(--peach);color:var(--ink)}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:var(--danger);color:var(--ink)}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;background:var(--sage);font-size:12px}.pill.warn{background:var(--warn)}.pill.bad{background:var(--danger)}.pills{display:flex;gap:7px;flex-wrap:wrap}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:750}.field input,.field textarea,.field select{width:100%;min-height:46px;padding:11px 12px;border-radius:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);outline:none;font-size:16px}.field textarea{min-height:110px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#9e87bb;box-shadow:0 0 0 3px color-mix(in srgb,var(--lav) 75%,transparent)}.split{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:14px}.client-row{display:grid;gap:4px;padding:13px;border:1px solid var(--line);border-radius:16px;background:var(--panel);cursor:pointer}.client-row.on{outline:2px solid #a994c2;background:var(--lav)}.muted{color:var(--muted)}.conversation{display:grid;gap:9px;max-height:390px;overflow:auto;padding-right:4px}.bubble{max-width:86%;padding:10px 12px;border-radius:15px;background:var(--panel2);border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}.bubble.out{margin-left:auto;background:var(--blue)}.kv{display:grid;grid-template-columns:135px minmax(0,1fr);gap:7px 12px}.kv span:nth-child(odd){color:var(--muted)}.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}.actions .btn{width:100%}.media-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}.media{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel2);aspect-ratio:4/3}.media img{width:100%;height:100%;object-fit:cover;display:block}.media .media-actions{position:absolute;left:6px;right:6px;bottom:6px;display:flex;gap:5px}.media .media-actions button{flex:1;min-height:34px;border:0;border-radius:9px;background:rgba(20,22,26,.82);color:#fff;font-size:11px}.catalog-card{display:grid;grid-template-columns:180px minmax(0,1fr);gap:14px}.cover{width:180px;aspect-ratio:4/3;border-radius:16px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}.cover img{width:100%;height:100%;object-fit:cover}.empty-cover{height:100%;display:grid;place-items:center;color:var(--muted);font-weight:700}.sheet{display:none;position:fixed;inset:0;z-index:100;background:rgba(12,14,18,.48);align-items:flex-end}.sheet.on{display:flex}.sheetbox{width:min(820px,100%);max-height:94dvh;overflow:auto;margin:0 auto;background:var(--panel);border-radius:26px 26px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -16px 54px rgba(0,0,0,.18)}.sheethead{position:sticky;top:-18px;z-index:3;display:flex;align-items:center;gap:10px;padding:18px 0 12px;background:var(--panel)}.sheethead h2{margin:0}.bottom{display:none}.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));z-index:130;transform:translate(-50%,12px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:13px;max-width:calc(100vw - 28px);pointer-events:none}.toast.on{opacity:1;transform:translate(-50%,0)}.login{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 82% 10%,var(--lav),transparent 38%),var(--bg)}.loginbox{width:min(470px,100%);background:var(--panel);border:1px solid var(--line);border-radius:29px;padding:28px;box-shadow:var(--shadow)}.loginbox h1{font-size:clamp(34px,8vw,42px);line-height:1.04;margin:12px 0}.error{color:#b55b5b;margin-top:10px}.empty{padding:24px 12px;text-align:center;color:var(--muted)}.search{width:min(430px,100%)}.status-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 15px;border:1px solid var(--line);border-radius:17px;background:var(--panel)}
@media(max-width:1024px){.layout{grid-template-columns:205px minmax(0,1fr)}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:1fr}.split{grid-template-columns:300px minmax(0,1fr)}.media-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.actions{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:768px){.top{height:60px;padding:8px 14px}.logo{width:40px;height:40px}.brand{font-size:16px}.layout{display:block}.side{display:none}main{width:100%;padding:18px 12px calc(96px + env(safe-area-inset-bottom))}.title{font-size:32px}.sub{font-size:14px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.metric{min-height:92px;padding:13px;border-radius:18px}.metric b{font-size:28px}.card{padding:14px;border-radius:19px;margin-top:11px}.grid2,.grid3,.split{grid-template-columns:1fr}.actions{grid-template-columns:repeat(2,minmax(0,1fr))}.catalog-card{grid-template-columns:1fr}.cover{width:100%}.media-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar .btn{flex:1 1 130px}.bottom{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:70;padding:5px;border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,var(--panel) 96%,transparent);backdrop-filter:blur(18px);box-shadow:0 15px 44px rgba(37,40,48,.14)}.bottom button{min-height:50px;min-width:0;border:0;background:transparent;color:var(--muted);border-radius:13px;padding:6px 2px;font-size:10px;font-weight:750}.bottom button.on{background:var(--lav);color:var(--ink)}.sheet{align-items:stretch;padding-top:max(20px,env(safe-area-inset-top))}.sheetbox{height:100%;max-height:100%;border-radius:22px 22px 0 0;padding:15px 15px calc(24px + env(safe-area-inset-bottom))}.sheethead{top:-15px;padding:15px 0 11px}.conversation{max-height:48dvh}.kv{grid-template-columns:105px minmax(0,1fr)}}
@media(max-width:430px){.brand{font-size:15px}.title{font-size:30px}.actions{grid-template-columns:1fr}.media-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.kv{grid-template-columns:1fr;gap:2px}.kv span:nth-child(odd){margin-top:5px}}

</style></head><body><div id="root"></div><div id="sheet" class="sheet" aria-hidden="true"><div id="sheetbox" class="sheetbox"></div></div><div id="toast" class="toast"></div><script>
const API='https://nnlzgertmmxuteozoeel.supabase.co/functions/v1/pcs-ui-api';const MOTION='https://raw.githubusercontent.com/grouppro365-ux/pcs-legat-avatar-pipeline/main/pcs-ai-operator-v5/motion.config.json';let token=localStorage.pcsToken||'';let state={page:'inbox',crm:[],crmId:null,kb:[],catalog:[],motion:null};const $=s=>document.querySelector(s);const esc=(s='')=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function loadMotion(){try{state.motion=await fetch(MOTION,{cache:'no-store'}).then(r=>r.json())}catch{state.motion={presets:{}}}}function anim(el,p='card',d=0){if(!el||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const x=state.motion?.presets?.[p]||{};el.animate([{opacity:x.fromOpacity??0,transform:`translateY(${x.fromY??8}px) scale(${x.fromScale??1})`},{opacity:1,transform:'translateY(0) scale(1)'}],{duration:x.duration||260,easing:x.easing||'ease-out',delay:d,fill:'both'})}function animatePage(){anim($('#main'),'page');document.querySelectorAll('.metric,.card,.item,.client-row,.status-row').forEach((x,i)=>anim(x,'card',i*(state.motion?.presets?.card?.stagger||30)))}function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('on');anim(t,'toast');setTimeout(()=>t.classList.remove('on'),2400)}
async function call(path,opt={}){const h={'content-type':'application/json',...(opt.headers||{})};if(token)h.authorization='Bearer '+token;const r=await fetch(API+path,{...opt,headers:h});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'HTTP '+r.status);return d}async function upload(path,fd){const h={};if(token)h.authorization='Bearer '+token;const r=await fetch(API+path,{method:'POST',headers:h,body:fd});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'HTTP '+r.status);return d}
function theme(){const n=(document.body.dataset.theme||'light')==='dark'?'light':'dark';document.body.dataset.theme=n;localStorage.pcsTheme=n}
function shell(){const nav=[['inbox','Входящие'],['approvals','Требуют ответа'],['crm','CRM'],['catalog','Каталог'],['kb','База знаний'],['connect','Подключения'],['status','Состояние']];const bottom=[['inbox','Входящие'],['crm','CRM'],['catalog','Каталог'],['kb','База'],['more','Ещё']];return `<div class="top"><div class="logo">PCS</div><div class="brand">PCS AI Operator</div><div class="spacer"></div><button class="iconbtn" onclick="theme()">◐</button></div><div class="layout"><aside class="side"><div class="nav">${nav.map(x=>`<button class="${state.page===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</div></aside><main id="main"></main></div><div class="bottom">${bottom.map(x=>`<button class="${state.page===x[0]?'on':''}" onclick="${x[0]==='more'?"more()":`go('${x[0]}')`}">${x[1]}</button>`).join('')}</div>`}
async function login(){document.body.dataset.theme=localStorage.pcsTheme||'light';$('#root').innerHTML=`<div class="login"><div class="loginbox"><div class="eyebrow">Premium Concierge Service Thailand</div><h1>PCS AI Operator</h1><p class="sub">Telegram Business · AI · CRM · каталог · база знаний</p><div class="field"><label>Пароль администратора</label><input id="pw" type="password"></div><button class="btn" style="width:100%;margin-top:14px" onclick="doLogin()">Войти</button><div id="le" class="error"></div></div></div>`;anim($('.loginbox'),'sheet')}async function doLogin(){try{const d=await call('/login',{method:'POST',body:JSON.stringify({password:$('#pw').value})});token=d.token;localStorage.pcsToken=token;render()}catch(e){$('#le').textContent=e.message}}
async function render(){document.body.dataset.theme=localStorage.pcsTheme||'light';if(!state.motion)await loadMotion();if(!token)return login();try{await call('/session')}catch{token='';localStorage.removeItem('pcsToken');return login()}$('#root').innerHTML=shell();renderPage()}async function go(p){state.page=p;render()}async function renderPage(){const m=$('#main');try{if(state.page==='inbox')await inbox(m);else if(state.page==='approvals')await approvals(m);else if(state.page==='crm')await crm(m);else if(state.page==='catalog')await catalog(m);else if(state.page==='kb')await kb(m);else if(state.page==='connect')await connect(m);else await statusPage(m);animatePage()}catch(e){m.innerHTML=`<div class="card"><h2>Ошибка</h2><p>${esc(e.message)}</p></div>`}}
async function inbox(m){const [s,a]=await Promise.all([call('/status'),call('/inbox')]);m.innerHTML=`<div class="eyebrow">Telegram Business</div><h1 class="title">Входящие</h1><p class="sub">Кому нужно ответить и что происходит прямо сейчас.</p><div class="metrics"><div class="metric"><small>Новые</small><b>${s.new_count||0}</b></div><div class="metric"><small>Требуют ответа</small><b>${s.approval_count||0}</b></div><div class="metric"><small>Горячие</small><b>${s.hot_count||0}</b></div><div class="metric"><small>Сегодня</small><b>${s.today_count||0}</b></div></div><div class="card"><div class="list">${a.length?a.map(x=>`<div class="item"><div class="toolbar" style="justify-content:space-between"><h3>${esc(x.name||x.username||'Клиент')}</h3><span class="pill">${esc(x.status||'NEW')}</span></div><p>${esc(x.last_message||'Нет сообщений')}</p><div class="toolbar"><button class="btn soft" onclick="openCrm('${x.id}')">CRM и действия</button></div></div>`).join(''):'<div class="empty">Нет диалогов</div>'}</div></div>`}
async function approvals(m){const a=await call('/approvals');m.innerHTML=`<div class="eyebrow">AI Queue</div><h1 class="title">Требуют ответа</h1><div class="list">${a.length?a.map(x=>`<div class="item"><h3>${esc(x.contact_name||'Клиент')}</h3><p><b>Входящее:</b> ${esc(x.source_text||'')}</p><div class="card" style="box-shadow:none"><p>${esc(x.answer||'')}</p></div><div class="toolbar"><button class="btn" onclick="approval('${x.id}','send')">Отправить</button><button class="btn peach" onclick="approval('${x.id}','reject')">Отклонить</button></div></div>`).join(''):'<div class="empty">Очередь пуста</div>'}</div>`}async function approval(id,a){try{await call(`/approvals/${id}/${a}`,{method:'POST'});toast(a==='send'?'Отправлено':'Отклонено');renderPage()}catch(e){toast(e.message)}}
async function crm(m){state.crm=await call('/crm');m.innerHTML=`<div class="eyebrow">Sales CRM</div><h1 class="title">CRM</h1><p class="sub">Не просто карточка: здесь можно написать клиенту, отправить follow-up, фото выбранного объекта и перевести сделку по стадиям.</p><div class="field search" style="margin-bottom:12px"><input id="crmQ" placeholder="Поиск" oninput="filterCrm()"></div><div class="split"><div id="crmList" class="list">${crmRows(state.crm)}</div><div id="crmDetail" class="card" style="margin-top:0"><div class="empty">Выберите клиента</div></div></div>`;if(state.crmId&&state.crm.some(x=>x.id===state.crmId))openCrm(state.crmId,false)}function crmRows(a){return a.length?a.map(x=>`<div class="client-row ${state.crmId===x.id?'on':''}" onclick="openCrm('${x.id}')"><b>${esc(x.name||x.username||'Клиент')}</b><span class="muted">${esc(x.intent||'other')} · ${esc(x.status||'NEW')} ${x.priority==='HOT'?'🔥':''}</span><span class="muted">${esc(x.next_action||'Следующий шаг не задан')}</span></div>`).join(''):'<div class="empty">Клиентов нет</div>'}function filterCrm(){const q=$('#crmQ').value.toLowerCase();$('#crmList').innerHTML=crmRows(state.crm.filter(x=>JSON.stringify(x).toLowerCase().includes(q)))}
async function openCrm(id,switchPage=true){state.crmId=id;if(switchPage&&state.page!=='crm'){state.page='crm';return render()}const d=await call('/crm/'+id),c=d.contact,e=$('#crmDetail');if(!e)return;const sel=d.selected;e.innerHTML=`<div class="toolbar" style="justify-content:space-between"><h2>${esc(c.name||c.username||'Клиент')}</h2><button class="btn soft" onclick="editCrm('${id}')">Редактировать</button></div><div class="pills"><span class="pill">${esc(c.status||'NEW')}</span><span class="pill ${c.priority==='HOT'?'warn':''}">${esc(c.priority||'normal')}</span><span class="pill">${esc(c.deal_stage||'—')}</span><span class="pill">${esc(c.language||c.detected_language||'ru')}</span></div><div class="actions"><button class="btn" onclick="compose('${id}')">Написать клиенту</button><button class="btn blue" onclick="followup('${id}')">Follow-up сейчас</button><button class="btn sage" onclick="sendSelected('${id}')" ${sel?'':'disabled'}>Отправить фото выбранного</button><button class="btn soft" onclick="crmAction('${id}','hot')">🔥 HOT</button><button class="btn soft" onclick="crmAction('${id}','ready_to_pay')">Готов к оплате</button><button class="btn sage" onclick="crmAction('${id}','paid')">Оплачено</button><button class="btn ghost" onclick="crmAction('${id}','waiting')">Ждём клиента</button><button class="btn danger" onclick="crmAction('${id}','lost')">Потерян</button><button class="btn ghost" onclick="newTask('${id}')">+ Задача</button></div><div class="kv"><span>Username</span><b>${esc(c.username||'—')}</b><span>Город</span><b>${esc(c.city||'—')}</b><span>Что нужно</span><b>${esc(c.need||'—')}</b><span>Бюджет</span><b>${esc(c.budget||'—')}</b><span>Summary</span><b>${esc(c.summary||'—')}</b><span>Следующий шаг</span><b>${esc(c.next_action||'—')}</b><span>Follow-up</span><b>${c.last_followup_at?new Date(c.last_followup_at).toLocaleString('ru-RU'):'ещё не было'} · ${c.followup_count||0}</b></div>${sel?`<div class="item" style="margin-top:14px"><h3>Выбрано: ${esc(sel.title)}</h3><p>${esc(sel.description||'')}</p><div class="media-grid">${(sel.media_items||[]).slice(0,6).map(x=>`<div class="media"><img src="${esc(x.public_url)}" alt=""></div>`).join('')}</div></div>`:''}<h3 style="margin-top:18px">История</h3><div class="conversation">${d.messages.length?d.messages.map(x=>`<div class="bubble ${x.direction==='out'?'out':''}">${esc(x.text||'[вложение]')}</div>`).join(''):'<div class="empty">Пусто</div>'}</div><h3 style="margin-top:18px">Задачи</h3><div class="list">${d.tasks.length?d.tasks.map(t=>`<div class="item"><b>${esc(t.title)}</b><p>${esc(t.comment||'')}</p></div>`).join(''):'<div class="empty">Нет задач</div>'}</div>`;anim(e,'page')}
function compose(id){openSheet('Написать клиенту',`<div class="field"><label>Сообщение</label><textarea id="msg"></textarea></div><div class="toolbar" style="margin-top:12px"><button class="btn" onclick="sendMsg('${id}')">Отправить сейчас</button><button class="btn ghost" onclick="closeSheet()">Отмена</button></div>`)}async function sendMsg(id){try{await call(`/crm/${id}/send`,{method:'POST',body:JSON.stringify({text:$('#msg').value})});toast('Сообщение отправлено');closeSheet();openCrm(id,false)}catch(e){toast(e.message)}}async function followup(id){try{const d=await call(`/crm/${id}/followup`,{method:'POST',body:'{}'});toast('Follow-up отправлен');openCrm(id,false)}catch(e){toast(e.message)}}async function sendSelected(id){try{const d=await call(`/crm/${id}/selected-media`,{method:'POST',body:'{}'});toast(`Отправлено фото: ${d.count||0}`);openCrm(id,false)}catch(e){toast(e.message)}}async function crmAction(id,a){try{await call(`/crm/${id}/action`,{method:'POST',body:JSON.stringify({action:a})});toast('CRM обновлена');state.crm=await call('/crm');openCrm(id,false)}catch(e){toast(e.message)}}
function editCrm(id){const c=state.crm.find(x=>x.id===id);if(!c)return;openSheet('Редактировать клиента',`<div class="grid2"><div class="field"><label>Имя</label><input id="cn" value="${esc(c.name||'')}"></div><div class="field"><label>Статус</label><select id="cs">${['NEW','QUALIFYING','QUALIFIED','OFFER_SENT','WAITING_CLIENT','IN_PROGRESS','BOOKED','PAID','COMPLETED','LOST','SPAM'].map(v=>`<option ${c.status===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Город</label><input id="cc" value="${esc(c.city||'')}"></div><div class="field"><label>Бюджет</label><input id="cb" value="${esc(c.budget||'')}"></div></div><div class="field" style="margin-top:10px"><label>Потребность</label><textarea id="cneed">${esc(c.need||'')}</textarea></div><div class="field" style="margin-top:10px"><label>Следующий шаг</label><textarea id="cnext">${esc(c.next_action||'')}</textarea></div><div class="toolbar" style="margin-top:12px"><button class="btn" onclick="saveCrm('${id}')">Сохранить</button><button class="btn ghost" onclick="closeSheet()">Отмена</button></div>`)}async function saveCrm(id){try{await call('/crm/'+id,{method:'PATCH',body:JSON.stringify({name:$('#cn').value,status:$('#cs').value,city:$('#cc').value,budget:$('#cb').value,need:$('#cneed').value,next_action:$('#cnext').value})});toast('Сохранено');closeSheet();state.crm=await call('/crm');openCrm(id,false)}catch(e){toast(e.message)}}function newTask(id){openSheet('Новая задача',`<div class="field"><label>Задача</label><input id="tt"></div><div class="field" style="margin-top:10px"><label>Комментарий</label><textarea id="tc"></textarea></div><div class="field" style="margin-top:10px"><label>Срок</label><input id="td" type="datetime-local"></div><div class="toolbar" style="margin-top:12px"><button class="btn" onclick="saveTask('${id}')">Создать</button></div>`)}async function saveTask(id){try{await call(`/crm/${id}/tasks`,{method:'POST',body:JSON.stringify({title:$('#tt').value,comment:$('#tc').value,due_at:$('#td').value?new Date($('#td').value).toISOString():null})});toast('Задача создана');closeSheet();openCrm(id,false)}catch(e){toast(e.message)}}
async function catalog(m){state.catalog=await call('/catalog');m.innerHTML=`<div class="eyebrow">Inventory</div><h1 class="title">Каталог</h1><p class="sub">Авто, квартиры и другие позиции. Здесь загружаются фотографии, которые бот может отправлять клиентам.</p><div class="list">${state.catalog.length?state.catalog.map(x=>{const p=(x.media_items||[])[0];const price=x.final_price??x.price;return `<div class="item catalog-card"><div class="cover">${p?`<img src="${esc(p.public_url)}" alt="">`:'<div class="empty-cover">Нет фото</div>'}</div><div><div class="toolbar" style="justify-content:space-between"><h3>${esc(x.title)}</h3><div class="pills"><span class="pill">${esc(x.category)}</span><span class="pill ${x.status==='available'?'':'warn'}">${esc(x.status||'checking')}</span></div></div><p>${esc(x.description||'')}</p><p><b>${price??'Цена не задана'} ${esc(x.currency||'')}</b>${x.partner_cost!=null?` · клиентская цена включает ${x.markup_percent||20}%`:''}</p><div class="toolbar"><button class="btn soft" onclick="editCatalog('${x.id}')">Редактировать</button><button class="btn blue" onclick="mediaManager('${x.id}')">Фото (${(x.media_items||[]).length})</button></div></div></div>`}).join(''):'<div class="empty">Каталог пуст</div>'}</div>`}
function editCatalog(id){const x=state.catalog.find(v=>v.id===id);openSheet('Редактировать позицию',`<div class="grid2"><div class="field"><label>Название</label><input id="it" value="${esc(x.title)}"></div><div class="field"><label>Статус</label><select id="is"><option value="checking" ${x.status==='checking'?'selected':''}>checking</option><option value="available" ${x.status==='available'?'selected':''}>available</option><option value="unavailable" ${x.status==='unavailable'?'selected':''}>unavailable</option></select></div><div class="field"><label>Партнёрская цена</label><input id="ipc" type="number" value="${x.partner_cost??''}"></div><div class="field"><label>Наценка %</label><input id="im" type="number" value="${x.markup_percent??20}"></div><div class="field"><label>Валюта</label><input id="ic" value="${esc(x.currency||'THB')}"></div><div class="field"><label>Город</label><input id="icity" value="${esc(x.city||'')}"></div></div><div class="field" style="margin-top:10px"><label>Описание</label><textarea id="idsc">${esc(x.description||'')}</textarea></div><div class="toolbar" style="margin-top:12px"><button class="btn" onclick="saveCatalog('${id}')">Сохранить</button></div>`)}async function saveCatalog(id){try{await call('/catalog/'+id,{method:'PATCH',body:JSON.stringify({title:$('#it').value,status:$('#is').value,partner_cost:$('#ipc').value?Number($('#ipc').value):null,markup_percent:Number($('#im').value||20),currency:$('#ic').value,city:$('#icity').value,description:$('#idsc').value})});toast('Позиция обновлена');closeSheet();catalog($('#main'))}catch(e){toast(e.message)}}
function mediaManager(id){const x=state.catalog.find(v=>v.id===id);openSheet('Фотографии · '+x.title,`<div class="field"><label>Добавить фото</label><input id="photos" type="file" accept="image/*" multiple></div><div class="toolbar" style="margin-top:10px"><button class="btn" onclick="uploadPhotos('${id}')">Загрузить</button></div><div class="media-grid" style="margin-top:16px">${(x.media_items||[]).map((p,i)=>`<div class="media"><img src="${esc(p.public_url)}" alt=""><div class="media-actions"><button onclick="mainPhoto('${id}','${p.id}')">${i===0?'Главная':'Сделать главной'}</button><button onclick="deletePhoto('${id}','${p.id}')">Удалить</button></div></div>`).join('')}</div>`)}async function uploadPhotos(id){const fs=$('#photos').files;if(!fs?.length)return toast('Выберите фото');const fd=new FormData();for(const f of fs)fd.append('files',f);try{await upload(`/catalog/${id}/media`,fd);toast('Фото загружены');closeSheet();state.catalog=await call('/catalog');mediaManager(id)}catch(e){toast(e.message)}}async function deletePhoto(id,mid){try{await call(`/catalog/${id}/media/${mid}`,{method:'DELETE'});toast('Фото удалено');closeSheet();state.catalog=await call('/catalog');mediaManager(id)}catch(e){toast(e.message)}}async function mainPhoto(id,mid){const x=state.catalog.find(v=>v.id===id),arr=x.media_items||[],sel=arr.find(v=>v.id===mid);try{await call(`/catalog/${id}/media/${mid}`,{method:'PATCH',body:JSON.stringify({sort_order:-1})});toast('Главное фото изменено');closeSheet();state.catalog=await call('/catalog');mediaManager(id)}catch(e){toast(e.message)}}
async function kb(m){state.kb=await call('/knowledge');m.innerHTML=`<div class="eyebrow">Knowledge Base</div><h1 class="title">База знаний</h1><div class="toolbar" style="margin-bottom:12px"><button class="btn" onclick="kbEdit('')">+ Добавить</button></div><div class="list">${state.kb.map(x=>`<div class="item"><h3>${esc(x.title)}</h3><p>${esc(x.description||'')}</p><div class="toolbar"><button class="btn soft" onclick="kbEdit('${x.id}')">Редактировать</button></div></div>`).join('')}</div>`}function kbEdit(id){const x=id?state.kb.find(v=>v.id===id):{};openSheet(id?'Редактировать запись':'Новая запись',`<div class="grid2"><div class="field"><label>Название</label><input id="kt" value="${esc(x.title||'')}"></div><div class="field"><label>Категория</label><input id="kc" value="${esc(x.category||'')}"></div></div><div class="field" style="margin-top:10px"><label>Описание</label><textarea id="kd">${esc(x.description||'')}</textarea></div><div class="field" style="margin-top:10px"><label>Условия</label><textarea id="kcond">${esc(x.conditions||'')}</textarea></div><div class="toolbar" style="margin-top:12px"><button class="btn" onclick="saveKb('${id}')">Сохранить</button></div>`)}async function saveKb(id){try{const b={title:$('#kt').value,category:$('#kc').value,description:$('#kd').value,conditions:$('#kcond').value,status:'active',visibility:'customer_safe',auto_answer_allowed:true};await call(id?'/knowledge/'+id:'/knowledge',{method:id?'PATCH':'POST',body:JSON.stringify(b)});toast('Сохранено');closeSheet();kb($('#main'))}catch(e){toast(e.message)}}
async function connect(m){const s=await call('/settings');m.innerHTML=`<div class="eyebrow">Connections</div><h1 class="title">Подключения</h1><div class="grid2"><div class="card" style="margin:0"><h2>Telegram Business</h2><div class="field"><label>Bot Token</label><input id="tg" type="password" placeholder="${s.configured?.telegram_bot_token?'Сохранён':'Вставьте токен'}"></div><div class="toolbar" style="margin-top:12px"><button class="btn" onclick="saveSettings()">Сохранить</button><button class="btn soft" onclick="installWebhook()">Webhook</button></div></div><div class="card" style="margin:0"><h2>TokenRouter</h2><div class="field"><label>API key</label><input id="tr" type="password" placeholder="${s.configured?.tokenrouter_key?'Сохранён':'Вставьте ключ'}"></div><div class="field" style="margin-top:10px"><label>Модель</label><input id="model" value="${esc(s.tokenrouter_model||'moonshotai/kimi-k3')}"></div><div class="toolbar" style="margin-top:12px"><button class="btn" onclick="saveSettings()">Сохранить</button><button class="btn soft" onclick="testAI()">Проверить</button></div></div></div>`}async function saveSettings(){const b={};if($('#tg')?.value)b.telegram_bot_token=$('#tg').value;if($('#tr')?.value)b.tokenrouter_key=$('#tr').value;if($('#model'))b.tokenrouter_model=$('#model').value;try{await call('/settings',{method:'PUT',body:JSON.stringify(b)});toast('Настройки сохранены')}catch(e){toast(e.message)}}async function installWebhook(){try{await call('/telegram/install-webhook',{method:'POST'});toast('Webhook установлен')}catch(e){toast(e.message)}}async function testAI(){try{await call('/test/tokenrouter',{method:'POST'});toast('AI отвечает')}catch(e){toast(e.message)}}
async function statusPage(m){const s=await call('/status');const rows=[['Backend',true,'Работает'],['База данных',!!s.database,'Работает'],['Telegram Bot',!!s.configured?.telegram_bot_token,s.configured?.telegram_bot_token?'Настроен':'Не настроен'],['Telegram Business',!!s.business_can_reply,s.business_can_reply?'Может отвечать':'Права ограничены'],['TokenRouter',!!s.configured?.tokenrouter_key,s.configured?.tokenrouter_key?'Ключ сохранён':'Не настроен'],['Auto-send',!!s.auto_send,s.auto_send?'Включён':'Выключен']];m.innerHTML=`<div class="eyebrow">Health</div><h1 class="title">Состояние системы</h1><div class="list">${rows.map(r=>`<div class="status-row"><b>${r[0]}</b><span class="pill ${r[1]?'':'warn'}">${r[2]}</span></div>`).join('')}</div>`}
function more(){openSheet('Ещё',`<div class="list"><button class="btn soft" onclick="closeSheet();go('approvals')">Требуют ответа</button><button class="btn soft" onclick="closeSheet();go('connect')">Подключения</button><button class="btn soft" onclick="closeSheet();go('status')">Состояние</button></div>`)}function openSheet(t,h){const s=$('#sheet'),b=$('#sheetbox');b.innerHTML=`<div class="sheethead"><h2>${esc(t)}</h2><div class="spacer"></div><button class="iconbtn" onclick="closeSheet()">×</button></div>${h}`;s.classList.add('on');document.body.style.overflow='hidden';anim(b,'sheet')}function closeSheet(){$('#sheet').classList.remove('on');document.body.style.overflow=''}$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});loadMotion().then(render);
</script></body></html>
