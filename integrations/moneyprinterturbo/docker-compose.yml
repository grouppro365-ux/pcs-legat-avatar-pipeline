# Optional service: MoneyPrinterTurbo. Does not modify or replace the Kaggle avatar pipeline.
# Based on upstream's official docker-compose.release.yml.
name: pcs-legat-moneyprinterturbo
x-mpt-volumes: &mpt-volumes
  - ./config.toml:/MoneyPrinterTurbo/config.toml
  - ./storage:/MoneyPrinterTurbo/storage
services:
  webui:
    image: ghcr.io/harry0703/moneyprinterturbo:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    command:
      - streamlit
      - run
      - ./webui/Main.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --browser.serverAddress=127.0.0.1
      - --server.enableCORS=True
      - --browser.gatherUsageStats=False
      - --client.toolbarMode=minimal
      - --logger.hideWelcomeMessage=True
      - --server.showEmailPrompt=False
    volumes: *mpt-volumes
  api:
    image: ghcr.io/harry0703/moneyprinterturbo:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    command: ["python3", "main.py"]
    volumes: *mpt-volumes
