<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PCS AI Operator</title><style>:root{--bg:#f6f2ec;--panel:#fffdf9;--ink:#252830;--muted:#7f8189;--line:#e7e0d8;--lav:#e9e1f6;--sage:#e3ebdd;--blue:#dfeaf5;--peach:#f2ded3;--shadow:0 18px 60px rgba(37,40,48,.10)}[data-theme=dark]{--bg:#17191e;--panel:#22262d;--ink:#f5f1ea;--muted:#a5a9b1;--line:#343943;--lav:#40374f;--sage:#344139;--blue:#303c49;--peach:#4a3832;--shadow:0 18px 60px rgba(0,0,0,.28)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh}.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 16px}.logo{width:42px;height:42px;border-radius:14px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:900}.brand{font-weight:850;font-size:18px}.spacer{flex:1}.iconbtn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}.layout{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 67px)}.side{border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:67px;height:calc(100vh - 67px)}.nav{display:grid;gap:8px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:12px 14px;border-radius:16px;font-weight:700}.nav button.on{background:var(--lav);color:var(--ink)}main{padding:28px;min-width:0}.eyebrow{letter-spacing:.16em;text-transform:uppercase;color:#9b85b7;font-weight:800;font-size:12px}.title{font-size:42px;line-height:1.05;margin:8px 0 10px;letter-spacing:-.035em}.sub{color:var(--muted);margin:0 0 22px;max-width:760px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:18px;min-height:118px;box-shadow:var(--shadow)}.metric:nth-child(1){background:linear-gradient(145deg,var(--panel),var(--lav))}.metric:nth-child(2){background:linear-gradient(145deg,var(--panel),var(--blue))}.metric:nth-child(3){background:linear-gradient(145deg,var(--panel),var(--sage))}.metric:nth-child(4){background:linear-gradient(145deg,var(--panel),var(--peach))}.metric small{color:var(--muted);letter-spacing:.12em;text-transform:uppercase}.metric b{display:block;font-size:34px;margin-top:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow);margin-top:16px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:14px;padding:11px 14px;background:var(--ink);color:var(--bg);font-weight:800}.btn.soft{background:var(--lav);color:var(--ink)}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.list{display:grid;gap:12px}.item{border:1px solid var(--line);border-radius:20px;padding:16px;background:var(--panel);min-width:0}.item h3{margin:0 0 6px;font-size:18px}.item p{margin:10px 0;color:var(--muted);overflow-wrap:anywhere}.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{border-radius:999px;padding:5px 9px;background:var(--sage);font-size:12px}.pill.warn{background:#f4e8b4}.pill.off{background:#ead8d8}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:12px}.field textarea{min-height:110px;resize:vertical}.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.35);display:none;align-items:flex-end}.sheet.on{display:flex}.sheetbox{background:var(--panel);width:100%;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:18px}.sheethead{display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--panel);padding-bottom:12px;z-index:2}.sheethead h2{margin:0}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 80% 10%,var(--lav),transparent 35%),var(--bg)}.loginbox{width:min(480px,100%);background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:28px;box-shadow:var(--shadow)}.loginbox h1{font-size:38px;margin:12px 0}.error{color:#b24848;margin-top:10px}.bottom{display:none}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:14px;z-index:100;opacity:0;pointer-events:none;transition:.2s}.toast.on{opacity:1}.hidden{display:none!important}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:none}main{padding:20px}.metrics{grid-template-columns:repeat(2,1fr)}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:6px;box-shadow:var(--shadow)}.bottom button{border:0;background:transparent;color:var(--muted);border-radius:14px;padding:8px 4px;font-size:11px}.bottom button.on{background:var(--lav);color:var(--ink)}main{padding-bottom:100px}.title{font-size:34px}.grid2{grid-template-columns:1fr}}@media(max-width:480px){.top{padding:10px 12px}.brand{font-size:16px}.logo{width:38px;height:38px}.title{font-size:32px}.sub{font-size:14px}.metric{min-height:98px;padding:14px;border-radius:20px}.metric b{font-size:30px}.metric small{font-size:10px}.card{border-radius:20px;padding:14px}.item{padding:14px;border-radius:18px}main{padding:16px}.btn{min-height:44px}.sheetbox{padding:16px}.toolbar .btn{flex:1 1 140px}}</style></head><body><div id="root"></div><div class="toast" id="toast"></div><script>const API='https://nnlzgertmmxuteozoeel.supabase.co/functions/v1/pcs-api';let token=localStorage.pcsToken||'';let state={page:'inbox',kb:[],editing:null};const $=s=>document.querySelector(s);function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}async function call(path,opt={}){const h={'content-type':'application/json',...(opt.headers||{})};if(token)h.authorization='Bearer '+token;const r=await fetch(API+path,{...opt,headers:h});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'HTTP '+r.status);return d}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function nav(){return `<div class="top"><div class="logo">PCS</div><div class="brand">PCS AI Operator</div><div class="spacer"></div><button class="iconbtn" onclick="theme()">◐</button></div><div class="layout"><aside class="side"><div class="nav">${[['inbox','Входящие'],['approvals','Требуют ответа'],['kb','База знаний'],['connect','Подключения'],['status','Состояние']].map(x=>`<button class="${state.page===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</div></aside><main id="main"></main></div><div class="bottom">${[['inbox','Входящие'],['approvals','Ответы'],['kb','База'],['connect','Связи'],['status','Статус']].map(x=>`<button class="${state.page===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</div>`}async function login(){document.body.dataset.theme=localStorage.pcsTheme||'light';$('#root').innerHTML=`<div class="login"><div class="loginbox"><div class="eyebrow">Premium Concierge Service Thailand</div><h1>PCS AI Operator</h1><p class="sub">Защищённая рабочая панель Telegram Business</p><div class="field"><label>Пароль администратора</label><input id="pw" type="password"></div><button class="btn" style="width:100%;margin-top:14px" onclick="doLogin()">Войти</button><div class="error" id="le"></div></div></div>`}async function doLogin(){try{const d=await call('/login',{method:'POST',body:JSON.stringify({password:$('#pw').value})});token=d.token;localStorage.pcsToken=token;render()}catch(e){$('#le').textContent=e.message}}function theme(){const n=(document.body.dataset.theme||'light')==='dark'?'light':'dark';document.body.dataset.theme=n;localStorage.pcsTheme=n}async function render(){document.body.dataset.theme=localStorage.pcsTheme||'light';if(!token)return login();try{await call('/session')}catch{token='';localStorage.removeItem('pcsToken');return login()}$('#root').innerHTML=nav();go(state.page)}async function go(p){state.page=p;document.querySelectorAll('.nav button,.bottom button').forEach(b=>b.classList.remove('on'));renderPage()}async function renderPage(){const m=$('#main');if(!m)return;try{if(state.page==='inbox')return inbox(m);if(state.page==='approvals')return approvals(m);if(state.page==='kb')return kb(m);if(state.page==='connect')return connect(m);return status(m)}catch(e){m.innerHTML='<div class="card">'+esc(e.message)+'</div>'}}async function inbox(m){const [s,items]=await Promise.all([call('/status'),call('/inbox')]);m.innerHTML=`<div class="eyebrow">Telegram Business</div><h1 class="title">Входящие</h1><p class="sub">Реальные диалоги, AI-черновики и следующий шаг.</p><div class="metrics"><div class="metric"><small>Новые</small><b>${s.new_count||0}</b></div><div class="metric"><small>Требуют ответа</small><b>${s.approval_count||0}</b></div><div class="metric"><small>Горячие</small><b>${s.hot_count||0}</b></div><div class="metric"><small>Сегодня</small><b>${s.today_count||0}</b></div></div><div class="card"><div class="list">${items.length?items.map(x=>`<div class="item"><h3>${esc(x.name||x.username||'Клиент')}</h3><div class="pills"><span class="pill">${esc(x.intent||'новый')}</span><span class="pill">${esc(x.status||'NEW')}</span></div><p>${esc(x.last_message||'Нет сообщений')}</p></div>`).join(''):'<p class="sub">Пока нет диалогов.</p>'}</div></div>`}async function approvals(m){const a=await call('/approvals');m.innerHTML=`<div class="eyebrow">Контроль AI</div><h1 class="title">Требуют ответа</h1><p class="sub">AI ничего не отправляет без подтверждения, если сработала политика согласования.</p><div class="list">${a.length?a.map(x=>`<div class="item"><h3>${esc(x.contact_name||'Клиент')}</h3><p><b>Клиент:</b> ${esc(x.source_text||'')}</p><p><b>AI:</b> ${esc(x.answer||'')}</p><div class="pills"><span class="pill warn">${esc(x.policy_reason||'Согласование')}</span></div><div class="toolbar" style="margin-top:12px"><button class="btn" onclick="approve('${x.id}')">Отправить</button><button class="btn ghost" onclick="rejectA('${x.id}')">Отклонить</button></div></div>`).join(''):'<div class="card"><p class="sub">Очередь пуста.</p></div>'}</div>`}async function approve(id){try{await call('/approvals/'+id+'/send',{method:'POST'});toast('Отправлено');renderPage()}catch(e){toast(e.message)}}async function rejectA(id){try{await call('/approvals/'+id+'/reject',{method:'POST'});toast('Отклонено');renderPage()}catch(e){toast(e.message)}}async function kb(m){state.kb=await call('/knowledge');m.innerHTML=`<div class="eyebrow">Актуальная информация PCS</div><h1 class="title">База знаний</h1><p class="sub">AI использует только активные записи, разрешённые для клиента.</p><div class="toolbar"><button class="btn" onclick="openKb()">+ Добавить запись</button></div><div class="list" style="margin-top:16px">${state.kb.map(x=>`<div class="item"><h3>${esc(x.title)}</h3><div class="pills"><span class="pill ${x.visibility==='approval_only'?'warn':x.visibility==='internal_only'?'off':''}">${x.visibility==='customer_safe'?'Можно клиенту':x.visibility==='approval_only'?'С согласованием':'Внутреннее'}</span><span class="pill">rev ${x.revision||1}</span></div><p>${esc(x.description)}</p><button class="btn soft" onclick="openKb('${x.id}')">Редактировать</button></div>`).join('')}</div><div id="sheet" class="sheet"><div class="sheetbox"><div class="sheethead"><h2 id="shTitle">Запись</h2><div class="spacer"></div><button class="iconbtn" onclick="closeKb()">×</button></div><div class="grid2"><div class="field"><label>Название</label><input id="kTitle"></div><div class="field"><label>Категория</label><input id="kCat"></div></div><div class="field" style="margin-top:12px"><label>Описание</label><textarea id="kDesc"></textarea></div><div class="grid2" style="margin-top:12px"><div class="field"><label>Доступ</label><select id="kVis"><option value="customer_safe">Можно клиенту</option><option value="approval_only">С согласованием</option><option value="internal_only">Внутреннее</option></select></div><div class="field"><label>Автоответ</label><select id="kAuto"><option value="true">Разрешён</option><option value="false">Запрещён</option></select></div></div><div class="grid2" style="margin-top:12px"><div class="field"><label>Цена</label><input id="kPrice" inputmode="decimal"></div><div class="field"><label>Валюта</label><input id="kCur" placeholder="THB"></div></div><div class="field" style="margin-top:12px"><label>Источник</label><input id="kSrc"></div><div class="field" style="margin-top:12px"><label>Инструкция AI</label><textarea id="kGuide"></textarea></div><button class="btn" style="width:100%;margin-top:14px" onclick="saveKb()">Сохранить</button></div></div>`}function openKb(id){state.editing=id||null;const x=state.kb.find(v=>v.id===id)||{};$('#shTitle').textContent=id?'Редактировать запись':'Новая запись';$('#kTitle').value=x.title||'';$('#kCat').value=x.category||'';$('#kDesc').value=x.description||'';$('#kVis').value=x.visibility||'customer_safe';$('#kAuto').value=String(!!x.auto_answer_allowed);$('#kPrice').value=x.price??'';$('#kCur').value=x.currency||'';$('#kSrc').value=x.source||'';$('#kGuide').value=x.answer_guidance||'';$('#sheet').classList.add('on')}function closeKb(){$('#sheet').classList.remove('on')}async function saveKb(){const b={title:$('#kTitle').value.trim(),category:$('#kCat').value.trim(),description:$('#kDesc').value.trim(),visibility:$('#kVis').value,auto_answer_allowed:$('#kAuto').value==='true',price:$('#kPrice').value?Number($('#kPrice').value):null,currency:$('#kCur').value.trim()||null,source:$('#kSrc').value.trim()||null,answer_guidance:$('#kGuide').value.trim()||null};if(!b.title||!b.category||!b.description)return toast('Заполни название, категорию и описание');try{await call(state.editing?'/knowledge/'+state.editing:'/knowledge',{method:state.editing?'PATCH':'POST',body:JSON.stringify(b)});toast('Сохранено');closeKb();kb($('#main'))}catch(e){toast(e.message)}}async function connect(m){const s=await call('/settings');m.innerHTML=`<div class="eyebrow">Интеграции</div><h1 class="title">Подключения</h1><p class="sub">Секреты хранятся server-side и не возвращаются в браузер.</p><div class="grid2"><div class="card"><h2>Telegram Business</h2><p class="sub">@pcs_manager_bot</p><div class="field"><label>Bot Token</label><input id="tgToken" type="password" placeholder="${s.configured?.telegram_bot_token?'Настроено':'Вставьте токен'}"></div><div class="toolbar" style="margin-top:12px"><button class="btn soft" onclick="saveSettings()">Сохранить</button><button class="btn ghost" onclick="testTg()">Проверить</button><button class="btn" onclick="installWh()">Установить webhook</button></div></div><div class="card"><h2>TokenRouter</h2><div class="field"><label>API Key</label><input id="trKey" type="password" placeholder="${s.configured?.tokenrouter_key?'Настроено':'Вставьте ключ'}"></div><div class="field" style="margin-top:10px"><label>Модель</label><input id="trModel" value="${esc(s.tokenrouter_model||'moonshotai/kimi-k3')}"></div><div class="toolbar" style="margin-top:12px"><button class="btn soft" onclick="saveSettings()">Сохранить</button><button class="btn ghost" onclick="testTR()">Проверить</button></div></div></div>`}async function saveSettings(){try{await call('/settings',{method:'PUT',body:JSON.stringify({telegram_bot_token:$('#tgToken')?.value||'',tokenrouter_key:$('#trKey')?.value||'',tokenrouter_model:$('#trModel')?.value||'moonshotai/kimi-k3'})});toast('Настройки сохранены')}catch(e){toast(e.message)}}async function testTg(){try{const x=await call('/test/telegram',{method:'POST'});toast('Telegram: @'+(x.username||'OK'))}catch(e){toast(e.message)}}async function installWh(){try{await call('/telegram/install-webhook',{method:'POST'});toast('Webhook установлен')}catch(e){toast(e.message)}}async function testTR(){try{await call('/test/tokenrouter',{method:'POST'});toast('TokenRouter работает')}catch(e){toast(e.message)}}async function status(m){const s=await call('/status');m.innerHTML=`<div class="eyebrow">Диагностика</div><h1 class="title">Состояние системы</h1><div class="card"><div class="list"><div class="item"><h3>Backend / База данных</h3><div class="pill">${s.database?'Работает':'Ошибка'}</div></div><div class="item"><h3>Telegram Bot Token</h3><div class="pill">${s.configured?.telegram_bot_token?'Настроен':'Не настроен'}</div></div><div class="item"><h3>Telegram Business</h3><div class="pill ${s.business_can_reply?'':'warn'}">${s.business_can_reply?'Может отвечать':'Нет права ответа / ещё не получено'}</div></div><div class="item"><h3>TokenRouter / Kimi K3</h3><div class="pill">${s.configured?.tokenrouter_key?'Настроен':'Не настроен'}</div></div><div class="item"><h3>Auto-send</h3><div class="pill ${s.auto_send?'':'warn'}">${s.auto_send?'Включён':'Выключен'}</div></div></div></div>`}render();</script></body></html>
