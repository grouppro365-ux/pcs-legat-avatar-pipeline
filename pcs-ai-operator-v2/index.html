<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f2ec"><title>PCS AI Operator</title><style>
:root{--bg:#f6f2ec;--panel:#fffdf9;--panel2:#f1ece5;--ink:#252830;--muted:#7f8189;--line:#e5ddd4;--lav:#e9e1f6;--sage:#e3ebdd;--blue:#dfeaf5;--peach:#f2ded3;--yellow:#f5eabc;--danger:#f2d8d8;--ok:#4f7f61;--bad:#b55b5b;--shadow:0 16px 46px rgba(37,40,48,.09);--r:24px;--gap:16px;--content:1320px}[data-theme=dark]{--bg:#17191e;--panel:#22262d;--panel2:#1d2026;--ink:#f5f1ea;--muted:#a5a9b1;--line:#343943;--lav:#40374f;--sage:#344139;--blue:#303c49;--peach:#4a3832;--yellow:#514a2d;--danger:#4a3030;--ok:#91c29e;--bad:#e29393;--shadow:0 18px 52px rgba(0,0,0,.28)}
*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit}button{cursor:pointer}button,input,textarea,select{min-width:0}.app{min-height:100dvh}.top{height:68px;position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-left))}.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(145deg,var(--ink),#3c414c);color:#fff;display:grid;place-items:center;font-weight:900;letter-spacing:-.04em}.brand{font-weight:850;font-size:18px;white-space:nowrap}.top-page{display:none;color:var(--muted);font-size:13px}.spacer{flex:1}.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}.layout{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100dvh - 68px)}.side{border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:68px;height:calc(100dvh - 68px);background:color-mix(in srgb,var(--panel) 45%,transparent)}.nav{display:grid;gap:7px}.nav button{min-height:46px;border:0;background:transparent;color:var(--muted);text-align:left;padding:12px 14px;border-radius:15px;font-weight:750}.nav button.on{background:var(--lav);color:var(--ink)}main{width:min(100%,var(--content));padding:30px clamp(20px,3vw,42px) 50px;margin:0 auto;min-width:0}.page-head{margin-bottom:22px}.eyebrow{letter-spacing:.15em;text-transform:uppercase;color:#9b85b7;font-weight:850;font-size:12px}.title{font-size:clamp(34px,4vw,48px);line-height:1.02;margin:8px 0 10px;letter-spacing:-.045em}.sub{color:var(--muted);margin:0;max-width:760px;overflow-wrap:anywhere}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-height:122px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between}.metric:nth-child(1){background:linear-gradient(145deg,var(--panel),var(--lav))}.metric:nth-child(2){background:linear-gradient(145deg,var(--panel),var(--blue))}.metric:nth-child(3){background:linear-gradient(145deg,var(--panel),var(--sage))}.metric:nth-child(4){background:linear-gradient(145deg,var(--panel),var(--peach))}.metric small{color:var(--muted);letter-spacing:.11em;text-transform:uppercase;font-size:11px;font-weight:700}.metric b{display:block;font-size:36px;line-height:1;margin-top:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-top:16px}.card h2{margin:0 0 8px;font-size:20px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn{min-height:44px;border:0;border-radius:14px;padding:10px 14px;background:var(--ink);color:var(--bg);font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn.soft{background:var(--lav);color:var(--ink)}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.list{display:grid;gap:12px}.item{border:1px solid var(--line);border-radius:20px;padding:16px;background:var(--panel);min-width:0}.item h3{margin:0 0 7px;font-size:18px;line-height:1.25}.item p{margin:10px 0;color:var(--muted);overflow-wrap:anywhere}.pills{display:flex;gap:7px;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;gap:6px;max-width:100%;border-radius:999px;padding:5px 10px;background:var(--sage);font-size:12px;line-height:1.25}.pill.warn{background:var(--yellow)}.pill.off{background:var(--danger)}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:750}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:12px 13px;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:#a991c6;box-shadow:0 0 0 3px color-mix(in srgb,var(--lav) 70%,transparent)}.field textarea{min-height:110px;resize:vertical}.sheet{position:fixed;inset:0;z-index:70;background:rgba(18,20,24,.42);display:none;align-items:flex-end;padding:0}.sheet.on{display:flex}.sheetbox{background:var(--panel);width:min(760px,100%);max-height:92dvh;overflow:auto;border-radius:28px 28px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));margin:0 auto;box-shadow:0 -18px 60px rgba(0,0,0,.18)}.sheethead{display:flex;align-items:center;gap:10px;position:sticky;top:-18px;background:var(--panel);padding:18px 0 12px;z-index:2}.sheethead h2{margin:0}.login{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 80% 10%,var(--lav),transparent 38%),var(--bg)}.loginbox{width:min(470px,100%);background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:28px;box-shadow:var(--shadow)}.loginbox h1{font-size:clamp(34px,8vw,42px);line-height:1.04;margin:12px 0}.error{color:var(--bad);margin-top:10px}.bottom{display:none}.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,10px);max-width:calc(100vw - 32px);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:14px;z-index:100;opacity:0;pointer-events:none;transition:.2s}.toast.on{opacity:1;transform:translate(-50%,0)}.empty{padding:28px 16px;text-align:center;color:var(--muted)}.status-list{display:grid;gap:10px}.status-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:14px 16px;min-width:0}.status-name{font-weight:800;min-width:0}.status-meta{color:var(--muted);font-size:12px;margin-top:2px}.status-badge{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 10px;background:var(--sage);font-size:12px;font-weight:750;white-space:nowrap}.status-badge.warn{background:var(--yellow)}.status-badge.bad{background:var(--danger);color:var(--bad)}.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:0 0 auto}.warn .dot{background:#a88b38}.bad .dot{background:var(--bad)}.hidden{display:none!important}

@media(max-width:768px){:root{--r:20px;--gap:12px}.top{height:60px;padding:8px 14px}.logo{width:40px;height:40px;border-radius:13px}.brand{font-size:16px}.top-page{display:block}.layout{display:block;min-height:calc(100dvh - 60px)}.side{display:none}main{width:100%;padding:18px 16px calc(96px + env(safe-area-inset-bottom));margin:0}.page-head{margin-bottom:16px}.eyebrow{font-size:10px;letter-spacing:.14em}.title{font-size:34px;line-height:1.02;margin:6px 0 8px}.sub{font-size:14px;line-height:1.42}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{min-height:100px;padding:14px;border-radius:19px;box-shadow:0 10px 28px rgba(37,40,48,.07)}.metric small{font-size:9.5px;letter-spacing:.09em}.metric b{font-size:30px;margin-top:10px}.card{border-radius:20px;padding:14px;margin-top:12px;box-shadow:0 10px 30px rgba(37,40,48,.07)}.item{border-radius:18px;padding:14px}.item h3{font-size:17px}.grid2{grid-template-columns:1fr;gap:12px}.bottom{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:50;background:color-mix(in srgb,var(--panel) 96%,transparent);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:19px;padding:5px;box-shadow:0 15px 44px rgba(37,40,48,.14)}.bottom button{min-width:0;min-height:50px;border:0;background:transparent;color:var(--muted);border-radius:14px;padding:6px 3px;font-size:10px;font-weight:750;line-height:1.15;overflow:hidden;text-overflow:ellipsis}.bottom button.on{background:var(--lav);color:var(--ink)}.toolbar{gap:8px}.toolbar .btn{flex:1 1 130px}.sheet{align-items:stretch;padding-top:max(28px,env(safe-area-inset-top))}.sheetbox{width:100%;max-height:100%;height:100%;border-radius:24px 24px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom))}.sheethead{top:-16px;padding:16px 0 12px}.status-row{padding:13px 14px;border-radius:16px}.status-meta{display:none}}
@media(max-width:430px){main{padding-left:14px;padding-right:14px}.brand{display:none}.top-page{font-size:12px}.iconbtn{width:40px;height:40px}.title{font-size:31px}.metric{min-height:94px;padding:13px}.metric b{font-size:28px}.metric small{font-size:9px}.btn{padding:10px 12px}.card h2{font-size:18px}.item p{font-size:14px}.status-row{grid-template-columns:minmax(0,1fr) auto;gap:8px}.status-name{font-size:14px}.status-badge{font-size:10.5px;padding:6px 8px}}

</style></head><body><div id="root"></div><div class="toast" id="toast"></div><script>
const API='https://nnlzgertmmxuteozoeel.supabase.co/functions/v1/pcs-api';let token=localStorage.pcsToken||'';let state={page:'inbox',kb:[],editing:null};const $=s=>document.querySelector(s);const pages={inbox:'Входящие',approvals:'Ответы',kb:'База знаний',connect:'Подключения',status:'Состояние'};
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}async function call(path,opt={}){const h={'content-type':'application/json',...(opt.headers||{})};if(token)h.authorization='Bearer '+token;const r=await fetch(API+path,{...opt,headers:h});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'HTTP '+r.status);return d}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nav(){const all=[['inbox','Входящие'],['approvals','Требуют ответа'],['kb','База знаний'],['connect','Подключения'],['status','Состояние']];const bot=[['inbox','Входящие'],['approvals','Ответы'],['kb','База'],['connect','Связи'],['status','Статус']];return `<div class="top"><div class="logo">PCS</div><div class="brand">PCS AI Operator</div><div class="top-page">${pages[state.page]}</div><div class="spacer"></div><button class="iconbtn" aria-label="Сменить тему" onclick="theme()">◐</button></div><div class="layout"><aside class="side"><div class="nav">${all.map(x=>`<button data-page="${x[0]}" class="${state.page===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</div></aside><main id="main"></main></div><div class="bottom">${bot.map(x=>`<button data-page="${x[0]}" class="${state.page===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</div>`}
async function login(){document.documentElement.dataset.theme=localStorage.pcsTheme||'light';$('#root').innerHTML=`<div class="login"><div class="loginbox"><div class="eyebrow">Premium Concierge Service Thailand</div><h1>PCS AI Operator</h1><p class="sub">Защищённая рабочая панель Telegram Business</p><div class="field"><label>Пароль администратора</label><input id="pw" type="password" autocomplete="current-password"></div><button class="btn" style="width:100%;margin-top:14px" onclick="doLogin()">Войти</button><div class="error" id="le"></div></div></div>`}async function doLogin(){try{const d=await call('/login',{method:'POST',body:JSON.stringify({password:$('#pw').value})});token=d.token;localStorage.pcsToken=token;render()}catch(e){$('#le').textContent=e.message}}function theme(){const n=(document.documentElement.dataset.theme||'light')==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.pcsTheme=n}async function render(){document.documentElement.dataset.theme=localStorage.pcsTheme||'light';if(!token)return login();try{await call('/session')}catch{token='';localStorage.removeItem('pcsToken');return login()}$('#root').innerHTML=nav();renderPage()}async function go(p){state.page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('on',b.dataset.page===p));const tp=$('.top-page');if(tp)tp.textContent=pages[p];await renderPage()}
function head(ey,title,sub=''){return `<div class="page-head"><div class="eyebrow">${ey}</div><h1 class="title">${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}</div>`}async function renderPage(){const m=$('#main');if(!m)return;try{if(state.page==='inbox')return inbox(m);if(state.page==='approvals')return approvals(m);if(state.page==='kb')return kb(m);if(state.page==='connect')return connect(m);return status(m)}catch(e){m.innerHTML='<div class="card">'+esc(e.message)+'</div>'}}
async function inbox(m){const [s,items]=await Promise.all([call('/status'),call('/inbox')]);m.innerHTML=head('Telegram Business','Входящие','Реальные диалоги, AI-черновики и следующий шаг.')+`<div class="metrics"><div class="metric"><small>Новые</small><b>${s.new_count||0}</b></div><div class="metric"><small>Требуют ответа</small><b>${s.approval_count||0}</b></div><div class="metric"><small>Горячие</small><b>${s.hot_count||0}</b></div><div class="metric"><small>Сегодня</small><b>${s.today_count||0}</b></div></div><div class="card"><div class="list">${items.length?items.map(x=>`<div class="item"><h3>${esc(x.name||x.username||'Клиент')}</h3><div class="pills"><span class="pill">${esc(x.intent||'новый')}</span><span class="pill">${esc(x.status||'NEW')}</span></div><p>${esc(x.last_message||'Нет сообщений')}</p></div>`).join(''):'<div class="empty">Пока нет диалогов.</div>'}</div></div>`}
async function approvals(m){const a=await call('/approvals');m.innerHTML=head('Контроль AI','Требуют ответа','AI ничего не отправляет без подтверждения, если сработала политика согласования.')+`<div class="list">${a.length?a.map(x=>`<div class="item"><h3>${esc(x.contact_name||'Клиент')}</h3><p><b>Клиент:</b> ${esc(x.source_text||'')}</p><p><b>AI:</b> ${esc(x.answer||'')}</p><div class="pills"><span class="pill warn">${esc(x.policy_reason||'Согласование')}</span></div><div class="toolbar" style="margin-top:12px"><button class="btn" onclick="approve('${x.id}')">Отправить</button><button class="btn ghost" onclick="rejectA('${x.id}')">Отклонить</button></div></div>`).join(''):'<div class="card"><div class="empty">Очередь пуста.</div></div>'}</div>`}async function approve(id){try{await call('/approvals/'+id+'/send',{method:'POST'});toast('Отправлено');renderPage()}catch(e){toast(e.message)}}async function rejectA(id){try{await call('/approvals/'+id+'/reject',{method:'POST'});toast('Отклонено');renderPage()}catch(e){toast(e.message)}}
async function kb(m){state.kb=await call('/knowledge');m.innerHTML=head('Актуальная информация PCS','База знаний','AI использует только активные записи, разрешённые для клиента.')+`<div class="toolbar"><button class="btn" onclick="openKb()">+ Добавить запись</button></div><div class="list" style="margin-top:14px">${state.kb.map(x=>`<div class="item"><h3>${esc(x.title)}</h3><div class="pills"><span class="pill ${x.visibility==='approval_only'?'warn':x.visibility==='internal_only'?'off':''}">${x.visibility==='customer_safe'?'Можно клиенту':x.visibility==='approval_only'?'С согласованием':'Внутреннее'}</span><span class="pill">rev ${x.revision||1}</span></div><p>${esc(x.description)}</p><button class="btn soft" onclick="openKb('${x.id}')">Редактировать</button></div>`).join('')}</div><div id="sheet" class="sheet"><div class="sheetbox"><div class="sheethead"><h2 id="shTitle">Запись</h2><div class="spacer"></div><button class="iconbtn" onclick="closeKb()">×</button></div><div class="grid2"><div class="field"><label>Название</label><input id="kTitle"></div><div class="field"><label>Категория</label><input id="kCat"></div></div><div class="field" style="margin-top:12px"><label>Описание</label><textarea id="kDesc"></textarea></div><div class="grid2" style="margin-top:12px"><div class="field"><label>Доступ</label><select id="kVis"><option value="customer_safe">Можно клиенту</option><option value="approval_only">С согласованием</option><option value="internal_only">Внутреннее</option></select></div><div class="field"><label>Автоответ</label><select id="kAuto"><option value="true">Разрешён</option><option value="false">Запрещён</option></select></div></div><div class="grid2" style="margin-top:12px"><div class="field"><label>Цена</label><input id="kPrice" inputmode="decimal"></div><div class="field"><label>Валюта</label><input id="kCur" placeholder="THB"></div></div><div class="field" style="margin-top:12px"><label>Источник</label><input id="kSrc"></div><div class="field" style="margin-top:12px"><label>Инструкция AI</label><textarea id="kGuide"></textarea></div><button class="btn" style="width:100%;margin-top:14px" onclick="saveKb()">Сохранить</button></div></div>`}function openKb(id){state.editing=id||null;const x=state.kb.find(v=>v.id===id)||{};$('#shTitle').textContent=id?'Редактировать запись':'Новая запись';$('#kTitle').value=x.title||'';$('#kCat').value=x.category||'';$('#kDesc').value=x.description||'';$('#kVis').value=x.visibility||'customer_safe';$('#kAuto').value=String(!!x.auto_answer_allowed);$('#kPrice').value=x.price??'';$('#kCur').value=x.currency||'';$('#kSrc').value=x.source||'';$('#kGuide').value=x.answer_guidance||'';$('#sheet').classList.add('on');document.body.style.overflow='hidden'}function closeKb(){const s=$('#sheet');if(s)s.classList.remove('on');document.body.style.overflow=''}async function saveKb(){const b={title:$('#kTitle').value.trim(),category:$('#kCat').value.trim(),description:$('#kDesc').value.trim(),visibility:$('#kVis').value,auto_answer_allowed:$('#kAuto').value==='true',price:$('#kPrice').value?Number($('#kPrice').value):null,currency:$('#kCur').value.trim()||null,source:$('#kSrc').value.trim()||null,answer_guidance:$('#kGuide').value.trim()||null};if(!b.title||!b.category||!b.description)return toast('Заполни название, категорию и описание');try{await call(state.editing?'/knowledge/'+state.editing:'/knowledge',{method:state.editing?'PATCH':'POST',body:JSON.stringify(b)});toast('Сохранено');closeKb();kb($('#main'))}catch(e){toast(e.message)}}
async function connect(m){const s=await call('/settings');m.innerHTML=head('Интеграции','Подключения','Секреты хранятся server-side и не возвращаются в браузер.')+`<div class="grid2"><div class="card"><h2>Telegram Business</h2><p class="sub">@pcs_manager_bot</p><div class="field"><label>Bot Token</label><input id="tgToken" type="password" placeholder="${s.configured?.telegram_bot_token?'Настроено':'Вставьте токен'}"></div><div class="toolbar" style="margin-top:12px"><button class="btn soft" onclick="saveSettings()">Сохранить</button><button class="btn ghost" onclick="testTg()">Проверить</button><button class="btn" onclick="installWh()">Webhook</button></div></div><div class="card"><h2>TokenRouter · Kimi K3</h2><div class="field"><label>API Key</label><input id="trKey" type="password" placeholder="${s.configured?.tokenrouter_key?'Настроено':'Вставьте ключ'}"></div><div class="field" style="margin-top:10px"><label>Модель</label><input id="trModel" value="${esc(s.tokenrouter_model||'moonshotai/kimi-k3')}"></div><div class="toolbar" style="margin-top:12px"><button class="btn soft" onclick="saveSettings()">Сохранить</button><button class="btn ghost" onclick="testTR()">Проверить</button></div></div></div>`}async function saveSettings(){try{await call('/settings',{method:'PUT',body:JSON.stringify({telegram_bot_token:$('#tgToken')?.value||'',tokenrouter_key:$('#trKey')?.value||'',tokenrouter_model:$('#trModel')?.value||'moonshotai/kimi-k3'})});toast('Настройки сохранены')}catch(e){toast(e.message)}}async function testTg(){try{const x=await call('/test/telegram',{method:'POST'});toast('Telegram: @'+(x.username||'OK'))}catch(e){toast(e.message)}}async function installWh(){try{await call('/telegram/install-webhook',{method:'POST'});toast('Webhook установлен')}catch(e){toast(e.message)}}async function testTR(){try{await call('/test/tokenrouter',{method:'POST'});toast('TokenRouter работает')}catch(e){toast(e.message)}}
function st(name,meta,text,kind='ok'){return `<div class="status-row"><div><div class="status-name">${name}</div>${meta?`<div class="status-meta">${meta}</div>`:''}</div><div class="status-badge ${kind==='warn'?'warn':kind==='bad'?'bad':''}"><span class="dot"></span>${text}</div></div>`}async function status(m){const s=await call('/status');m.innerHTML=head('Диагностика','Состояние системы','Только рабочие компоненты и реальные подключения.')+`<div class="card"><div class="status-list">${st('Backend','API PCS AI Operator',s.backend===false?'Ошибка':'Работает',s.backend===false?'bad':'ok')}${st('База данных','PostgreSQL / Supabase',s.database?'Работает':'Ошибка',s.database?'ok':'bad')}${st('Telegram Bot','@pcs_manager_bot',s.configured?.telegram_bot_token?'Настроен':'Не настроен',s.configured?.telegram_bot_token?'ok':'bad')}${st('Telegram Business','Подключение личных чатов',s.business_can_reply?'Может отвечать':'Проверить права',s.business_can_reply?'ok':'warn')}${st('AI · Kimi K3','TokenRouter',s.configured?.tokenrouter_key?'Настроен':'Не настроен',s.configured?.tokenrouter_key?'ok':'bad')}${st('Автоответы','Безопасный режим',s.auto_send?'Включены':'Выключены',s.auto_send?'ok':'warn')}</div></div>`}
