<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agency Browser Harness</title>
<style>
:root{color-scheme:dark;--bg:#0c111b;--panel:#131b29;--panel2:#1a2434;--line:#2b3950;--text:#f5f7fb;--muted:#9eabc0;--blue:#6ea8fe;--green:#54d39a;--red:#ff6b78;--amber:#f2c66d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-width:760px;min-height:570px}
button,textarea{font:inherit}button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:9px 12px;cursor:pointer}button:hover{border-color:#4d6488}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#245fbf;border-color:#3676db}.danger{color:#ffd7dc;border-color:#69404a}.ghost{background:transparent}.app{padding:16px;display:grid;gap:14px}.top{display:flex;align-items:center;gap:10px}.top h1{font-size:18px;margin:0;margin-right:auto}.version{color:var(--muted);font-size:12px}.bindings{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px}.binding{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-width:0}.binding strong{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:3px}.binding span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.taskbox{display:grid;grid-template-columns:1fr auto;gap:8px}.taskbox textarea{resize:vertical;min-height:68px;max-height:150px;padding:11px 12px;background:#0e1521;color:var(--text);border:1px solid var(--line);border-radius:10px;outline:none}.taskbox textarea:focus{border-color:var(--blue)}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;min-height:245px}.column{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}.column.dragover{outline:2px solid var(--blue);outline-offset:2px}.column h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}.cards{display:grid;gap:8px}.card{background:var(--panel2);border:1px solid #31415a;border-radius:10px;padding:10px;cursor:grab}.card:active{cursor:grabbing}.card .txt{white-space:pre-wrap;overflow-wrap:anywhere}.card .meta{margin-top:7px;font-size:11px;color:var(--muted)}.card.blocked{border-color:#74404a}.card.done{border-color:#315f4c}.card.confirmation{border-color:#78643b}.statusline{display:flex;gap:12px;align-items:center;min-height:24px}.statusline strong{font-size:13px}.ok{color:var(--green)}.err{color:var(--red)}.warn{color:var(--amber)}.logs{height:155px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#080d15;padding:10px;font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}.log{padding:3px 0;border-bottom:1px solid #182132}.log:last-child{border-bottom:0}.log.success{color:#7ce4b2}.log.error{color:#ff8993}.log.warn{color:#f1cf87}.confirm{display:none;border:1px solid #765e2c;background:#251f14;border-radius:10px;padding:10px;gap:8px;align-items:center}.confirm.show{display:flex}.confirm span{flex:1;color:#f6d897}@media(max-width:820px){body{min-width:720px}.bindings{grid-template-columns:1fr 1fr}.bindings button{width:100%}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>Agency Browser Harness</h1>
    <span class="version">Browser Harness → Opera · v0.1.0</span>
    <button id="openFull" class="ghost">Открыть доску</button>
  </div>

  <div class="bindings">
    <div class="binding"><strong>ChatGPT</strong><span id="chatState">Не привязан</span></div>
    <div class="binding"><strong>Рабочая вкладка</strong><span id="targetState">Не привязана</span></div>
    <button id="bindChat">Привязать ChatGPT</button>
    <button id="bindTarget">Привязать сайт</button>
  </div>

  <div class="taskbox">
    <textarea id="taskText" placeholder="Напиши задачу обычным языком. Например: проверь все статьи с плохим SEO, исправь их и проверь результат."></textarea>
    <button id="addTask" class="primary">Добавить задачу</button>
  </div>

  <div class="confirm" id="confirmBox">
    <span id="confirmText">Harness просит одноразовое подтверждение действия.</span>
    <button id="confirmAction" class="primary">Подтвердить один раз</button>
    <button id="cancelRun" class="danger">Остановить</button>
  </div>

  <div class="board">
    <section class="column" data-column="queue"><h2>Очередь</h2><div class="cards" id="queueCards"></div></section>
    <section class="column" data-column="running"><h2>В работе</h2><div class="cards" id="runningCards"></div></section>
    <section class="column" data-column="done"><h2>Готово</h2><div class="cards" id="doneCards"></div></section>
  </div>

  <div class="statusline"><strong id="runStatus">Ожидание</strong><span id="runProgress" class="version"></span><button id="cancelBtn" class="ghost">Остановить текущую</button></div>
  <div class="logs" id="logs" aria-live="polite"></div>
</div>
<script src="workbench.js"></script>
</body>
</html>
