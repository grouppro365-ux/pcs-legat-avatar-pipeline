<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agency Browser Harness</title>
<style>
:root{color-scheme:dark;--bg:#0b111b;--panel:#121a27;--panel2:#182334;--line:#2a3950;--text:#f5f7fb;--muted:#9aa9bf;--blue:#5f91e8;--blue2:#326fd1;--green:#55d49a;--red:#ff7482;--amber:#edc46d}
*{box-sizing:border-box;min-width:0}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}body{min-width:680px}button,textarea{font:inherit}button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:10px 14px;cursor:pointer;transition:border-color .15s ease,background .15s ease}button:hover{border-color:#55729a}button:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--blue2);border-color:#427fe0}.danger{color:#ffdce0;border-color:#70424d}.ghost{background:transparent}.app{width:min(1240px,100%);margin:0 auto;padding:18px;display:grid;gap:14px}.top{display:flex;align-items:center;gap:12px}.top h1{font-size:20px;line-height:1.2;margin:0;margin-right:auto;letter-spacing:-.02em}.version{color:var(--muted);font-size:12px}.bindings{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.bind-group{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.binding{padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.binding strong{display:block;font-size:12px;color:var(--muted);font-weight:650;margin-bottom:4px}.binding span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}.taskbox{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}.taskbox textarea{resize:vertical;min-height:78px;max-height:190px;padding:13px 14px;background:#0d1521;color:var(--text);border:1px solid var(--line);border-radius:14px;outline:none}.taskbox textarea::placeholder{color:#6f7e93}.taskbox .primary{min-width:170px}.confirm{display:none;border:1px solid #765f31;background:#241f15;border-radius:14px;padding:12px;gap:10px;align-items:center}.confirm.show{display:flex}.confirm span{flex:1;color:#f5d895;overflow-wrap:anywhere}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}.column{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;min-height:290px;overflow:hidden}.column.dragover{outline:2px solid var(--blue);outline-offset:2px}.column h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:#abc0de;margin:0 0 10px}.cards{display:grid;gap:9px;max-height:360px;overflow:auto;padding-right:2px}.card{width:100%;max-width:100%;overflow:hidden;background:var(--panel2);border:1px solid #31435c;border-radius:13px;padding:11px;cursor:grab}.card .txt{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;font-size:14px;line-height:1.45}.card .meta{margin-top:8px;font-size:11px;line-height:1.45;color:var(--muted);overflow-wrap:anywhere;word-break:break-word;white-space:normal}.card.blocked{border-color:#7a414c}.card.done{border-color:#32634f}.card.confirmation{border-color:#79653e}.statusline{display:flex;gap:12px;align-items:center;min-height:40px;padding:0 2px}.statusline strong{font-size:13px}.ok{color:var(--green)}.err{color:var(--red)}.warn{color:var(--amber)}.logs{height:220px;overflow:auto;border:1px solid var(--line);border-radius:14px;background:#070c13;padding:10px 12px;font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace}.log{padding:5px 0;border-bottom:1px solid #182132;overflow-wrap:anywhere;word-break:break-word}.log:last-child{border-bottom:0}.log.success{color:#7ce4b2}.log.error{color:#ff8993}.log.warn{color:#f1cf87}.log span{color:#b7c2d2}@media(max-width:940px){body{min-width:0}.app{padding:12px}.top{flex-wrap:wrap}.bindings{grid-template-columns:1fr}.board{grid-template-columns:1fr}.column{min-height:150px}.cards{max-height:300px}.taskbox{grid-template-columns:1fr}.taskbox .primary{width:100%}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
<header class="top"><h1>Agency Browser Harness</h1><span class="version">Browser Harness → Opera · v0.1.4 TURNFIX</span><button id="openFull" class="ghost">Открыть доску</button></header>
<section class="bindings"><div class="bind-group"><div class="binding"><strong>ChatGPT</strong><span id="chatState">Не привязан</span></div><button id="bindChat">Привязать ChatGPT</button></div><div class="bind-group"><div class="binding"><strong>Рабочая вкладка</strong><span id="targetState">Не привязана</span></div><button id="bindTarget">Привязать сайт</button></div></section>
<section class="taskbox"><textarea id="taskText" placeholder="Напиши задачу обычным языком. Например: проверь статью, исправь SEO и проверь сохранённый результат."></textarea><button id="addTask" class="primary">Добавить задачу</button></section>
<div class="confirm" id="confirmBox"><span id="confirmText">Harness просит одноразовое подтверждение действия.</span><button id="confirmAction" class="primary">Подтвердить один раз</button><button id="cancelRun" class="danger">Остановить</button></div>
<main class="board"><section class="column" data-column="queue"><h2>Очередь</h2><div class="cards" id="queueCards"></div></section><section class="column" data-column="running"><h2>В работе</h2><div class="cards" id="runningCards"></div></section><section class="column" data-column="done"><h2>Готово</h2><div class="cards" id="doneCards"></div></section></main>
<div class="statusline"><strong id="runStatus">Ожидание</strong><span id="runProgress" class="version"></span><button id="cancelBtn" class="ghost">Остановить текущую</button></div><section class="logs" id="logs" aria-live="polite"></section>
</div>
<script src="workbench.js"></script>
</body></html>
