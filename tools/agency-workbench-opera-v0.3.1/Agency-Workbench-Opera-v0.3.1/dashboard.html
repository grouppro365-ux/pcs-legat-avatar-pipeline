<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agency Workbench</title>
  <style>
    :root{color-scheme:dark;--bg:#111214;--card:#1b1d20;--line:#31343a;--text:#f2f2f2;--muted:#a4a7ad;--good:#4fd18b;--warn:#ffbf5a;--bad:#ff6b6b;--accent:#d8b45f}
    *{box-sizing:border-box}body{margin:0;width:420px;min-height:560px;background:var(--bg);color:var(--text);font:14px/1.4 Arial,sans-serif}
    header{padding:18px 18px 12px;border-bottom:1px solid var(--line)}h1{font-size:18px;margin:0 0 4px}header p{margin:0;color:var(--muted);font-size:12px}
    main{padding:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    button{border:1px solid var(--line);background:#25282d;color:var(--text);border-radius:10px;padding:9px 11px;cursor:pointer;font-weight:700}button.primary{background:var(--accent);color:#161616;border-color:var(--accent)}button.warn{background:#4b3821;border-color:#7d5c2c}.status{font-size:12px;color:var(--muted);margin-top:8px;word-break:break-all}.ok{color:var(--good)}.bad{color:var(--bad)}
    textarea{width:100%;min-height:105px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:#101114;color:var(--text);padding:10px;font:inherit}.label{font-size:12px;color:var(--muted);margin-bottom:7px}.log{height:180px;overflow:auto;background:#0d0e10;border:1px solid var(--line);border-radius:10px;padding:9px;font:12px/1.45 Consolas,monospace;white-space:pre-wrap}.entry{margin-bottom:5px}.success{color:var(--good)}.warning{color:var(--warn)}.error{color:var(--bad)}
    .small{font-size:11px;color:var(--muted)}
  </style>
</head>
<body>
<header><h1>Agency Workbench</h1><p>Открытый ChatGPT → сайт → действие → проверка</p></header>
<main>
  <section class="card">
    <div class="label">1. Привязка вкладок</div>
    <div class="row"><button id="bindChat">Привязать ChatGPT</button><button id="bindTarget">Привязать этот сайт</button></div>
    <div id="chatStatus" class="status">ChatGPT: не привязан</div>
    <div id="targetStatus" class="status">Сайт: не привязан</div>
    <div class="row" style="margin-top:9px"><button id="testChat">Тест ChatGPT</button></div>
  </section>

  <section class="card">
    <div class="label">2. Задача</div>
    <textarea id="task" placeholder="Например: создай материал по сценарию, заполни поля и проверь результат"></textarea>
    <div class="row" style="margin-top:9px"><button id="run" class="primary">Выполнить</button><button id="confirm" class="warn" hidden>Подтвердить действие</button></div>
    <div id="runStatus" class="status"></div>
  </section>

  <section class="card">
    <div class="label">Журнал выполнения</div>
    <div id="log" class="log"></div>
    <div class="small" style="margin-top:7px">Если что-то ломается — скрин этого журнала сразу показывает точку обрыва.</div>
  </section>
</main>
<script src="dashboard.js"></script>
</body>
</html>
